  alt_text: Two-column diagram comparing the retired five-domain KCNA blueprint on
    the left with the current four-domain blueprint on the right. Kubernetes Fundamentals
    moves from 46 percent to 44 percent, Container Orchestration from 22 to 28 percent,
    Cloud Native Application Delivery from 8 to 16 percent. Cloud Native Architecture
    at 16 percent and Cloud Native Observability at 8 percent merge into a single
    Cloud Native Architecture domain at 12 percent, with Observability folded in as
    a competency rather than remaining a standalone domain.
