  alt_text: A map of the book's six Parts against the four KCNA exam domains. Part
    one, Orientation, covers Chapter 1 and carries no exam weight. Part two, Kubernetes
    Fundamentals, covers Chapters 2 to 8 and maps to the Kubernetes Fundamentals domain
    at 44 percent. Part three, Container Orchestration, covers Chapters 9 to 13 and
    maps to Container Orchestration at 28 percent. Part four, Application Delivery,
    covers Chapters 14 to 16 and maps to Cloud Native Application Delivery at 16 percent.
    Part five, Cloud Native Architecture, covers Chapters 17 to 18 and maps to Cloud
    Native Architecture at 12 percent. Part six, Departure, covers Chapters 19 to
    20 for synthesis and the mock exam, and carries no exam weight. Parts two through
    five map one to one onto the four exam domains.
