        <text x="132" y="472" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Cloud Native</text>
        <text x="132" y="492" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Architecture</text>
        <text x="132" y="524" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="500">16%</text>
      </g>

      <g>
        <rect x="32" y="576" width="200" height="96" rx="6" fill="#F5EFE4" stroke="#1F4A4E" stroke-width="1"></rect>
        <text x="132" y="600" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Cloud Native</text>
        <text x="132" y="620" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Observability</text>
        <text x="132" y="652" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="500">8%</text>
      </g>

      <!-- Current column -->
      <g>
        <rect x="328" y="64" width="200" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1.2"></rect>
        <text x="428" y="88" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Kubernetes</text>
        <text x="428" y="108" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Fundamentals</text>
        <text x="428" y="136" text-anchor="middle" fill="#B58B3E" stroke="#0B1E3B" stroke-width="0.8" paint-order="stroke" font-family="'Fira Sans', sans-serif" font-size="24" font-weight="700">44%</text>
        <text x="428" y="152" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em">(−2)</text>
      </g>

