        <text x="132" y="344" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Cloud Native</text>
        <text x="132" y="364" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">App Delivery</text>
        <text x="132" y="396" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="500">8%</text>
      </g>

