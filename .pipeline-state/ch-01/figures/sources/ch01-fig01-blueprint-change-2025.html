<!DOCTYPE html>

<title>KCNA Blueprint: Five Domains to Four</title>

<style>

<body>
  <div class="frame">
    <p class="eyebrow">Ch. 01 &middot; KCNA Blueprint Change</p>
    <h1>Five Domains to Four: The 2025 KCNA Reweight</h1>
    <p class="subtitle">Three domains shifted weight, and Observability folded into Architecture as a competency&mdash;recognize this shape to spot outdated five-domain study material.</p>

    <svg viewBox="0 0 560 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch01-fig01-blueprint-change-2025-title ch01-fig01-blueprint-change-2025-desc">
      <title id="ch01-fig01-blueprint-change-2025-title">KCNA blueprint change: five domains to four (2025)</title>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      </defs>

      <text x="328" y="28" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">CURRENT &middot; 4 DOMAINS</text>

      <line x1="328" y1="40" x2="528" y2="40" stroke="#8A8D90" stroke-width="0.8"/>

      <!-- Connectors (drawn before nodes) -->
      <line x1="232" y1="112" x2="328" y2="112" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="240" x2="328" y2="240" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="368" x2="328" y2="368" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Architecture (retired) -> merge dot, entering top -->
      <path d="M232,496 H272 Q280,496 280,504 V556" fill="none" stroke="#1F4A4E" stroke-width="1.2"/>
      <!-- Observability (retired) -> merge dot, entering bottom -->
      <path d="M232,624 H272 Q280,624 280,616 V564" fill="none" stroke="#1F4A4E" stroke-width="1.2"/>

        <text x="428" y="264" text-anchor="middle" fill="#B58B3E" stroke="#0B1E3B" stroke-width="0.8" paint-order="stroke" font-family="'Fira Sans', sans-serif" font-size="24" font-weight="700">28%</text>

      <g>

        <text x="428" y="344" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Cloud Native</text>
        <text x="428" y="364" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">App Delivery</text>
        <text x="428" y="392" text-anchor="middle" fill="#B58B3E" stroke="#0B1E3B" stroke-width="0.8" paint-order="stroke" font-family="'Fira Sans', sans-serif" font-size="24" font-weight="700">16%</text>
        <text x="428" y="408" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em">(&times;2)</text>
      </g>

      <g>
        <rect x="328" y="512" width="200" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1.2"/>
        <text x="428" y="536" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Cloud Native</text>
        <text x="428" y="556" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Architecture</text>
        <text x="428" y="584" text-anchor="middle" fill="#B58B3E" stroke="#0B1E3B" stroke-width="0.8" paint-order="stroke" font-family="'Fira Sans', sans-serif" font-size="24" font-weight="700">12%</text>

      <!-- Editorial caption -->
      <text x="280" y="700" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16">Observability folds into Architecture as a</text>
