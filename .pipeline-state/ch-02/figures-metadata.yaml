  alt_text: 'A decision tree. Root question: was imagePullPolicy set explicitly? On
    the YES branch, three policies: Always, which resolves the name to a digest and
    reuses the local cache on a match; IfNotPresent, which pulls only if the image
    is absent; and Never, which never fetches and fails if the image is absent. On
    the NO branch, a second question asks the reference form, fanning to four outcomes:
    a digest defaults to IfNotPresent, the :latest tag defaults to Always, no tag
    defaults to Always, and any other tag defaults to IfNotPresent.'
