  alt_text: 'A vertical chain. At the top, the kubelet, the node agent Kubernetes
    ships. A connector descends across a heavy horizontal boundary labelled CRI, annotated:
    Kubernetes defines this line and implements nothing below it. Below the boundary,
    a socket into which exactly one conformant CRI runtime plugs — containerd or CRI-O.
    Below the socket, runC, which starts a running process.'
