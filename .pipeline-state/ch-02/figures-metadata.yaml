  alt_text: 'Two stacks side by side. On the left, virtual machines: hardware, host
    OS, then a hypervisor, then three columns each containing a guest OS with an app
    above it — three operating system copies for three apps. On the right, containers:
    hardware, host OS, then a single container runtime with three apps sitting directly
    on it — one operating system for three apps. The guest OS row present three times
    on the left is absent entirely on the right.'
