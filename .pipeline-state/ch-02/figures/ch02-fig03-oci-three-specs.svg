<svg viewBox="0 0 600 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch02-fig03-oci-three-specs-title ch02-fig03-oci-three-specs-desc" width="560" height="695">
    <title id="ch02-fig03-oci-three-specs-title">OCI's three specifications across an image's life</title>
    <desc id="ch02-fig03-oci-three-specs-desc">Three specification boxes -- image-spec, distribution-spec, and runtime-spec -- each connect down to the stage they govern in a vertical flow: an OCI Image is pulled, unpacked into a filesystem bundle, and run to produce a running container.</desc>

    <defs>
      <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- Governs: image-spec -> OCI Image (top edge) -->
    <path d="M108,120 L108,132 Q108,140 116,140 L192,140 Q200,140 200,148 L200,152" fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"></path>

    <!-- Governs: distribution-spec -> unpack (top edge), routed clear of the OCI Image box -->
    <path d="M300,120 L300,132 Q300,140 308,140 L452,140 Q460,140 460,148 L460,262 Q460,270 452,270 L348,270 Q340,270 340,278 L340,288" fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"></path>

    <!-- Governs: runtime-spec -> running container (top edge), routed clear of unpack + filesystem bundle -->
    <path d="M492,120 L492,502 Q492,510 484,510 L348,510 Q340,510 340,518 L340,544" fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"></path>

    <!-- Flow: OCI Image to unpack, PULL (focal) -->
    <path d="M300,224 L300,288" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arr-accent)"></path>
    <rect x="307" y="246" width="44" height="18" rx="2" fill="#F5EFE4"></rect>
    <text x="329" y="259" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PULL</text>

    <!-- Flow: unpack -> filesystem bundle -->
    <path d="M300,360 L300,408" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></path>

    <!-- Flow: filesystem bundle -> running container (the runtime-spec "run" transition) -->
    <path d="M300,480 L300,544" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></path>

    <!-- ============ SPEC ROW ============ -->

    <!-- image-spec -->
    <rect x="24" y="24" width="168" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="108" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">image-spec</text>
    <text x="108" y="72" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the <tspan font-weight="700" fill="#0B1E3B">FORMAT</tspan> of</text>
    <text x="108" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the artifact</text>

    <!-- distribution-spec (FOCAL) -->
    <rect x="216" y="24" width="168" height="96" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="300" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">distribution-</text>
    <text x="300" y="68" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">spec</text>
    <text x="300" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the API for <tspan font-weight="700" fill="#0B1E3B">MOVING</tspan></text>
    <text x="300" y="108" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">it over the wire</text>

    <!-- runtime-spec -->
    <rect x="408" y="24" width="168" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="492" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">runtime-spec</text>
    <text x="492" y="72" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">how to <tspan font-weight="700" fill="#0B1E3B">RUN</tspan> a</text>
    <text x="492" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- ============ FLOW COLUMN ============ -->

    <!-- OCI Image -->
    <rect x="160" y="152" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="194" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">OCI Image</text>

    <!-- unpack -->
    <rect x="160" y="288" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="330" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">unpack</text>

    <!-- filesystem bundle -->
    <rect x="160" y="408" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="450" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- running container (terminal node) -->
    <rect x="160" y="544" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="586" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">running container</text>

    <!-- ============ LEGEND ============ -->

    <line x1="24" y1="656" x2="576" y2="656" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="24" y="676" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <rect x="24" y="688" width="20" height="14" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="52" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">FOCAL — REGISTRY API</text>

    <path d="M230,697 L262,697" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"></path>
    <text x="270" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">GOVERNS</text>

    <path d="M420,697 L452,697" stroke="#1F4A4E" stroke-width="1"></path>
    <text x="460" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">DATA FLOW</text>

  </svg>