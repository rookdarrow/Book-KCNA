  <p class="eyebrow">Ch. 02 · Fig. 01 · Deployment</p>
  <h1>VMs vs. Containers</h1>
  <p class="subtitle">Same three apps, two different foundations — the guest OS disappears when the kernel is shared.</p>

      <desc id="ch02-fig01-vm-vs-container-stack-desc">Two deployment stacks on the same hardware and host OS: on the left, three apps each require their own guest OS under a hypervisor; on the right, the same three apps share one container runtime directly, with no guest OS layer at all.</desc>

      <text x="564" y="582" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em">ONE OS · three apps</text>

      <text x="380" y="624" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16">The only row that changes: Guest OS — three times on the left, none on the right.</text>

      <text x="32" y="680" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em">LEGEND</text>
