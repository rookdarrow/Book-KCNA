<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The OCI's Three Specifications</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4; /* cream */
    --color-ink:    #0B1E3B; /* navy */
    --color-muted:  #1F4A4E; /* teal */
    --color-accent: #B58B3E; /* brass */
    --color-soft:   #8A8D90; /* fog */
    --font-display: 'Roboto Slab', serif;
    --font-sans:    'Fira Sans', sans-serif;
    --font-mono:    'Fira Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow &middot; Chapter 2</p>
    <h1>The OCI's Three Specifications</h1>

    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch02-fig03-title ch02-fig03-desc">
      <title id="ch02-fig03-title">The three OCI specifications and the stages they govern</title>
      <desc id="ch02-fig03-desc">Three specification boxes, image-spec, distribution-spec, and runtime-spec, each send a dashed governs arrow down to the lifecycle stage it controls, while a solid teal data-flow arrow traces an OCI Image being pulled, unpacked into a filesystem bundle, and run as a running container; distribution-spec, which governs the registry transfer API, is the figure's sole focal element. Kubernetes appears nowhere in the figure.</desc>

      <defs>
        <marker id="arrow-fog" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8A8D90"/>
        </marker>
        <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ===================== ARROWS (drawn before nodes) ===================== -->

      <!-- GOVERNS: image-spec -> OCI Image -->
      <line x1="180" y1="248" x2="180" y2="320" stroke="#8A8D90" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-fog)"/>
      <!-- GOVERNS: distribution-spec -> unpack -->
      <line x1="460" y1="248" x2="460" y2="320" stroke="#8A8D90" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-fog)"/>
      <!-- GOVERNS: runtime-spec -> filesystem bundle -->
      <line x1="740" y1="248" x2="740" y2="320" stroke="#8A8D90" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-fog)"/>

      <!-- DATA FLOW: OCI Image -> unpack (PULL) -->
      <line x1="288" y1="368" x2="352" y2="368" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow-teal)"/>
      <rect x="300" y="348" width="40" height="12" rx="2" fill="#F5EFE4"/>
      <text x="320" y="357" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">PULL</text>

      <!-- DATA FLOW: unpack -> filesystem bundle (unlabeled) -->
      <line x1="568" y1="368" x2="632" y2="368" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow-teal)"/>

      <!-- DATA FLOW: filesystem bundle -> running container (RUN) -->
      <line x1="848" y1="368" x2="912" y2="368" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow-teal)"/>
      <rect x="860" y="348" width="40" height="12" rx="2" fill="#F5EFE4"/>
      <text x="880" y="357" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">RUN</text>

      <!-- ===================== SPEC ROW ===================== -->

      <!-- image-spec -->
      <rect x="56" y="72" width="248" height="176" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="64" y="80" width="56" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="92" y="94" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">SPEC</text>
      <text x="180" y="124" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">image-spec</text>
      <text x="180" y="146" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">oci-image-spec</text>
      <text x="180" y="174" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">the <tspan font-weight="600">FORMAT</tspan> of</text>
      <text x="180" y="196" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">the artifact</text>

      <!-- distribution-spec (FOCAL) -->
      <rect x="336" y="72" width="248" height="176" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <rect x="344" y="80" width="56" height="20" rx="4" fill="transparent" stroke="#B58B3E" stroke-width="0.8"/>
      <text x="372" y="94" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="#B58B3E">SPEC</text>
      <text x="460" y="124" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">distribution-spec</text>
      <text x="460" y="146" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">oci-distribution-spec</text>
      <text x="460" y="174" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">the API for <tspan font-weight="600">MOVING</tspan></text>
      <text x="460" y="196" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">it over the wire</text>

      <!-- runtime-spec -->
      <rect x="616" y="72" width="248" height="176" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="624" y="80" width="56" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="652" y="94" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">SPEC</text>
      <text x="740" y="124" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">runtime-spec</text>
      <text x="740" y="146" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">oci-runtime-spec</text>
      <text x="740" y="174" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">how to <tspan font-weight="600">RUN</tspan> a</text>
      <text x="740" y="196" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">filesystem bundle</text>

      <!-- ===================== LIFECYCLE ROW ===================== -->

      <!-- OCI Image -->
      <rect x="72" y="320" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="80" y="328" width="64" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="112" y="342" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">STAGE</text>
      <text x="180" y="376" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">OCI Image</text>

      <!-- unpack -->
      <rect x="352" y="320" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="360" y="328" width="64" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="392" y="342" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">STAGE</text>
      <text x="460" y="376" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">unpack</text>

      <!-- filesystem bundle -->
      <rect x="632" y="320" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="640" y="328" width="64" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="672" y="342" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">STAGE</text>
      <text x="740" y="376" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">filesystem bundle</text>

      <!-- running container -->
      <rect x="912" y="320" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="920" y="328" width="64" height="20" rx="4" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="952" y="342" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="rgba(11,30,59,0.7)">STAGE</text>
      <text x="1020" y="376" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">running container</text>

      <!-- ===================== LEGEND ===================== -->

      <line x1="64" y1="456" x2="1136" y2="456" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="64" y="472" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em" fill="#1F4A4E">LEGEND</text>

      <line x1="64" y1="504" x2="96" y2="504" stroke="#8A8D90" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="104" y="508" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#8A8D90">GOVERNS</text>

      <line x1="444" y1="504" x2="476" y2="504" stroke="#1F4A4E" stroke-width="1.2"/>
      <text x="484" y="508" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#1F4A4E">DATA FLOW</text>

      <rect x="824" y="496" width="16" height="16" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="848" y="508" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#B58B3E">FOCAL &mdash; DISTRIBUTION-SPEC</text>

    </svg>
  </div>
</body>
</html>
