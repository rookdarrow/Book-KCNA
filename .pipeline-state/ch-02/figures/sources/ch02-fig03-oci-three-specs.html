<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The OCI's Three Specifications</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-slab: 'Roboto Slab', serif;
    --font-sans: 'Fira Sans', sans-serif;
    --font-mono: 'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 680px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    color: var(--color-muted);
    margin-bottom: 1.5rem;
    max-width: 56ch;
  }
  svg { width: 100%; display: block; }
  footer {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-soft);
    border-top: 1px solid rgba(11,30,59,0.12);
    margin-top: 1.5rem;
    padding-top: 0.75rem;
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Chapter 2 &middot; Figure 3</p>
  <h1>Three Specs, One Image's Life</h1>
  <p class="subtitle">The OCI splits container standards into three specifications, each governing a distinct stage between an image and a running process.</p>

  <svg viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oci-three-specs-title oci-three-specs-desc">
    <title id="oci-three-specs-title">OCI's three specifications and what each one governs</title>
    <desc id="oci-three-specs-desc">Three specification boxes -- image-spec governing the image artifact's format, distribution-spec governing the pull across the registry API, and runtime-spec governing how the unpacked filesystem bundle is run -- each connect by a dashed line to the stage of an image's lifecycle they govern, shown below as a solid chain: an OCI Image is pulled, unpacked into a filesystem bundle, then run.</desc>

    <defs>
      <marker id="arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/>
      </marker>
      <marker id="arr-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#8A8D90"/>
      </marker>
      <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <!-- ============ GOVERNANCE ARROWS (dashed -- spec governs stage), drawn before boxes ============ -->
    <!-- image-spec -> OCI Image (left edge) -->
    <path d="M124 116 L124 216 Q124 224 132 224 L224 224 Q232 224 232 232"
          fill="none" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr-soft)"/>

    <!-- distribution-spec -> PULL label (focal, accent) -->
    <path d="M340 116 L340 140 Q340 148 348 148 L460 148 Q468 148 468 156 L468 292 Q468 300 460 300 L412 300"
          fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-accent)"/>

    <!-- runtime-spec -> RUN label -->
    <path d="M556 116 L556 540 Q556 548 548 548 L412 548"
          fill="none" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr-soft)"/>

    <!-- ============ LIFECYCLE CHAIN (solid, vertical) ============ -->
    <line x1="340" y1="268" x2="340" y2="332" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arr-ink)"/>
    <line x1="340" y1="404" x2="340" y2="444" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arr-ink)"/>
    <line x1="340" y1="516" x2="340" y2="580" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arr-ink)"/>

    <!-- flow arrow labels -- offset 8px beside the line, never on top of it -->
    <rect x="348" y="288" width="64" height="24" rx="3" fill="#F5EFE4"/>
    <text x="380" y="304" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PULL</text>

    <rect x="348" y="536" width="64" height="24" rx="3" fill="#F5EFE4"/>
    <text x="380" y="552" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RUN</text>

    <!-- ============ SPEC BOXES (row 1) ============ -->
    <!-- image-spec -->
    <rect x="24" y="20" width="200" height="96" rx="6" fill="#F5EFE4"/>
    <rect x="24" y="20" width="200" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="124" y="56" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">image-spec</text>
    <text x="124" y="80" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the FORMAT of</text>
    <text x="124" y="100" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the artifact</text>

    <!-- distribution-spec -- FOCAL: governs the registry API -->
    <rect x="240" y="20" width="200" height="96" rx="6" fill="#F5EFE4"/>
    <rect x="240" y="20" width="200" height="96" rx="6" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="340" y="56" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">distribution-spec</text>
    <text x="340" y="80" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the API for MOVING</text>
    <text x="340" y="100" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">it over the wire</text>

    <!-- runtime-spec -->
    <rect x="456" y="20" width="200" height="96" rx="6" fill="#F5EFE4"/>
    <rect x="456" y="20" width="200" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="556" y="56" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">runtime-spec</text>
    <text x="556" y="80" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">how to RUN a</text>
    <text x="556" y="100" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- ============ LIFECYCLE NODES (vertical chain) ============ -->
    <rect x="232" y="196" width="216" height="72" rx="6" fill="#F5EFE4"/>
    <rect x="232" y="196" width="216" height="72" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="236" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">OCI Image</text>

    <rect x="232" y="332" width="216" height="72" rx="6" fill="#F5EFE4"/>
    <rect x="232" y="332" width="216" height="72" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="372" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">unpack</text>

    <rect x="232" y="444" width="216" height="72" rx="6" fill="#F5EFE4"/>
    <rect x="232" y="444" width="216" height="72" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="484" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- ============ LEGEND (bottom strip) ============ -->
    <line x1="24" y1="616" x2="656" y2="616" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="24" y="640" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <line x1="140" y1="636" x2="172" y2="636" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr-soft)"/>
    <text x="180" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">GOVERNS</text>

    <line x1="320" y1="636" x2="352" y2="636" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arr-ink)"/>
    <text x="360" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">FLOW</text>
  </svg>

  <footer>ch02-fig03-oci-three-specs &middot; data flow &middot; Lodestar Ledgers</footer>
</div>
</body>
</html>
