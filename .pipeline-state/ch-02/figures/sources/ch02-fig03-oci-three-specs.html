<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCI's Three Specifications</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-accent: #B58B3E;
    --font-sans:  'Fira Sans', system-ui, sans-serif;
    --font-slab:  'Roboto Slab', serif;
    --font-mono:  'Fira Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .frame { max-width: 560px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: 1.6rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.25rem;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Data Flow &middot; Ch.02 Fig.03</p>
  <h1>OCI's Three Specifications, and What Each One Governs</h1>

  <svg viewBox="0 0 600 744" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ch02-fig03-oci-three-specs-title ch02-fig03-oci-three-specs-desc">
    <title id="ch02-fig03-oci-three-specs-title">OCI's three specifications across an image's life</title>
    <desc id="ch02-fig03-oci-three-specs-desc">Three specification boxes -- image-spec, distribution-spec, and runtime-spec -- each connect down to the stage they govern in a vertical flow: an OCI Image is pulled, unpacked into a filesystem bundle, and run to produce a running container.</desc>

    <defs>
      <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
      </marker>
      <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- Governs: image-spec -> OCI Image (top edge) -->
    <path d="M108,120 L108,132 Q108,140 116,140 L192,140 Q200,140 200,148 L200,152"
          fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

    <!-- Governs: distribution-spec -> unpack (top edge), routed clear of the OCI Image box -->
    <path d="M300,120 L300,132 Q300,140 308,140 L452,140 Q460,140 460,148 L460,262 Q460,270 452,270 L348,270 Q340,270 340,278 L340,288"
          fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

    <!-- Governs: runtime-spec -> running container (top edge), routed clear of unpack + filesystem bundle -->
    <path d="M492,120 L492,502 Q492,510 484,510 L348,510 Q340,510 340,518 L340,544"
          fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

    <!-- Flow: OCI Image to unpack, PULL (focal) -->
    <path d="M300,224 L300,288" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arr-accent)"/>
    <rect x="307" y="246" width="44" height="18" rx="2" fill="#F5EFE4"/>
    <text x="329" y="259" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">PULL</text>

    <!-- Flow: unpack -> filesystem bundle -->
    <path d="M300,360 L300,408" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>

    <!-- Flow: filesystem bundle -> running container (the runtime-spec "run" transition) -->
    <path d="M300,480 L300,544" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>

    <!-- ============ SPEC ROW ============ -->

    <!-- image-spec -->
    <rect x="24" y="24" width="168" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="108" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">image-spec</text>
    <text x="108" y="72" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the <tspan font-weight="700" fill="#0B1E3B">FORMAT</tspan> of</text>
    <text x="108" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the artifact</text>

    <!-- distribution-spec (FOCAL) -->
    <rect x="216" y="24" width="168" height="96" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="300" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">distribution-</text>
    <text x="300" y="68" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">spec</text>
    <text x="300" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the API for <tspan font-weight="700" fill="#0B1E3B">MOVING</tspan></text>
    <text x="300" y="108" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">it over the wire</text>

    <!-- runtime-spec -->
    <rect x="408" y="24" width="168" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="492" y="50" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">runtime-spec</text>
    <text x="492" y="72" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">how to <tspan font-weight="700" fill="#0B1E3B">RUN</tspan> a</text>
    <text x="492" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- ============ FLOW COLUMN ============ -->

    <!-- OCI Image -->
    <rect x="160" y="152" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="300" y="194" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">OCI Image</text>

    <!-- unpack -->
    <rect x="160" y="288" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="300" y="330" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">unpack</text>

    <!-- filesystem bundle -->
    <rect x="160" y="408" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="300" y="450" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">filesystem bundle</text>

    <!-- running container (terminal node) -->
    <rect x="160" y="544" width="280" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
    <text x="300" y="586" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">running container</text>

    <!-- ============ LEGEND ============ -->

    <line x1="24" y1="656" x2="576" y2="656" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="24" y="676" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace"
          letter-spacing="0.12em">LEGEND</text>

    <rect x="24" y="688" width="20" height="14" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="52" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">FOCAL &mdash; REGISTRY API</text>

    <path d="M230,697 L262,697" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="270" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">GOVERNS</text>

    <path d="M420,697 L452,697" stroke="#1F4A4E" stroke-width="1"/>
    <text x="460" y="700" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">DATA FLOW</text>

  </svg>
</div>
</body>
</html>
