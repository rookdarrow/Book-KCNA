    alt: figures/ch02-fig05-imagepullpolicy-decision.alt.txt
  validation_rules:
    max_labels: 7
    grayscale_legibility: required
    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: flowchart
  figure_spec:
    anchor_id: ch02-fig05-imagepullpolicy-decision
    diagram_type: flowchart
    source_ascii: "                    was imagePullPolicy set explicitly?\n     \
      \                     │                    │\n                         YES \
      \                  NO\n                          │                    │\n  \
      \      ┌─────────────────┴───────┐            │\n        │ Always          \
      \        │      reference form?\n        │  → resolve to digest;   │       \
      \     │\n        │    reuse cache if match │   ┌────────┼────────┬──────────┐\n\
      \        │ IfNotPresent            │   │        │        │          │\n    \
      \    │  → pull only if absent  │ @digest :latest   no tag    :other\n      \
      \  │ Never                   │   │        │        │          │\n        │ \
      \ → never fetch; fail if │   ▼        ▼        ▼          ▼\n        │    absent\
      \               │ IfNot-  Always   Always    IfNot-\n        └─────────────────────────┘\
      \ Present                    Present\n"
    vendor_terms:
    - imagePullPolicy
    - kubelet
    complexity_hint:
      node_count: 11
      edge_count: 10
      label_count: 16
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      learning_outcome: State the three imagePullPolicy values and predict the default
        policy from an image reference's form
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the :latest to Always path — the default nobody
        chooses on purpose
    accessibility:
      alt_text_seed: 'A decision tree. Root question: was imagePullPolicy set explicitly?
        On the YES branch, three policies: Always, which resolves the name to a digest
        and reuses the local cache on a match; IfNotPresent, which pulls only if the
        image is absent; and Never, which never fetches and fails if the image is
        absent. On the NO branch, a second question asks the reference form, fanning
        to four outcomes: a digest defaults to IfNotPresent, the :latest tag defaults
        to Always, no tag defaults to Always, and any other tag defaults to IfNotPresent.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Reproduces Kubernetes API field names and documented default behavior
        as text labels; no logos or documentation artwork, tree composed for this
        book.
