    source_ascii: "        LAYERS                                 IDENTITY\n\n   image\
      \ A      image B                ┌──────────────────────────┐\n  ┌─────────┐\
      \  ┌─────────┐             │   sha256:9f2c…be41       │\n  │   app   │  │  \
      \ app   │             │   digest = content hash  │\n  ├─────────┤  ├─────────┤\
      \             │   immutable              │\n  │ shared  │══│ shared  │     \
      \        └──────────────────────────┘\n  │  base   │  │  base   │          \
      \        ▲                ▲\n  └─────────┘  └─────────┘            ───────┘\
      \         ┄┄┄┄┄┄┄┘\n                                      solid            dashed\n\
      \   both manifests name               ┌──────┐         ┌──────┐\n   the SAME\
      \ base layer               │ :v2  │         │ :v2  │\n   → stored once     \
      \                └──────┘         └──────┘\n                               \
      \       today          next week\n\n                                  a tag\
      \ is a LABEL — it can be\n                                  moved to point at\
      \ a different image\n"
    vendor_terms: []
    complexity_hint:
      node_count: 7
      edge_count: 3
      label_count: 15
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Distinguish a movable tag from an immutable content digest,
        and explain why images built from a common base share that layer
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the dashed arrow from next week's :v2 tag, resolving
        to different content than today's
    accessibility:
      alt_text_seed: 'Left: two image stacks, image A and image B, each with an app
        layer above a shared base layer, the two base layers joined to show they are
        one stored layer named by both manifests. Right: a card showing a truncated
        digest sha256:9f2c...be41 labelled content hash and immutable, with two identical
        :v2 tag boxes below it — one labelled today connected by a solid arrow, one
        labelled next week connected by a dashed arrow to a different point, showing
        that a tag is a label that can be moved to point at a different image.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders: []
      clearance: own_interpretation
      notes: Generic layer and tag semantics; no vendor marks, no registry product
