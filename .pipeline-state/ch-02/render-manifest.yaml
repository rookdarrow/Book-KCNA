    diagram_type: deployment_diagram
    source_ascii: "        VIRTUAL MACHINES                       CONTAINERS\n\n \
      \  ┌──────┐ ┌──────┐ ┌──────┐          ┌──────┐ ┌──────┐ ┌──────┐\n   │ App\
      \  │ │ App  │ │ App  │          │ App  │ │ App  │ │ App  │\n   ├──────┤ ├──────┤\
      \ ├──────┤          └──┬───┘ └──┬───┘ └──┬───┘\n   │Guest │ │Guest │ │Guest\
      \ │             │        │        │\n   │  OS  │ │  OS  │ │  OS  │         \
      \ ┌──┴────────┴────────┴──┐\n   └──┬───┘ └──┬───┘ └──┬───┘          │   container\
      \ runtime    │\n      │        │        │              ├────────────────────────┤\n\
      \   ┌──┴────────┴────────┴──┐           │        host OS         │\n   │   \
      \   hypervisor        │          ├────────────────────────┤\n   ├────────────────────────┤\
      \          │       hardware         │\n   │        host OS         │       \
      \   └────────────────────────┘\n   ├────────────────────────┤\n   │       hardware\
      \         │           ONE OS · three apps\n   └────────────────────────┘\n \
      \   THREE OS COPIES · three apps\n"
    vendor_terms: []
    complexity_hint:
      node_count: 15
      edge_count: 6
      label_count: 19
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      learning_outcome: Derive every VM-versus-container difference from the single
        fact that containers share the host kernel instead of booting a guest OS
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the repeated Guest OS row on the VM side, and its
        absence on the container side
    accessibility:
      alt_text_seed: 'Two stacks side by side. On the left, virtual machines: hardware,
        host OS, then a hypervisor, then three columns each containing a guest OS
        with an app above it — three operating system copies for three apps. On the
        right, containers: hardware, host OS, then a single container runtime with
        three apps sitting directly on it — one operating system for three apps. The
        guest OS row present three times on the left is absent entirely on the right.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders: []
      clearance: own_interpretation
      notes: No vendor marks or logos in the figure; all labels generic. Well-known
        prior art exists in the kubernetes.io deployment-evolution graphic (CC-BY-4.0),
        so composition is deliberately different — two-panel VM/container comparison
        rather than a three-era progression.
