<svg viewBox="0 0 520 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch03-fig03-deployment-eras-timeline-title ch03-fig03-deployment-eras-timeline-desc" width="640" height="759">
      <title id="ch03-fig03-deployment-eras-timeline-title">Traditional, virtualized, and container deployment stacks</title>
      <desc id="ch03-fig03-deployment-eras-timeline-desc">Three side-by-side layer stacks comparing traditional, virtualized, and container deployment; traditional runs one app on an OS on hardware, virtualized adds a hypervisor and a guest OS per virtual machine, and containers place three apps directly on one shared operating system.</desc>

      <defs>
        <clipPath id="ch03-fig03-clip-traditional">
          <rect x="24" y="232" width="144" height="216" rx="8"></rect>
        </clipPath>
        <clipPath id="ch03-fig03-clip-virtualized">
          <rect x="188" y="88" width="144" height="360" rx="8"></rect>
        </clipPath>
        <clipPath id="ch03-fig03-clip-container">
          <rect x="352" y="232" width="144" height="216" rx="8"></rect>
        </clipPath>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ============ COLUMN HEADERS ============ -->
      <text x="96" y="200" fill="#0B1E3B" font-size="16" font-weight="600" letter-spacing="0.03em" font-family="'Fira Sans', sans-serif" text-anchor="middle">TRADITIONAL</text>
      <line x1="24" y1="216" x2="168" y2="216" stroke="#8A8D90" stroke-width="0.8"></line>

      <text x="260" y="56" fill="#0B1E3B" font-size="16" font-weight="600" letter-spacing="0.03em" font-family="'Fira Sans', sans-serif" text-anchor="middle">VIRTUALIZED</text>
      <line x1="188" y1="72" x2="332" y2="72" stroke="#8A8D90" stroke-width="0.8"></line>

      <text x="424" y="200" fill="#0B1E3B" font-size="16" font-weight="600" letter-spacing="0.03em" font-family="'Fira Sans', sans-serif" text-anchor="middle">CONTAINER</text>
      <line x1="352" y1="216" x2="496" y2="216" stroke="#8A8D90" stroke-width="0.8"></line>

      <!-- ============ TRADITIONAL STACK ============ -->
      <g clip-path="url(#ch03-fig03-clip-traditional)">
        <rect x="24" y="232" width="144" height="72" fill="rgba(11,30,59,0.05)"></rect>
      </g>
      <rect x="24" y="232" width="144" height="216" rx="8" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <line x1="24" y1="304" x2="168" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="24" y1="376" x2="168" y2="376" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

      <text x="96" y="274" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>
      <text x="96" y="346" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">OS</text>
      <text x="96" y="418" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Hardware</text>

      <!-- ============ VIRTUALIZED STACK ============ -->
      <g clip-path="url(#ch03-fig03-clip-virtualized)">
        <rect x="188" y="88" width="144" height="72" fill="rgba(11,30,59,0.05)"></rect>
      </g>
      <rect x="188" y="88" width="144" height="360" rx="8" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <line x1="188" y1="160" x2="332" y2="160" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="188" y1="232" x2="332" y2="232" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="188" y1="304" x2="332" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="188" y1="376" x2="332" y2="376" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="260" y1="88" x2="260" y2="232" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

      <text x="224" y="130" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>
      <text x="296" y="130" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>

      <text fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">
        <tspan x="224" y="190">Guest</tspan>
        <tspan x="224" y="211">OS</tspan>
      </text>
      <text fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">
        <tspan x="296" y="190">Guest</tspan>
        <tspan x="296" y="211">OS</tspan>
      </text>

      <text x="260" y="274" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Hypervisor</text>
      <text x="260" y="346" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Host OS</text>
      <text x="260" y="418" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Hardware</text>

      <!-- ============ CONTAINER STACK ============ -->
      <g clip-path="url(#ch03-fig03-clip-container)">
        <rect x="352" y="232" width="144" height="72" fill="rgba(11,30,59,0.05)"></rect>
      </g>
      <rect x="352" y="232" width="144" height="216" rx="8" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <line x1="352" y1="304" x2="496" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="352" y1="376" x2="496" y2="376" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="400" y1="232" x2="400" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="448" y1="232" x2="448" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

      <text x="376" y="274" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>
      <text x="424" y="274" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>
      <text x="472" y="274" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">App</text>
      <text x="424" y="346" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Shared OS</text>
      <text x="424" y="418" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Hardware</text>

      <!-- ============ FOCAL: SHARES ANNOTATION BAND ============ -->
      <rect x="24" y="472" width="472" height="96" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <line x1="176" y1="472" x2="176" y2="568" stroke="rgba(181,139,62,0.35)" stroke-width="0.8"></line>
      <line x1="344" y1="472" x2="344" y2="568" stroke="rgba(181,139,62,0.35)" stroke-width="0.8"></line>

      <text x="260" y="492" fill="#B58B3E" font-size="14" font-weight="600" letter-spacing="0.12em" font-family="'Fira Mono', monospace" text-anchor="middle">SHARES</text>

      <text fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">
        <tspan x="100" y="524">nothing</tspan>
        <tspan x="100" y="546">(one app per box)</tspan>
      </text>
      <text fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">
        <tspan x="260" y="524">hardware</tspan>
        <tspan x="260" y="546">(own OS per VM)</tspan>
      </text>
      <text x="420" y="535" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">the OS kernel</text>
    </svg>