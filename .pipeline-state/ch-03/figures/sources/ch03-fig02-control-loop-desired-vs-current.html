<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Control Loop Never Stops</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-soft:   #8A8D90;
      --color-accent: #B58B3E;
      --font-sans:  'Fira Sans', system-ui, sans-serif;
      --font-serif: 'Roboto Slab', serif;
      --font-mono:  'Fira Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 560px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; max-width: 460px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Ch.03 Fig.02</p>
    <h1>The Control Loop Never Stops</h1>

    <svg viewBox="0 0 520 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch03-fig02-control-loop-title ch03-fig02-control-loop-desc">
      <title id="ch03-fig02-control-loop-title">Control loop: desired state vs. current state</title>
      <desc id="ch03-fig02-control-loop-desc">A closed four-step cycle with no beginning or end: Compare reads Desired State and Current State, Act to Close the Gap changes Current State, and comparison begins again.</desc>
      <defs>
        <marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <polygon points="0 0, 10 4, 0 8" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
          <polygon points="0 0, 12 5, 0 10" fill="#B58B3E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ===== Connectors (drawn before nodes) ===== -->

      <!-- Spoke: Desired State -> Compare (fixed input, not part of the loop) -->
      <line x1="320" y1="136" x2="320" y2="244" stroke="#1F4A4E" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

      <!-- Loop leg 1: Compare -> Act to Close the Gap (double-rail, thick) -->
      <line x1="336" y1="316" x2="336" y2="424" stroke="#B58B3E" stroke-width="2.8" marker-end="url(#arrow-accent)"/>
      <line x1="344" y1="316" x2="344" y2="424" stroke="#B58B3E" stroke-width="2.8"/>

      <!-- Loop leg 2: Act to Close the Gap -> Current State (double-rail, thick) -->
      <line x1="196" y1="424" x2="196" y2="316" stroke="#B58B3E" stroke-width="2.8" marker-end="url(#arrow-accent)"/>
      <line x1="204" y1="424" x2="204" y2="316" stroke="#B58B3E" stroke-width="2.8"/>

      <!-- Loop leg 3: Current State -> Compare, closing the cycle (double-rail, thick) -->
      <line x1="240" y1="276" x2="280" y2="276" stroke="#B58B3E" stroke-width="2.8" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="284" x2="280" y2="284" stroke="#B58B3E" stroke-width="2.8"/>

      <!-- ===== Nodes ===== -->

      <!-- Desired State -->
      <rect x="160" y="64" width="200" height="72" rx="6" fill="#F5EFE4"/>
      <rect x="160" y="64" width="200" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="260" y="104" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">DESIRED STATE</text>

      <!-- Compare -->
      <rect x="280" y="244" width="200" height="72" rx="6" fill="#F5EFE4"/>
      <rect x="280" y="244" width="200" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="380" y="284" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">COMPARE</text>

      <!-- Current State -->
      <rect x="40" y="244" width="200" height="72" rx="6" fill="#F5EFE4"/>
      <rect x="40" y="244" width="200" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="140" y="284" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">CURRENT STATE</text>

      <!-- Act to Close the Gap -->
      <rect x="160" y="424" width="200" height="72" rx="6" fill="#F5EFE4"/>
      <rect x="160" y="424" width="200" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="260" y="448" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">ACT TO CLOSE</text>
      <text x="260" y="472" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">THE GAP</text>

      <!-- ===== Caption ===== -->
      <text x="260" y="552" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">no start. no end. no exit condition.</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="596" x2="480" y2="596" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="40" y="616" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="start" letter-spacing="0.12em">LEGEND</text>

      <line x1="40" y1="628" x2="64" y2="628" stroke="#B58B3E" stroke-width="2.8"/>
      <line x1="40" y1="636" x2="64" y2="636" stroke="#B58B3E" stroke-width="2.8"/>
      <text x="72" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">CLOSED LOOP</text>

      <line x1="280" y1="632" x2="304" y2="632" stroke="#1F4A4E" stroke-width="1.5"/>
      <text x="312" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">FIXED INPUT</text>
    </svg>
  </div>
</body>
</html>
