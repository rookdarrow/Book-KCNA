<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ch03-fig02-control-loop-desired-vs-current</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F5EFE4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  svg { width: 100%; max-width: 640px; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch03-fig02-control-loop-desired-vs-current-title ch03-fig02-control-loop-desired-vs-current-desc">
  <title id="ch03-fig02-control-loop-desired-vs-current-title">Control loop: desired state versus current state</title>
  <desc id="ch03-fig02-control-loop-desired-vs-current-desc">A closed control loop with no beginning and no end. Desired state, held in etcd, the store, is observed by a controller; the controller acts to close the gap through the API server, the only door in; the API server changes current state, what is actually true, which the controller observes in turn. Captioned no start, no end, no exit condition.</desc>
  <defs>
    <marker id="ch03-fig02-arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
    </marker>
    <marker id="ch03-fig02-arrow-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/>
    </marker>
  </defs>

  <rect width="640" height="760" fill="#F5EFE4"/>

  <!-- Arrows (drawn before boxes) -->

  <!-- DESIRED STATE -> CONTROLLER : observe -->
  <path d="M320,208 L320,272" stroke="#1F4A4E" stroke-width="1.5" fill="none" marker-end="url(#ch03-fig02-arrow-teal)"/>
  <text x="336" y="246" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">OBSERVE</text>

  <!-- CONTROLLER -> API SERVER : act to close the gap -->
  <path d="M 416 320 H 476 Q 484 320 484 328 V 460" stroke="#0B1E3B" stroke-width="1.5" fill="none" marker-end="url(#ch03-fig02-arrow-navy)"/>
  <rect x="336" y="380" width="136" height="20" fill="#F5EFE4"/>
  <text x="404" y="396" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#0B1E3B">ACT: CLOSE GAP</text>

  <!-- API SERVER -> CURRENT STATE : changes -->
  <path d="M384,520 L256,520" stroke="#0B1E3B" stroke-width="1.5" fill="none" marker-end="url(#ch03-fig02-arrow-navy)"/>
  <rect x="284" y="488" width="72" height="20" fill="#F5EFE4"/>
  <text x="320" y="504" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#0B1E3B">CHANGES</text>

  <!-- CURRENT STATE -> CONTROLLER : observe -->
  <path d="M 120 460 V 328 Q 120 320 128 320 H 224" stroke="#1F4A4E" stroke-width="1.5" fill="none" marker-end="url(#ch03-fig02-arrow-teal)"/>
  <rect x="36" y="380" width="76" height="20" fill="#F5EFE4"/>
  <text x="74" y="396" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">OBSERVE</text>

  <!-- DESIRED STATE container -->
  <rect x="180" y="40" width="280" height="168" rx="8" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
  <text x="320" y="68" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">DESIRED STATE</text>

  <!-- etcd double-ruled focal box -->
  <rect x="228" y="112" width="184" height="72" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
  <rect x="236" y="120" width="168" height="56" rx="4" fill="none" stroke="#B58B3E" stroke-width="1"/>
  <text x="320" y="144" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">etcd</text>
  <text x="320" y="164" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">the store</text>

  <!-- CONTROLLER -->
  <rect x="224" y="272" width="192" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
  <text x="320" y="328" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">CONTROLLER</text>

  <!-- CURRENT STATE -->
  <rect x="56" y="460" width="200" height="120" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
  <text x="156" y="500" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">CURRENT STATE</text>
  <text x="156" y="524" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">what is actually true</text>

  <!-- API SERVER -->
  <rect x="384" y="460" width="200" height="120" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
  <text x="484" y="500" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">API SERVER</text>
  <text x="484" y="524" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">the only door in</text>
  <text x="484" y="548" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">kube-apiserver</text>

  <!-- Caption -->
  <text x="320" y="624" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#0B1E3B">no start. no end. no exit condition.</text>

  <!-- Legend -->
  <line x1="56" y1="664" x2="584" y2="664" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
  <text x="56" y="696" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">LEGEND</text>

  <rect x="140" y="688" width="16" height="16" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"/>
  <text x="164" y="696" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">THE STORE</text>

  <line x1="272" y1="696" x2="296" y2="696" stroke="#1F4A4E" stroke-width="2"/>
  <text x="304" y="696" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">OBSERVE</text>

  <line x1="392" y1="696" x2="416" y2="696" stroke="#0B1E3B" stroke-width="2"/>
  <text x="424" y="696" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">ACT / WRITE</text>
</svg>
</body>
</html>
