<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The control loop: comparing desired and current state</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-accent: #B58B3E;
      --font-slab: 'Roboto Slab', serif;
      --font-sans: 'Fira Sans', sans-serif;
      --font-mono: 'Fira Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 760px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-slab);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; max-width: 480px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Lodestar Ledgers</p>
    <h1>The control loop: comparing desired and current state</h1>

    <svg viewBox="0 0 520 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-loop-title control-loop-desc">
      <title id="control-loop-title">The control loop: comparing desired and current state</title>
      <desc id="control-loop-desc">A closed cycle with no beginning or end: compare reads desired state and current state, acting to close the gap changes current state, and comparison begins again.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- Arrows (drawn before nodes) -->
      <!-- Desired state -> Compare: a single read, not part of the ring -->
      <line x1="200" y1="220" x2="200" y2="112" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- The closed cycle (accent): Current -> Compare -> Act -> Current, no start, no end -->
      <line x1="320" y1="220" x2="320" y2="112" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="260" y1="112" x2="260" y2="400" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 348 436 H 412 Q 420 436 420 428 V 292" fill="none" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Nodes -->
      <rect x="172" y="40" width="176" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="260" y="82" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">COMPARE</text>

      <rect x="40" y="220" width="176" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="128" y="262" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">DESIRED STATE</text>

      <rect x="304" y="220" width="176" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="392" y="262" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">CURRENT STATE</text>

      <rect x="172" y="400" width="176" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="260" y="429" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">ACT TO CLOSE</text>
      <text x="260" y="451" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">THE GAP</text>

      <!-- Caption -->
      <text x="260" y="520" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">no start.  no end.  no exit condition.</text>

      <!-- Legend -->
      <line x1="40" y1="552" x2="480" y2="552" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="40" y="572" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

      <line x1="40" y1="596" x2="72" y2="596" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="80" y="601" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Closed cycle, runs forever</text>

      <line x1="40" y1="624" x2="72" y2="624" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="80" y="629" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Read each pass, not part of the loop</text>
    </svg>
  </div>
</body>
</html>
