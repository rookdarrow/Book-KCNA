    source_ascii: "TRADITIONAL              VIRTUALIZED                CONTAINER\n\
      ───────────              ───────────                ─────────\n\n┌───────────┐\
      \          ┌─────┐ ┌─────┐            ┌───┐┌───┐┌───┐\n│    App    │       \
      \   │ App │ │ App │            │App││App││App│\n├───────────┤          ├─────┤\
      \ ├─────┤            └───┘└───┘└───┘\n│    OS     │          │Guest│ │Guest│\
      \            ┌─────────────┐\n├───────────┤          │ OS  │ │ OS  │       \
      \     │  Shared OS  │\n│ Hardware  │          ├─────┴─┴─────┤            ├─────────────┤\n\
      └───────────┘          │  Hypervisor │            │  Hardware   │\n        \
      \               ├─────────────┤            └─────────────┘\nshares: nothing\
      \        │  Host OS    │\n(one app per box)      ├─────────────┤           \
      \ shares: the OS\n                       │  Hardware   │            kernel\n\
      \                       └─────────────┘\n                       shares: hardware\n\
      \                       (own OS per VM)\n"
    vendor_terms: []
    complexity_hint:
      node_count: 15
      edge_count: 0
      label_count: 21
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - temporal_structure
      - spatial_structure
      learning_outcome: Explain what each deployment era shares at the machine level,
        and why the container era changes the management problem
      fixed_point_emphasis: true
      fixed_point_emphasis_target: 'the bottom row of shares: annotations, read across
        all three panels'
    accessibility:
      alt_text_seed: Three side-by-side layer stacks comparing traditional, virtualized,
        and container deployment; traditional runs one app on an OS on hardware, virtualized
        adds a hypervisor and a guest OS per virtual machine, and containers place
        three apps directly on one shared operating system
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
