  alt_text: 'A single box labelled THE FILED DECLARATION, what should be true, connected
    to five separate readers below it: a scheduler, a controller, a kubelet, and two
    more controllers, each annotated as consulting the record at a different time
    — 09:00, 09:04, 09:04, 11:20 and 03:17. Text beneath reads: no hand receives an
    instruction; every hand reads the record, observes the world, and closes the gap.'
