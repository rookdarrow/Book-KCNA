<svg viewBox="0 0 560 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="declaration-not-order-title declaration-not-order-desc" width="520" height="558">
      <title id="declaration-not-order-title">One filed declaration read by five independent components</title>
      <desc id="declaration-not-order-desc">Concept map showing one filed declaration read independently by a scheduler, three controllers, and a kubelet at five different times, with no instruction passed directly between them.</desc>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Connectors (drawn before nodes) -->
      <path d="M 280 104 L 280 240" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 120 144 L 440 144" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 120 144 L 120 240" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 440 144 L 440 240" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 200 144 L 200 336" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 360 144 L 360 336" fill="none" stroke="#1F4A4E" stroke-width="1"></path>

      <!-- Shared relationship label, beside the trunk -->
      <text x="292" y="128" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.10em" text-anchor="start">CONSULTED AT</text>

      <!-- Per-reader timestamps, beside each drop -->
      <text x="128" y="196" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">09:00</text>
      <text x="288" y="196" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">09:04</text>
      <text x="448" y="196" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">09:04</text>
      <text x="208" y="196" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">11:20</text>
      <text x="368" y="196" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">03:17</text>

      <!-- Root: THE FILED DECLARATION (focal) -->
      <rect x="120" y="40" width="320" height="64" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="280" y="68" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">THE FILED DECLARATION</text>
      <text x="280" y="90" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(what should be true)</text>

      <!-- Row A: scheduler, controller, kubelet -->
      <rect x="50" y="240" width="140" height="56" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="120" y="274" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">a scheduler</text>

      <rect x="210" y="240" width="140" height="56" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="280" y="274" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">a controller</text>

      <rect x="370" y="240" width="140" height="56" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="440" y="274" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">a kubelet</text>

      <!-- Row B: two more controllers -->
      <rect x="130" y="336" width="140" height="56" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="200" y="370" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">a controller</text>

      <rect x="290" y="336" width="140" height="56" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="360" y="370" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">a controller</text>

      <!-- Editorial close -->
      <text x="280" y="432" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">No hand receives an instruction.</text>
      <text x="280" y="456" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Every hand reads the record, observes the world,</text>
      <text x="280" y="480" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">and closes the gap.</text>

      <!-- Legend -->
      <line x1="50" y1="512" x2="510" y2="512" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="50" y="528" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.10em">LEGEND</text>

      <rect x="50" y="544" width="16" height="12" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"></rect>
      <text x="74" y="554" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Filed declaration</text>

      <rect x="300" y="544" width="16" height="12" rx="2" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="324" y="554" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Independent reader</text>
    </svg>