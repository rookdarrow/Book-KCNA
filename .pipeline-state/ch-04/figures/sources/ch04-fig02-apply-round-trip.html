<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The apply round trip</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F5EFE4;
      --color-ink:     #0B1E3B;
      --color-muted:   #1F4A4E;
      --color-soft:    #8A8D90;
      --color-accent:  #B58B3E;
      --font-sans:     'Fira Sans', sans-serif;
      --font-serif:    'Roboto Slab', serif;
      --font-mono:     'Fira Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 900px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 1.6vw + 1.1rem, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Kubernetes control plane</p>
    <h1>The apply round trip</h1>

    <svg viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch04-fig02-apply-round-trip-title ch04-fig02-apply-round-trip-desc">
      <title id="ch04-fig02-apply-round-trip-title">The apply round trip and the reconcile loop</title>
      <desc id="ch04-fig02-apply-round-trip-desc">A vertical flow from manifest.yaml through kubectl apply into kube-apiserver, which writes the record to etcd. A controller watches the API server, compares spec against status, acts when they differ, and reality changes so status is updated; an arrow returns to the compare step, forming a loop that never ends.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ===== Arrows (drawn before boxes) ===== -->

      <!-- manifest.yaml -> kube-apiserver -->
      <line x1="240" y1="80" x2="240" y2="124" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="252" y="92" width="192" height="20" rx="2" fill="#F5EFE4"/>
      <text x="258" y="106" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">kubectl apply -f</text>

      <!-- kube-apiserver -> etcd -->
      <line x1="360" y1="160" x2="460" y2="160" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="132" width="72" height="20" rx="2" fill="#F5EFE4"/>
      <text x="412" y="146" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WRITES</text>

      <!-- kube-apiserver -> compare (controller watches) -->
      <line x1="240" y1="196" x2="240" y2="284" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="252" y="228" width="200" height="20" rx="2" fill="#F5EFE4"/>
      <text x="258" y="242" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">a controller watches</text>

      <!-- compare -> reality changes -->
      <line x1="240" y1="364" x2="240" y2="444" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="252" y="392" width="200" height="20" rx="2" fill="#F5EFE4"/>
      <text x="258" y="406" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">they differ, it acts</text>

      <!-- reality changes -> status is updated -->
      <line x1="240" y1="508" x2="240" y2="548" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LOOP: status is updated -> compare (focal, brass, never stops) -->
      <path d="M 350 580 L 608 580 Q 616 580 616 572 L 616 332 Q 616 324 608 324 L 380 324"
            fill="none" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

      <!-- ===== Nodes ===== -->

      <!-- manifest.yaml (oval = start / artifact) -->
      <rect x="140" y="32" width="200" height="48" rx="24" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="61" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">manifest.yaml</text>

      <!-- kube-apiserver -->
      <rect x="120" y="124" width="240" height="72" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="156" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">kube-apiserver</text>
      <text x="240" y="179" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">control plane</text>

      <!-- etcd -->
      <rect x="460" y="124" width="140" height="72" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="530" y="156" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">etcd</text>
      <text x="530" y="179" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">kv store</text>

      <!-- compare: controller compares spec vs status (loop anchor) -->
      <rect x="100" y="284" width="280" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="308" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CONTROLLER</text>
      <text x="240" y="336" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">compares spec vs status</text>

      <!-- reality changes -->
      <rect x="130" y="444" width="220" height="64" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="481" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">reality changes</text>

      <!-- status is updated -->
      <rect x="130" y="548" width="220" height="64" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="585" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">status is updated</text>

      <!-- Focal caption: the loop's payoff line -->
      <text x="340" y="684" fill="#B58B3E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">and it watches again, forever</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="716" x2="640" y2="716" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="40" y="732" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="752" width="32" height="16" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="84" y="764" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">Start / artifact</text>

      <rect x="240" y="752" width="24" height="16" rx="4" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="276" y="764" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">Process step</text>

      <line x1="420" y1="760" x2="452" y2="760" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="460" y="764" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">Reconcile loop</text>
    </svg>
  </div>
</body>
</html>
