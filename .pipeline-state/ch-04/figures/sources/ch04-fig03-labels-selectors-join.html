<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label selectors resolving to overlapping Pod sets</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-slab: 'Roboto Slab', serif;
    --font-sans: 'Fira Sans', sans-serif;
    --font-mono: 'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 640px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 0.75rem;
  }
  p.subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    font-weight: 400;
    color: var(--color-muted);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    max-width: 56ch;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Concept Map &middot; Labels &amp; Selectors</p>
  <h1>A Selector Describes a Set, Not a Partition</h1>
  <p class="subtitle">The same Pod can satisfy more than one selector at once &mdash; resolved sets overlap instead of dividing objects into exclusive groups.</p>

  <svg viewBox="0 0 640 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch04-fig03-labels-selectors-join-title ch04-fig03-labels-selectors-join-desc">
    <title id="ch04-fig03-labels-selectors-join-title">Label selectors resolving to overlapping Pod sets</title>
    <desc id="ch04-fig03-labels-selectors-join-desc">Four Pod cards labelled A through D each carry a tier and env label; below them, four selectors resolve to sets &mdash; tier=fe yields A and B, env=prod yields A and C, env in (prod, qa) yields A and C, and tier=be with env=prod yields C alone &mdash; with connector threads tracing each Pod down into every result it belongs to, showing Pod A recurring in three of the four sets in brass while Pod D matches none.</desc>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <text x="16" y="116" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">OBJECTS, EACH CARRYING LABELS</text>

    <!-- connector threads: drawn before every box so boxes read as stations on the line -->
    <line x1="80"  y1="224" x2="80"  y2="540" stroke="#B58B3E" stroke-width="1.2"/>
    <line x1="240" y1="224" x2="240" y2="316" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="400" y1="224" x2="400" y2="652" stroke="#1F4A4E" stroke-width="1"/>
    <!-- Pod D: no thread -- matches none of the four selectors -->

    <!-- Pod A -- focal -->
    <rect x="16" y="128" width="128" height="96" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="80" y="156" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod A<tspan x="80" dy="24" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">tier=fe</tspan><tspan x="80" dy="20" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">env=prod</tspan></text>

    <!-- Pod B -->
    <rect x="176" y="128" width="128" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="240" y="156" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod B<tspan x="240" dy="24" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">tier=fe</tspan><tspan x="240" dy="20" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">env=dev</tspan></text>

    <!-- Pod C -->
    <rect x="336" y="128" width="128" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="400" y="156" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod C<tspan x="400" dy="24" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">tier=be</tspan><tspan x="400" dy="20" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">env=prod</tspan></text>

    <!-- Pod D -- matches none, de-emphasized -->
    <rect x="496" y="128" width="128" height="96" rx="6" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="560" y="156" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod D<tspan x="560" dy="24" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">tier=be</tspan><tspan x="560" dy="20" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">env=dev</tspan></text>

    <text x="16" y="240" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">SELECTORS, EACH RESOLVING TO A SET</text>

    <line x1="16" y1="256" x2="624" y2="256" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <line x1="16" y1="368" x2="624" y2="368" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <line x1="16" y1="480" x2="624" y2="480" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <line x1="16" y1="592" x2="624" y2="592" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <line x1="16" y1="704" x2="624" y2="704" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

    <!-- Row 1: tier = fe -> { A, B } -->
    <text x="16" y="276" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">tier = fe</text>
    <rect x="48" y="284" width="392" height="64" rx="8" fill="rgba(11,30,59,0.025)"/>
    <rect x="60" y="296" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="80" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#B58B3E">A</text>
    <rect x="220" y="296" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"/>
    <text x="240" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">B</text>

    <!-- Row 2: env = prod -> { A, C } -->
    <text x="16" y="388" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">env = prod</text>
    <rect x="48" y="396" width="392" height="64" rx="8" fill="rgba(11,30,59,0.025)"/>
    <rect x="60" y="408" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="80" y="428" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#B58B3E">A</text>
    <rect x="380" y="408" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"/>
    <text x="400" y="428" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">C</text>

    <!-- Row 3: env in (prod, qa) -> { A, C } -->
    <text x="16" y="500" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">env in (prod, qa)</text>
    <rect x="48" y="508" width="392" height="64" rx="8" fill="rgba(11,30,59,0.025)"/>
    <rect x="60" y="520" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="80" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="700" fill="#B58B3E">A</text>
    <rect x="380" y="520" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"/>
    <text x="400" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">C</text>

    <!-- Row 4: tier = be, env = prod -> { C } -->
    <text x="16" y="612" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">tier = be , env = prod</text>
    <rect x="48" y="620" width="392" height="64" rx="8" fill="rgba(11,30,59,0.025)"/>
    <rect x="380" y="632" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"/>
    <text x="400" y="652" text-anchor="middle" dominant-baseline="central" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">C</text>

    <!-- Legend -->
    <line x1="16" y1="720" x2="624" y2="720" stroke="#8A8D90" stroke-width="0.8"/>
    <text x="16" y="736" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <circle cx="24" cy="760" r="6" fill="#FFFFFF" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="40" y="760" dominant-baseline="central" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">Pod A &mdash; in 3 of 4 sets</text>

    <circle cx="264" cy="760" r="6" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"/>
    <text x="280" y="760" dominant-baseline="central" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">matches this selector</text>

    <rect x="480" y="752" width="16" height="16" rx="2" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="504" y="760" dominant-baseline="central" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">Pod D &mdash; matches none</text>

  </svg>
</div>
</body>
</html>
