- anchor_id: ch04-fig02-apply-round-trip
  tool: diagram_design
  icon_pack: null
  sketch_mode: false
  source_path: figures/sources/ch04-fig02-apply-round-trip.html
  output_paths:
    svg: figures/ch04-fig02-apply-round-trip.svg
    png: figures/ch04-fig02-apply-round-trip.png
    alt: figures/ch04-fig02-apply-round-trip.alt.txt
  validation_rules:
    max_labels: 7
    grayscale_legibility: required
    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: flowchart
  figure_spec:
    anchor_id: ch04-fig02-apply-round-trip
    diagram_type: flowchart
    source_ascii: "     manifest.yaml\n          │\n          │  kubectl apply -f\n\
      \          ▼\n    ┌──────────────┐  writes the record   ┌──────────┐\n    │\
      \ kube-apiserver├─────────────────────►│   etcd   │\n    └──────┬───────┘  \
      \                     └────┬─────┘\n           │                           \
      \         │\n           │  a controller watches ◄────────────┘\n           ▼\n\
      \    the controller compares  spec  vs  status\n           │\n           │ \
      \ they differ → it acts\n           ▼\n    reality changes ──► status is updated\
      \ ──┐\n           ▲                                │\n           └────────────────────────────────┘\n\
      \                    and it watches again, forever\n"
    vendor_terms:
    - kube-apiserver
    - etcd
    - kubectl
    complexity_hint:
      node_count: 5
      edge_count: 6
      label_count: 11
    pedagogy:
      part_18_criteria_met:
      - temporal_structure
      - spatial_structure
      learning_outcome: Trace what happens to a single object after kubectl apply,
        and explain why the reconciliation loop never terminates
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the closed return loop and its caption, and it
        watches again, forever
    accessibility:
      alt_text_seed: A vertical flow from manifest.yaml through kubectl apply into
        kube-apiserver, which writes the record to etcd. A controller watches the
        API server, compares spec against status, acts when they differ, and reality
        changes so status is updated; an arrow returns to the compare step, forming
        a loop that never ends.
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 800
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Component names are Kubernetes project identifiers; the round-trip framing
        and loop emphasis are Lodestar's own composition.
