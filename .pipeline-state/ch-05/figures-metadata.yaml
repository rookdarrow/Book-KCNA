  alt_text: 'A tree whose single root reads that the unit of scheduling wraps containers
    rather than being one, branching to six equal consequences: the Pod has the IP,
    containers reach each other on localhost, restartPolicy is Pod-level, phase is
    Pod-level while state is per-container, identity is per-Pod, and scheduling is
    per-Pod; a further branch from the first leaf notes that Services will select
    Pods, not containers, in Chapter 9'
