  alt_text: A horizontal band for one container's use of one resource, marked at zero,
    at the request, and at the limit; the zone up to the request is reserved and read
    by the kube-scheduler, the zone between request and limit is allowed when the
    node has spare capacity, and the zone past the limit is not allowed and is enforced
    by the kubelet with the kernel; a note beneath states that CPU is throttled at
    the limit while memory is OOM-killed reactively under node memory pressure
