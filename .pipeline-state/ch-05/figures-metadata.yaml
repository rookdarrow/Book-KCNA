  alt_text: 'A three-row comparison of Kubernetes probes: liveness asks whether the
    container is running and on failure the kubelet kills it without removing it from
    Service endpoints; readiness asks whether the container can respond and on failure
    the Pod IP is removed from matching Service endpoints without killing or restarting
    anything; startup asks whether the application has started, on failure the kubelet
    kills the container, and while configured it suppresses the other two probes'
