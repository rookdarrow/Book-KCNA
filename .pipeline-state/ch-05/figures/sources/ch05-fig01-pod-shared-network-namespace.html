<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside a Pod: One IP, Two Containers, One Volume</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-sans:  'Fira Sans', sans-serif;
    --font-serif: 'Roboto Slab', serif;
    --font-mono:  'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 720px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.4rem, 2vw + 0.9rem, 1.75rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 320px; max-width: 560px; display: block; margin: 0 auto; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Kubernetes &middot; Pod Networking</p>
    <h1>Inside a Pod: One IP, Two Containers, One Volume</h1>

    <svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch05-fig01-title ch05-fig01-desc">
      <title id="ch05-fig01-title">Pod networking: one IP shared by two containers</title>
      <desc id="ch05-fig01-desc">A Node contains one Pod; the Pod carries a single IP address on its own boundary and holds two containers, app and helper, which communicate over localhost and both read and write a shared volume inside the Pod.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- NODE (outer containment ring) -->
      <rect x="32" y="40" width="576" height="500" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"/>
      <rect x="48" y="28" width="72" height="20" fill="#F5EFE4"/>
      <text x="56" y="44" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">NODE</text>

      <!-- POD (inner containment ring) -->
      <rect x="60" y="88" width="520" height="412" rx="8" fill="rgba(11,30,59,0.035)" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="76" y="76" width="64" height="20" fill="#F5EFE4"/>
      <text x="84" y="92" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">POD</text>

      <!-- FOCAL: the Pod's single cluster IP, bound to its border -->
      <rect x="220" y="76" width="200" height="24" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="320" y="92" text-anchor="middle" fill="#0B1E3B" font-size="14" font-weight="400" font-family="'Fira Mono', monospace">IP: 10.42.1.7</text>

      <!-- Connector: app <-> helper via localhost (drawn before boxes) -->
      <line x1="268" y1="220" x2="372" y2="220" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="276" y="192" width="88" height="20" fill="#F5EFE4"/>
      <text x="320" y="208" text-anchor="middle" fill="#1F4A4E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" letter-spacing="0.04em">LOCALHOST</text>

      <!-- Connectors: containers <-> shared volume (bidirectional read/write) -->
      <path d="M180,300 V324 Q180,332 188,332 H272 Q280,332 280,340 V364" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M460,300 V324 Q460,332 452,332 H368 Q360,332 360,340 V364" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

      <!-- container: app -->
      <rect x="92" y="140" width="176" height="160" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="180" y="212" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">container:</text>
      <text x="180" y="236" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">app</text>

      <!-- container: helper -->
      <rect x="372" y="140" width="176" height="160" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="460" y="212" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">container:</text>
      <text x="460" y="236" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">helper</text>

      <!-- shared volume -->
      <rect x="200" y="364" width="240" height="96" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="320" y="416" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">shared volume</text>

      <!-- Legend -->
      <line x1="32" y1="572" x2="608" y2="572" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="32" y="588" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="608" width="16" height="12" rx="2" fill="none" stroke="#0B1E3B" stroke-width="1"/>
      <text x="56" y="616" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">BOUNDARY</text>

      <rect x="192" y="608" width="16" height="12" rx="2" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="216" y="616" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">CONTAINER</text>

      <rect x="352" y="608" width="16" height="12" rx="2" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="376" y="616" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">VOLUME</text>

      <rect x="512" y="608" width="16" height="12" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="536" y="616" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">FOCAL</text>
    </svg>
  </div>
</body>
</html>
