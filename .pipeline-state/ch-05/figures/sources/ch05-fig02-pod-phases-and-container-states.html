<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pod phase versus container state</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFE4;
    --ink:#0B1E3B;
    --muted:#1F4A4E;
    --soft:#8A8D90;
    --accent:#B58B3E;
    --accent-tint:rgba(181,139,62,0.10);
    --rule:rgba(11,30,59,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Fira Sans',sans-serif;
    display:flex;
    justify-content:center;
    padding:40px 20px;
  }
  .page{
    width:100%;
    max-width:680px;
  }
  .eyebrow{
    font-family:'Fira Mono',monospace;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px 0;
  }
  h1{
    font-family:'Roboto Slab',serif;
    font-weight:500;
    font-size:1.75rem;
    margin:0 0 8px 0;
    color:var(--ink);
  }
  .subtitle{
    font-family:'Fira Sans',sans-serif;
    font-size:16px;
    color:var(--muted);
    margin:0 0 24px 0;
    max-width:56ch;
  }
  .diagram{
    width:100%;
  }
  .diagram svg{
    width:100%;
    height:auto;
    display:block;
  }
  footer{
    margin-top:20px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    font-family:'Fira Mono',monospace;
    font-size:14px;
    color:var(--soft);
  }
  .node-name{ font-family:'Fira Sans',sans-serif; font-size:16px; font-weight:600; fill:var(--ink); }
  .sublabel{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:400; fill:var(--muted); }
  .annot{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:400; fill:var(--soft); }
  .eyebrow-svg{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; fill:var(--muted); }
  .tag-text{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; fill:rgba(11,30,59,0.8); }
  .focal-text{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:600; letter-spacing:0.02em; fill:var(--accent); }
  .legend-text{ font-family:'Fira Mono',monospace; font-size:14px; font-weight:400; fill:var(--muted); }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">CH.05 &middot; FIG.02 &middot; STATE MACHINE</p>
  <h1>Pod Phase vs. Container State</h1>
  <p class="subtitle">A Pod's <code>status.phase</code> and a container's <code>state</code> are different scopes &mdash; the Pod can read Running while one of its containers is Waiting.</p>

  <div class="diagram">
    <svg viewBox="0 0 600 900" role="img" aria-labelledby="ch05-fig02-title ch05-fig02-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="ch05-fig02-title">Pod phase versus container state</title>
      <desc id="ch05-fig02-desc">A Pod box lists five phase values, Pending, Running, Succeeded, Failed and Unknown, with two nested container boxes each showing three states, Waiting, Running and Terminated; a second panel shows a real instant where the Pod's phase is Running while its helper container's state is Waiting with reason CrashLoopBackOff.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="600" height="900" fill="#F5EFE4"/>

      <text x="36" y="20" class="eyebrow-svg">Definition &mdash; what the API reports</text>

      <!-- ============ PANEL 1: POD definition ============ -->
      <rect x="20" y="40" width="560" height="564" rx="8" fill="rgba(11,30,59,0.02)" stroke="#0B1E3B" stroke-width="1.2"/>

      <rect x="36" y="52" width="72" height="24" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="72" y="68" class="tag-text" text-anchor="middle">POD</text>

      <text x="36" y="104" class="sublabel">status.phase:</text>

      <circle cx="40" cy="140" r="6" fill="#0B1E3B"/>
      <line x1="46" y1="140" x2="60" y2="140" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="60" y="120" width="104" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="112" y="144" class="node-name" text-anchor="middle">Pending</text>

      <line x1="164" y1="140" x2="188" y2="140" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="188" y="120" width="104" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="144" class="node-name" text-anchor="middle">Running</text>

      <line x1="292" y1="140" x2="316" y2="140" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="316" y="120" width="104" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="368" y="144" class="node-name" text-anchor="middle">Succeeded</text>

      <path d="M240,160 L240,164 Q240,172 248,172 L360,172 Q368,172 368,180 L368,200"
            fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="316" y="200" width="104" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="368" y="224" class="node-name" text-anchor="middle">Failed</text>

      <rect x="460" y="200" width="104" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="512" y="224" class="node-name" text-anchor="middle">Unknown</text>

      <circle cx="176" cy="188" r="4" fill="#0B1E3B"/>
      <rect x="184" y="164" width="48" height="16" rx="2" fill="#F5EFE4"/>
      <text x="208" y="176" class="annot" text-anchor="middle">(any)</text>
      <path d="M176,188 L504,188 Q512,188 512,196 L512,200"
            fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- container: app -->
      <rect x="36" y="280" width="528" height="144" rx="8" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="52" y="308" class="node-name">container: app</text>
      <text x="52" y="328" class="sublabel">state:</text>

      <rect x="52" y="340" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="126" y="364" class="node-name" text-anchor="middle">Waiting</text>

      <line x1="200" y1="360" x2="224" y2="360" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="224" y="340" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="298" y="364" class="node-name" text-anchor="middle">Running</text>

      <line x1="372" y1="360" x2="396" y2="360" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="396" y="340" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="470" y="364" class="node-name" text-anchor="middle">Terminated</text>

      <text x="126" y="400" class="annot" text-anchor="middle">(+Reason)</text>
      <text x="298" y="400" class="annot" text-anchor="middle">(+startedAt)</text>
      <text x="470" y="400" class="annot" text-anchor="middle">(+exitCode)</text>

      <!-- container: helper -->
      <rect x="36" y="464" width="528" height="116" rx="8" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="52" y="492" class="node-name">container: helper</text>
      <text x="52" y="512" class="sublabel">state:</text>

      <rect x="52" y="524" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="126" y="548" class="node-name" text-anchor="middle">Waiting</text>

      <line x1="200" y1="544" x2="224" y2="544" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="224" y="524" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="298" y="548" class="node-name" text-anchor="middle">Running</text>

      <line x1="372" y1="544" x2="396" y2="544" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="396" y="524" width="148" height="40" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="470" y="548" class="node-name" text-anchor="middle">Terminated</text>

      <text x="36" y="618" class="eyebrow-svg">Worked overlay &mdash; both readings are legitimate</text>

      <!-- ============ PANEL 2: worked overlay instant ============ -->
      <rect x="20" y="628" width="560" height="196" rx="8" fill="rgba(11,30,59,0.02)" stroke="#0B1E3B" stroke-width="1.2"/>

      <text x="36" y="656" class="node-name">POD</text>
      <rect x="140" y="642" width="176" height="28" rx="4" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1"/>
      <text x="228" y="661" class="focal-text" text-anchor="middle">phase: Running</text>

      <rect x="36" y="684" width="528" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="52" y="716" class="node-name">app</text>
      <text x="200" y="716" class="sublabel">state: Running</text>

      <rect x="36" y="752" width="528" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="52" y="784" class="node-name">helper</text>
      <text x="200" y="784" class="sublabel">state: Waiting</text>
      <text x="340" y="784" class="sublabel">Reason: CrashLoopBackOff</text>

      <!-- legend -->
      <line x1="20" y1="848" x2="580" y2="848" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="20" y="864" class="eyebrow-svg">Legend</text>

      <line x1="20" y1="884" x2="44" y2="884" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="52" y="888" class="legend-text">(any) &rarr; catch-all transition</text>

      <rect x="340" y="878" width="20" height="12" rx="2" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1"/>
      <text x="368" y="888" class="legend-text">focal element</text>
    </svg>
  </div>

  <footer>ch05-fig02-pod-phases-and-container-states &middot; state_machine</footer>
</div>
</body>
</html>
