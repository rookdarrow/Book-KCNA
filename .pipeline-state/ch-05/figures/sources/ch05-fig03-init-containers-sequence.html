<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Init Containers: Sequential Gate Before App Containers</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-serif:   'Roboto Slab', serif;
    --font-sans:    'Fira Sans', sans-serif;
    --font-mono:    'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 620px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Activity Diagram &middot; Pod Startup</p>
    <h1>Init Containers Run to Completion Before App Containers Start</h1>

    <svg viewBox="0 0 520 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ch05-fig03-init-containers-sequence-title ch05-fig03-init-containers-sequence-desc">
      <title id="ch05-fig03-init-containers-sequence-title">Init container sequencing: success vs. failure at startup</title>
      <desc id="ch05-fig03-init-containers-sequence-desc">Two timelines: on the success path init-1 exits zero then init-2 exits zero, after which app-a and app-b start together in parallel; on the failure path init-2 exits non-zero, restart is governed by restartPolicy, and the app containers are never started.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- init-1 -> init-2 -->
      <line x1="240" y1="104" x2="240" y2="144" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- init-2 -> fork -->
      <line x1="240" y1="200" x2="240" y2="228" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- fork right vertex -> success (exit 0) -->
      <line x1="296" y1="276" x2="376" y2="276" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="296" y="248" width="72" height="20" rx="2" fill="#F5EFE4"/>
      <text x="332" y="264" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">EXIT 0</text>

      <!-- fork bottom vertex -> junction (exit 1) -->
      <line x1="240" y1="324" x2="240" y2="372" stroke="#1F4A4E" stroke-width="1"/>
      <rect x="160" y="336" width="72" height="20" rx="2" fill="#F5EFE4"/>
      <text x="196" y="352" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">EXIT 1</text>

      <!-- junction -> restart note -->
      <line x1="240" y1="372" x2="376" y2="372" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- junction -> terminal (accent path leads to the focal element) -->
      <line x1="240" y1="372" x2="240" y2="424" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- junction marker -->
      <circle cx="240" cy="372" r="4" fill="#0B1E3B"/>

      <!-- init-1 -->
      <rect x="160" y="48" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="72" text-anchor="middle" font-family="'Fira Sans', sans-serif">
        <tspan x="240" dy="0" fill="#0B1E3B" font-size="16" font-weight="600">init-1</tspan>
        <tspan x="240" dy="20" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" font-weight="400" letter-spacing="0.02em">exit 0</tspan>
      </text>

      <!-- init-2 -->
      <rect x="160" y="144" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
      <text x="240" y="178" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">init-2</text>

      <!-- fork -->
      <polygon points="240,228 296,276 240,324 184,276" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>

      <!-- success: app-a + app-b start together -->
      <rect x="376" y="236" width="120" height="80" rx="40" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="270" text-anchor="middle" font-family="'Fira Sans', sans-serif">
        <tspan x="436" dy="0" fill="#0B1E3B" font-size="14" font-weight="600">app-a, app-b</tspan>
        <tspan x="436" dy="20" fill="#1F4A4E" font-size="14" font-weight="400">start together</tspan>
      </text>

      <!-- restart note (secondary / dashed) -->
      <rect x="376" y="340" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="436" y="366" text-anchor="middle" font-family="'Fira Mono', monospace">
        <tspan x="436" dy="0" fill="#1F4A4E" font-size="14" font-weight="500" letter-spacing="0.06em">RESTART</tspan>
        <tspan x="436" dy="18" fill="#8A8D90" font-size="14" font-weight="400" letter-spacing="0.02em">per restartPolicy</tspan>
      </text>

      <!-- terminal (focal): app containers never started -->
      <rect x="80" y="424" width="320" height="72" rx="36" fill="#F5EFE4"/>
      <rect x="80" y="424" width="320" height="72" rx="36" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="240" y="456" text-anchor="middle" font-family="'Fira Sans', sans-serif">
        <tspan x="240" dy="0" fill="#0B1E3B" font-size="16" font-weight="500">app containers</tspan>
        <tspan x="240" dy="24" fill="#0B1E3B" font-size="16" font-weight="700" letter-spacing="0.02em">NEVER STARTED</tspan>
      </text>

    </svg>
  </div>
</body>
</html>
