<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Probes Compared</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-accent: #B58B3E;
    --color-soft:   #8A8D90;
    --font-sans: 'Fira Sans', sans-serif;
    --font-slab: 'Roboto Slab', serif;
    --font-mono: 'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .frame { max-width: 560px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 16px;
    color: var(--color-muted);
    margin-bottom: 1.5rem;
    line-height: 1.4;
  }
  svg { width: 100%; display: block; }
  .callout {
    font-family: var(--font-sans);
    font-style: italic;
    font-size: 16px;
    color: var(--color-ink);
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(11,30,59,0.12);
    line-height: 1.5;
  }
  .callout strong { font-style: normal; font-weight: 600; color: var(--color-accent); }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Kubernetes Probes</p>
    <h1>Three Probes, Three Different Failures</h1>
    <p class="subtitle">Same shape, different consequence when each one fails.</p>

    <svg viewBox="0 0 640 916" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ch05-fig04-three-probes-compared-title ch05-fig04-three-probes-compared-desc">
      <title id="ch05-fig04-three-probes-compared-title">Liveness, readiness, and startup probes compared</title>
      <desc id="ch05-fig04-three-probes-compared-desc">A three-row comparison of Kubernetes probes: liveness asks whether the container is running and on failure the kubelet kills it without removing it from Service endpoints; readiness asks whether the container can respond and on failure the Pod IP is removed from matching Service endpoints without killing or restarting anything; startup asks whether the application has started, on failure the kubelet kills the container, and while configured it suppresses the other two probes.</desc>

      <rect width="640" height="916" fill="#F5EFE4"/>

      <!-- LIVENESS card -->
      <rect x="24" y="24" width="592" height="264" rx="8" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <text x="40" y="52" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600"
            letter-spacing="0.06em" fill="#0B1E3B">LIVENESS</text>
      <line x1="40" y1="64" x2="600" y2="64" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <text font-family="'Fira Sans', sans-serif">
        <tspan x="40" y="88" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ASKS</tspan>
        <tspan x="40" y="108" font-size="16" font-weight="400" fill="#0B1E3B">Is the container running?</tspan>

        <tspan x="40" y="152" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ON FAILURE</tspan>
        <tspan x="40" y="172" font-size="16" font-weight="400" fill="#0B1E3B">kubelet </tspan><tspan font-size="16" font-weight="600" fill="#0B1E3B">KILLS</tspan><tspan font-size="16" font-weight="400" fill="#0B1E3B"> the container → restart policy applies</tspan>

        <tspan x="40" y="216" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">DOES NOT</tspan>
        <tspan x="40" y="236" font-size="16" font-weight="400" fill="#8A8D90">remove it from Service endpoints</tspan>
      </text>

      <!-- READINESS card (focal) -->
      <rect x="24" y="312" width="592" height="292" rx="8" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <rect x="32" y="416" width="576" height="96" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.4"/>
      <text x="40" y="340" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600"
            letter-spacing="0.06em" fill="#0B1E3B">READINESS</text>
      <line x1="40" y1="352" x2="600" y2="352" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <text font-family="'Fira Sans', sans-serif">
        <tspan x="40" y="376" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ASKS</tspan>
        <tspan x="40" y="396" font-size="16" font-weight="400" fill="#0B1E3B">Can the container respond to requests?</tspan>

        <tspan x="40" y="440" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ON FAILURE</tspan>
        <tspan x="40" y="460" font-size="16" font-weight="600" fill="#B58B3E">Pod IP REMOVED from endpoints</tspan>
        <tspan x="40" y="480" font-size="16" font-weight="400" fill="#0B1E3B">of all matching Services</tspan>
        <tspan x="40" y="500" font-family="'Fira Mono', monospace" font-size="14" font-weight="600"
               letter-spacing="0.08em" fill="#B58B3E">ONLY PROBE THAT DE-REGISTERS WITHOUT RESTARTING</tspan>

        <tspan x="40" y="532" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">DOES NOT</tspan>
        <tspan x="40" y="552" font-size="16" font-weight="400" fill="#8A8D90">kill or restart anything —</tspan>
        <tspan x="40" y="572" font-size="16" font-weight="400" fill="#8A8D90">the container keeps running</tspan>
      </text>

      <!-- STARTUP card -->
      <rect x="24" y="628" width="592" height="264" rx="8" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <text x="40" y="656" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600"
            letter-spacing="0.06em" fill="#0B1E3B">STARTUP</text>
      <line x1="40" y1="668" x2="600" y2="668" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
      <text font-family="'Fira Sans', sans-serif">
        <tspan x="40" y="692" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ASKS</tspan>
        <tspan x="40" y="712" font-size="16" font-weight="400" fill="#0B1E3B">Has the application started?</tspan>

        <tspan x="40" y="756" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">ON FAILURE</tspan>
        <tspan x="40" y="776" font-size="16" font-weight="400" fill="#0B1E3B">kubelet </tspan><tspan font-size="16" font-weight="600" fill="#0B1E3B">KILLS</tspan><tspan font-size="16" font-weight="400" fill="#0B1E3B"> the container → restart policy applies</tspan>

        <tspan x="40" y="820" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
               letter-spacing="0.12em" fill="#1F4A4E">DOES NOT</tspan>
        <tspan x="40" y="840" font-size="16" font-weight="400" fill="#8A8D90">run alongside the others —</tspan>
        <tspan x="40" y="860" font-size="16" font-weight="400" fill="#8A8D90">it </tspan><tspan font-size="16" font-weight="600" fill="#8A8D90">SUPPRESSES</tspan><tspan font-size="16" font-weight="400" fill="#8A8D90"> them until it succeeds</tspan>
      </text>
    </svg>

    <p class="callout">Readiness is the odd one out: it's the only probe whose failure <strong>changes traffic routing</strong> instead of the container's lifecycle.</p>
  </div>
</body>
</html>
