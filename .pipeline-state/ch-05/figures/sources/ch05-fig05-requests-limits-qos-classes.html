<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Single Container's Resource Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFE4;
    --ink:#0B1E3B;
    --muted:#1F4A4E;
    --soft:#8A8D90;
    --accent:#B58B3E;
    --rule:rgba(11,30,59,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{
    font-family:'Fira Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 20px;
  }
  .page{
    width:100%;
    max-width:760px;
  }
  .eyebrow{
    font-family:'Fira Mono', monospace;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px 0;
  }
  h1{
    font-family:'Roboto Slab', serif;
    font-weight:500;
    font-size:1.75rem;
    line-height:1.2;
    color:var(--ink);
    margin:0 0 8px 0;
  }
  .subtitle{
    font-family:'Fira Sans', sans-serif;
    font-size:16px;
    color:var(--muted);
    margin:0 0 24px 0;
    max-width:640px;
  }
  .diagram{
    width:100%;
    height:auto;
    display:block;
  }
  footer{
    margin-top:24px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    font-family:'Fira Mono', monospace;
    font-size:14px;
    color:var(--soft);
  }
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">Kubernetes resource model</p>
  <h1>A Single Container's Resource Band</h1>
  <p class="subtitle">Where a single resource — CPU or memory — sits between its request and its limit</p>

  <svg class="diagram" viewBox="0 0 760 920" role="img" aria-labelledby="ch05-fig05-title ch05-fig05-desc">
    <title id="ch05-fig05-title">A Single Container's Resource Band</title>
    <desc id="ch05-fig05-desc">Vertical band showing one container's use of one resource against two thresholds: below the request the resource is reserved and read by the kube-scheduler; between the request and the limit it is allowed only if the node has spare capacity; above the limit it is not allowed and is enforced by the kubelet with the kernel. A note beneath states that CPU is throttled at the limit while memory is OOM-killed reactively under node memory pressure.</desc>

    <defs>
      <marker id="ch05-fig05-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#8A8D90"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="760" height="920" fill="#F5EFE4"/>

    <!-- top caption + open-ended continuation arrow -->
    <text x="704" y="28" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14"
          letter-spacing="0.08em" fill="#1F4A4E">RESOURCE USE INCREASES &#8593;</text>
    <line x1="136" y1="40" x2="136" y2="20" stroke="#8A8D90" stroke-width="1"
          stroke-dasharray="4,3" marker-end="url(#ch05-fig05-arrow-soft)"/>

    <!-- ============ zone fills (painted first) ============ -->
    <!-- NOT ALLOWED: 44-204 -->
    <rect x="56" y="44" width="160" height="160" fill="rgba(11,30,59,0.02)"/>
    <!-- ALLOWED: 204-464 -->
    <rect x="56" y="204" width="160" height="260" fill="rgba(31,74,78,0.06)"/>
    <!-- RESERVED: 464-704 -->
    <rect x="56" y="464" width="160" height="240" fill="rgba(11,30,59,0.05)"/>

    <!-- ============ band edges ============ -->
    <!-- left edge: dashed for NOT ALLOWED span, solid below -->
    <line x1="56" y1="44" x2="56" y2="204" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="56" y1="204" x2="56" y2="704" stroke="#0B1E3B" stroke-width="1"/>
    <!-- right edge: dashed for NOT ALLOWED span, solid below -->
    <line x1="216" y1="44" x2="216" y2="204" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="216" y1="204" x2="216" y2="704" stroke="#0B1E3B" stroke-width="1"/>
    <!-- top edge: dashed, open-ended -->
    <line x1="56" y1="44" x2="216" y2="44" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- bottom edge: solid, the zero origin -->
    <line x1="56" y1="704" x2="216" y2="704" stroke="#0B1E3B" stroke-width="1"/>

    <!-- ============ boundary rules (full width) ============ -->
    <!-- request divider (regular) -->
    <line x1="56" y1="464" x2="704" y2="464" stroke="#8A8D90" stroke-width="1"/>
    <!-- limit divider — FOCAL boundary rule -->
    <line x1="56" y1="204" x2="704" y2="204" stroke="#B58B3E" stroke-width="1.2"/>

    <!-- ============ tick stubs, marker, labels ============ -->
    <line x1="40" y1="704" x2="56" y2="704" stroke="#8A8D90" stroke-width="1"/>
    <text x="36" y="708" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">0</text>

    <line x1="40" y1="464" x2="56" y2="464" stroke="#8A8D90" stroke-width="1"/>
    <text x="36" y="468" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">request</text>

    <line x1="40" y1="204" x2="56" y2="204" stroke="#B58B3E" stroke-width="1.2"/>
    <circle cx="48" cy="204" r="4" fill="#B58B3E"/>
    <text x="36" y="208" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#B58B3E">limit</text>

    <!-- ============ zone annotations ============ -->
    <!-- NOT ALLOWED (44-204, center 124) -->
    <text x="240" y="120" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">NOT ALLOWED</text>
    <text x="240" y="144" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">enforced by the <tspan font-family="'Fira Mono', monospace">kubelet</tspan> (+ the kernel)</text>

    <!-- ALLOWED (204-464, center 334) -->
    <text x="240" y="328" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">ALLOWED</text>
    <text x="240" y="352" font-family="'Fira Sans', sans-serif" font-size="16" fill="#1F4A4E">if the node has spare capacity</text>

    <!-- RESERVED (464-704, center 584) -->
    <text x="240" y="572" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">RESERVED</text>
    <text x="240" y="596" font-family="'Fira Sans', sans-serif" font-size="16" fill="#1F4A4E">for this container</text>
    <text x="240" y="624" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">read by <tspan font-family="'Fira Mono', monospace">kube-scheduler</tspan></text>
    <text x="240" y="648" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">(chooses the node)</text>

    <!-- ============ enforcement note ============ -->
    <line x1="56" y1="736" x2="704" y2="736" stroke="rgba(11,30,59,0.12)" stroke-width="1"/>
    <text x="56" y="760" font-family="'Fira Mono', monospace" font-size="14" font-weight="500"
          letter-spacing="0.08em" fill="#1F4A4E">ENFORCEMENT DIFFERS BY RESOURCE</text>

    <text x="56" y="792" font-family="'Fira Mono', monospace" font-size="16" fill="#0B1E3B">cpu</text>
    <text x="180" y="792" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">THROTTLED at the limit</text>
    <text x="180" y="816" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">hard, immediate — you get slow</text>

    <text x="56" y="856" font-family="'Fira Mono', monospace" font-size="16" fill="#0B1E3B">memory</text>
    <text x="180" y="856" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">OOM-KILLED past it</text>
    <text x="180" y="880" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">reactive, under node memory pressure — you get slow, then dead</text>

  </svg>

  <footer>ch05-fig05 · a container's resource band</footer>

</div>
</body>
</html>
