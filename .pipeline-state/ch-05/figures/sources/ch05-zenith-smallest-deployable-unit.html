<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smallest Deployable Unit</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #F5EFE4;
    --color-ink:   #0B1E3B;
    --color-muted: #1F4A4E;
    --color-soft:  #8A8D90;
    --color-accent:#B58B3E;
    --font-sans:  'Fira Sans', sans-serif;
    --font-serif: 'Roboto Slab', serif;
    --font-mono:  'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 560px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Tree &middot; Ch. 05 &mdash; Zenith</p>
  <h1>The Smallest Deployable Unit</h1>

  <svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch05-zenith-smallest-deployable-unit-title ch05-zenith-smallest-deployable-unit-desc">
    <title id="ch05-zenith-smallest-deployable-unit-title">The Pod, not the container, is what Kubernetes schedules</title>
    <desc id="ch05-zenith-smallest-deployable-unit-desc">A tree diagram whose root states that the unit of scheduling wraps containers rather than being one of them, branching to six consequences: the Pod holds the IP, containers reach each other over localhost, restartPolicy and phase are Pod-level while container state is per-container, and identity and scheduling are Pod-level; a forward reference from the first consequence notes that Services will select Pods, not containers, in Chapter 9.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <!-- connectors (drawn before nodes) -->
    <line x1="300" y1="132" x2="300" y2="164" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="300" y1="164" x2="300" y2="608" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="280" y1="248" x2="320" y2="248" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="280" y1="488" x2="320" y2="488" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="280" y1="608" x2="320" y2="608" stroke="#1F4A4E" stroke-width="1"/>
    <line x1="160" y1="296" x2="160" y2="332" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- root: focal -->
    <rect x="80" y="32" width="440" height="100" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="300" y="64" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700">
      <tspan x="300" dy="0">THE UNIT OF SCHEDULING</tspan>
      <tspan x="300" dy="20">WRAPS CONTAINERS &mdash; IT IS</tspan>
      <tspan x="300" dy="20">NOT ONE OF THEM</tspan>
    </text>

    <!-- child0: the Pod has the IP -->
    <rect x="40" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="160" y="232" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">
      <tspan x="160" dy="0">THE POD HAS</tspan>
      <tspan x="160" dy="20">THE IP</tspan>
      <tspan x="160" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;1</tspan>
    </text>

    <!-- child1: containers reach each other on localhost -->
    <rect x="320" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="440" y="232" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">
      <tspan x="440" dy="0">CONTAINERS REACH</tspan>
      <tspan x="440" dy="20">EACH OTHER ON</tspan>
      <tspan x="440" dy="20" font-family="'Fira Mono', monospace" font-weight="500">localhost</tspan>
      <tspan x="440" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;1, &sect;2</tspan>
    </text>

    <!-- forward reference note, child of child0 -->
    <rect x="40" y="336" width="240" height="80" rx="6" fill="rgba(31,74,78,0.06)" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="160" y="368" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#1F4A4E">
      <tspan x="160" dy="0">SERVICES WILL SELECT</tspan>
      <tspan x="160" dy="20">PODS, NOT CONTAINERS</tspan>
      <tspan x="160" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&rarr; Ch 9</tspan>
    </text>

    <!-- child2: restartPolicy is Pod-level -->
    <rect x="40" y="440" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="160" y="472" text-anchor="middle" fill="#0B1E3B">
      <tspan x="160" dy="0" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">restartPolicy</tspan>
      <tspan x="160" dy="20" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">is Pod-level</tspan>
      <tspan x="160" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;5</tspan>
    </text>

    <!-- child3: phase is Pod-level; state is per-container -->
    <rect x="320" y="440" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="440" y="472" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">
      <tspan x="440" dy="0">PHASE is Pod-level;</tspan>
      <tspan x="440" dy="20">STATE is</tspan>
      <tspan x="440" dy="20">per-container</tspan>
      <tspan x="440" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;5</tspan>
    </text>

    <!-- child4: identity is per-Pod -->
    <rect x="40" y="560" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="160" y="592" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">
      <tspan x="160" dy="0">IDENTITY is</tspan>
      <tspan x="160" dy="20">per-Pod</tspan>
      <tspan x="160" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;6</tspan>
    </text>

    <!-- child5: scheduling is per-Pod -->
    <rect x="320" y="560" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="440" y="592" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">
      <tspan x="440" dy="0">SCHEDULING is</tspan>
      <tspan x="440" dy="20">per-Pod</tspan>
      <tspan x="440" dy="16" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">&sect;8</tspan>
    </text>

    <!-- legend -->
    <line x1="32" y1="684" x2="568" y2="684" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="32" y="702" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">LEGEND</text>

    <rect x="32" y="716" width="16" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="56" y="728" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">CENTRAL CLAIM</text>

    <rect x="232" y="716" width="16" height="16" rx="2" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="256" y="728" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">CONSEQUENCE</text>

    <rect x="392" y="716" width="16" height="16" rx="2" fill="rgba(31,74,78,0.06)" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="416" y="728" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">FORWARD REF.</text>
  </svg>
</div>
</body>
</html>
