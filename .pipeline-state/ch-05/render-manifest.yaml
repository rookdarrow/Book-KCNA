    min_font_pt: 14
  diagram_type: activity
  figure_spec:
    anchor_id: ch05-fig03-init-containers-sequence
    diagram_type: activity
    source_ascii: "SUCCESS PATH\n  time ──────────────────────────────────────────────────────►\n\
      \n  [ init-1 ]──exit 0──►[ init-2 ]──exit 0──►┌─[ app-a ]────────►\n       \
      \                                      └─[ app-b ]────────►\n   (sequential,\
      \ one at a time)                (parallel, together)\n\n\nFAILURE PATH\n  time\
      \ ──────────────────────────────────────────────────────►\n\n  [ init-1 ]──exit\
      \ 0──►[ init-2 ]──exit 1──►(restart per\n                                  \
      \            restartPolicy)\n                            │\n               \
      \             └──► app containers: NEVER STARTED\n"
    vendor_terms:
    - pod
    - init-container
    - container
    complexity_hint:
      node_count: 9
      edge_count: 8
      label_count: 13
    pedagogy:
      part_18_criteria_met:
      - temporal_structure
      - distinguishing_alternatives
      learning_outcome: Predict that init containers run sequentially to completion
        before app containers start in parallel, and that an init failure leaves app
        containers never started
      fixed_point_emphasis: true
      fixed_point_emphasis_target: 'the ''app containers: NEVER STARTED'' terminal
        on the failure path'
    accessibility:
      alt_text_seed: 'Two timelines: on the success path init-1 exits zero then init-2
        exits zero, after which app-a and app-b start together in parallel; on the
        failure path init-2 exits non-zero, restart is governed by restartPolicy,
        and the app containers are never started'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Concept redrawn from Kubernetes init-container ordering semantics; no
        vendor artwork reproduced
