      \ readiness   │ Can the container       │ Pod IP REMOVED from  │ kill or restart\n\
      \             │ respond to requests?    │ endpoints of all     │ anything —\
      \ the\n             │                         │ matching Services    │ container\
      \ keeps running\n─────────────┼─────────────────────────┼──────────────────────┼──────────────────────\n\
      \ startup     │ Has the application     │ kubelet KILLS the    │ run alongside\
      \ the\n             │ started?                │ container → restart  │ others\
      \ — it SUPPRESSES\n             │                         │ policy applies \
      \      │ them until it succeeds\n"
    vendor_terms:
    - kubelet
    - pod
    - service
    - endpoints
    complexity_hint:
      node_count: 12
      edge_count: 0
      label_count: 15
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Predict the distinct consequence of each probe's failure,
        and identify readiness as the only probe that de-registers without restarting
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the readiness row's 'Pod IP REMOVED from endpoints'
        cell
    accessibility:
      alt_text_seed: 'A three-row comparison of Kubernetes probes: liveness asks whether
        the container is running and on failure the kubelet kills it without removing
        it from Service endpoints; readiness asks whether the container can respond
        and on failure the Pod IP is removed from matching Service endpoints without
        killing or restarting anything; startup asks whether the application has started,
        on failure the kubelet kills the container, and while configured it suppresses
        the other two probes'
    rendering_hints:
