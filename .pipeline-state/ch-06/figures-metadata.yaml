  alt_text: 'A single control loop drawn once: a desired state box compares down to
    a current state box, an act-on-the-gap step follows, and an arrow returns to the
    desired state forever; beneath it a substitution list pairs six desired states
    with their controllers — a number with ReplicaSet, a template plus update policy
    with Deployment, one per matching node with DaemonSet, completion with Job, a
    Job at each scheduled time with CronJob, and whatever its author decided with
    your operator'
