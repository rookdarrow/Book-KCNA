<svg viewBox="0 0 720 976" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch06-fig02-rolling-update-maxsurge-maxunavailable-title ch06-fig02-rolling-update-maxsurge-maxunavailable-desc" width="620" height="841">
      <title id="ch06-fig02-rolling-update-maxsurge-maxunavailable-title">Rolling update: ceiling and floor on Pod count over time</title>
      <desc id="ch06-fig02-rolling-update-maxsurge-maxunavailable-desc">Count-versus-time chart for a ten-replica rolling update: a dashed ceiling line at thirteen marks desired plus maxSurge, a solid line at ten marks the desired count, and a dashed floor line at eight marks desired minus maxUnavailable; an old Pod population declines while a new population rises, their total never crossing the ceiling and the available count never falling below the floor.</desc>
      <defs>
        <marker id="arrow-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"></polygon>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ─── Reference / bound lines (drawn first, behind data) ─── -->
      <!-- CEILING and FLOOR: paired focal rule, identical accent treatment -->
      <line x1="100" y1="110" x2="676" y2="110" stroke="#B58B3E" stroke-width="2.2" stroke-dasharray="12,6"></line>
      <line x1="100" y1="360" x2="676" y2="360" stroke="#B58B3E" stroke-width="2.2" stroke-dasharray="12,6"></line>
      <!-- DESIRED: de-emphasized context line -->
      <line x1="100" y1="260" x2="676" y2="260" stroke="rgba(11,30,59,0.65)" stroke-width="1.2"></line>

      <!-- ─── Axes ─── -->
      <line x1="100" y1="60" x2="100" y2="760" stroke="rgba(11,30,59,0.30)" stroke-width="1"></line>
      <line x1="100" y1="760" x2="696" y2="760" stroke="rgba(11,30,59,0.30)" stroke-width="1" marker-end="url(#arrow-axis)"></line>

      <!-- Y-axis ticks -->
      <line x1="96" y1="110" x2="100" y2="110" stroke="rgba(11,30,59,0.30)" stroke-width="1"></line>
      <line x1="96" y1="260" x2="100" y2="260" stroke="rgba(11,30,59,0.30)" stroke-width="1"></line>
      <line x1="96" y1="360" x2="100" y2="360" stroke="rgba(11,30,59,0.30)" stroke-width="1"></line>
      <line x1="96" y1="760" x2="100" y2="760" stroke="rgba(11,30,59,0.30)" stroke-width="1"></line>

      <!-- Y-axis tick labels -->
      <text x="88" y="114" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">13</text>
      <text x="88" y="264" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">10</text>
      <text x="88" y="364" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">8</text>
      <text x="88" y="764" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">0</text>

      <!-- Y-axis caption -->
      <text transform="rotate(-90 24 412)" x="24" y="412" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.14em" text-anchor="middle">COUNT</text>

      <!-- X-axis tick labels -->
      <text x="100" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t0</text>
      <text x="196" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t1</text>
      <text x="292" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t2</text>
      <text x="388" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t3</text>
      <text x="484" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t4</text>
      <text x="580" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t5</text>
      <text x="676" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t6</text>

      <!-- X-axis caption -->
      <text x="676" y="804" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.10em" text-anchor="end">TIME</text>

      <!-- ─── Data series ─── -->
      <!-- New Pods: rising, teal, dashed — differentiated from old by both hue and stroke pattern -->
      <polyline points="100,760 196,610 292,610 388,460 484,460 580,310 676,260" fill="none" stroke="#1F4A4E" stroke-width="2" stroke-dasharray="5,4" stroke-linejoin="round"></polyline>
      <circle cx="100" cy="760" r="3" fill="#1F4A4E"></circle>
      <circle cx="196" cy="610" r="3" fill="#1F4A4E"></circle>
      <circle cx="292" cy="610" r="3" fill="#1F4A4E"></circle>
      <circle cx="388" cy="460" r="3" fill="#1F4A4E"></circle>
      <circle cx="484" cy="460" r="3" fill="#1F4A4E"></circle>
      <circle cx="580" cy="310" r="3" fill="#1F4A4E"></circle>
      <circle cx="676" cy="260" r="3" fill="#1F4A4E"></circle>

      <!-- Old Pods: declining, navy, solid -->
      <polyline points="100,260 196,260 292,410 388,410 484,560 580,560 676,760" fill="none" stroke="#0B1E3B" stroke-width="2" stroke-linejoin="round"></polyline>
      <circle cx="100" cy="260" r="3" fill="#0B1E3B"></circle>
      <circle cx="196" cy="260" r="3" fill="#0B1E3B"></circle>
      <circle cx="292" cy="410" r="3" fill="#0B1E3B"></circle>
      <circle cx="388" cy="410" r="3" fill="#0B1E3B"></circle>
      <circle cx="484" cy="560" r="3" fill="#0B1E3B"></circle>
      <circle cx="580" cy="560" r="3" fill="#0B1E3B"></circle>
      <circle cx="676" cy="760" r="3" fill="#0B1E3B"></circle>

      <!-- ─── Reference-line labels (short, masked, clear of data lines) ─── -->
      <rect x="564" y="80" width="112" height="20" fill="#F5EFE4"></rect>
      <text x="676" y="96" fill="#B58B3E" font-size="14" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="end">CEILING = 13</text>

      <rect x="580" y="368" width="96" height="20" fill="#F5EFE4"></rect>
      <text x="676" y="382" fill="#B58B3E" font-size="14" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="end">FLOOR = 8</text>

      <rect x="564" y="232" width="112" height="20" fill="#F5EFE4"></rect>
      <text x="676" y="248" fill="rgba(11,30,59,0.65)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">DESIRED = 10</text>

      <!-- ─── Editorial captions (the two halves of the rule, spelled out) ─── -->
      <text x="388" y="828" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Old + new never rises above the ceiling (10 + 3 = 13).</text>
      <text x="388" y="852" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Available never falls below the floor (10 − 2 = 8).</text>

      <!-- ─── Legend ─── -->
      <line x1="40" y1="884" x2="680" y2="884" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="40" y="900" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="40" y1="920" x2="64" y2="920" stroke="#0B1E3B" stroke-width="2"></line>
      <text x="72" y="924" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Old Pod count</text>

      <line x1="340" y1="920" x2="364" y2="920" stroke="#1F4A4E" stroke-width="2" stroke-dasharray="5,4"></line>
      <text x="372" y="924" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">New Pod count</text>

      <line x1="40" y1="948" x2="64" y2="948" stroke="rgba(11,30,59,0.65)" stroke-width="1.2"></line>
      <text x="72" y="952" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Desired replicas (10)</text>

      <line x1="340" y1="948" x2="364" y2="948" stroke="#B58B3E" stroke-width="2.2" stroke-dasharray="12,6"></line>
      <text x="372" y="952" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Ceiling (13) &amp; floor (8)</text>
    </svg>