<svg viewBox="0 0 576 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch06-control-loop-title ch06-control-loop-desc" width="640" height="738">
      <title id="ch06-control-loop-title">The Kubernetes control loop, instantiated six ways</title>
      <desc id="ch06-control-loop-desc">A single control loop compares desired state to current state, acts on the gap, and repeats forever; below it, a key maps six desired-state substitutions to their controllers — ReplicaSet, Deployment, DaemonSet, Job, CronJob, and a custom operator.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Arrows (drawn before boxes) -->
      <line x1="288" y1="104" x2="288" y2="152" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="288" y1="216" x2="288" y2="272" stroke="#1F4A4E" stroke-width="1.2"></line>
      <path d="M288,272 H116 Q108,272 108,264 V80 Q108,72 116,72 H148" fill="none" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#arrow-accent)"></path>

      <!-- Arrow labels -->
      <rect x="296" y="116" width="72" height="20" rx="4" fill="#F5EFE4"></rect>
      <text x="304" y="132" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">COMPARE</text>

      <rect x="296" y="232" width="132" height="20" rx="4" fill="#F5EFE4"></rect>
      <text x="304" y="248" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">ACT ON THE GAP</text>

      <rect x="116" y="244" width="168" height="20" rx="4" fill="#F5EFE4"></rect>
      <text x="200" y="260" text-anchor="middle" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.04em">AND AGAIN, FOREVER</text>

      <!-- Desired state -->
      <rect x="148" y="40" width="280" height="64" rx="8" fill="#F5EFE4"></rect>
      <rect x="148" y="40" width="280" height="64" rx="8" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <text x="288" y="76" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" letter-spacing="0.03em">DESIRED STATE</text>

      <!-- Current state -->
      <rect x="148" y="152" width="280" height="64" rx="8" fill="#F5EFE4"></rect>
      <rect x="148" y="152" width="280" height="64" rx="8" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <text x="288" y="188" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" letter-spacing="0.03em">CURRENT STATE</text>

      <!-- Substitution key -->
      <line x1="40" y1="372" x2="536" y2="372" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="40" y="320" font-family="'Fira Sans', sans-serif" font-style="italic" font-weight="400" font-size="16" fill="#0B1E3B">Change only what you plug into DESIRED STATE, and<tspan x="40" dy="24">you have named every controller in this chapter:</tspan><tspan x="40" dy="56" font-style="normal" font-size="16">a number</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-style="normal" font-weight="500" font-size="14">ReplicaSet</tspan><tspan x="40" dy="40" font-family="'Fira Sans', sans-serif" font-style="normal" font-size="16">a template + an update policy</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-weight="500" font-size="14">Deployment</tspan><tspan x="40" dy="40" font-family="'Fira Sans', sans-serif" font-style="normal" font-size="16">one per matching node</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-weight="500" font-size="14">DaemonSet</tspan><tspan x="40" dy="40" font-family="'Fira Sans', sans-serif" font-style="normal" font-size="16">completion</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-weight="500" font-size="14">Job</tspan><tspan x="40" dy="40" font-family="'Fira Sans', sans-serif" font-style="normal" font-size="16">a Job existing at each scheduled time</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-weight="500" font-size="14">CronJob</tspan><tspan x="40" dy="40" font-family="'Fira Sans', sans-serif" font-style="normal" font-size="16">whatever its author decided</tspan><tspan x="400" font-family="'Fira Mono', monospace" font-weight="500" font-size="14">your operator</tspan></text>
    </svg>