<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatefulSet vs. Deployment: Pod Identity</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-sans: 'Fira Sans', sans-serif;
    --font-serif: 'Roboto Slab', serif;
    --font-mono: 'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .frame { max-width: 620px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  p.subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    color: var(--color-muted);
    margin-bottom: 1.5rem;
    max-width: 46ch;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Component Diagram &middot; Ch.06 Fig.05</p>
  <h1>StatefulSet vs. Deployment: Pod Identity</h1>
  <p class="subtitle">Distinguished by whether Pods are interchangeable &mdash; not by whether the application writes to disk.</p>

  <svg viewBox="0 0 640 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch06fig05-title ch06fig05-desc">
    <title id="ch06fig05-title">StatefulSet vs. Deployment: Pod Identity</title>
    <desc id="ch06fig05-desc">Two-panel comparison: in a Deployment three interchangeable Pods sit side by side, and when the middle one dies it is replaced by a Pod with a different name, with no storage tie; in a StatefulSet, db-0, db-1 and db-2 each attach to their own volume, and when db-0 dies its replacement takes the same name and reattaches to the same volume, showing the identity outlived the Pod.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
      </marker>

      <clipPath id="clip-db1"><rect x="236" y="416" width="168" height="104" rx="6"/></clipPath>
      <clipPath id="clip-db2"><rect x="428" y="416" width="168" height="104" rx="6"/></clipPath>
    </defs>

    <rect width="640" height="820" fill="#F5EFE4"/>

    <!-- ============ PANEL 1 : DEPLOYMENT ============ -->
    <text x="44" y="32" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.06em">DEPLOYMENT &mdash; PODS ARE INTERCHANGEABLE</text>

    <!-- arrow: dying pod -> replacement pod (ordinary replacement, muted) -->
    <line x1="320" y1="128" x2="320" y2="192" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="330" y="152" width="80" height="16" fill="#F5EFE4"/>
    <text x="336" y="163" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">REPLACES</text>

    <!-- row 1: three pods -->
    <rect x="44" y="64" width="168" height="64" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="128" y="102" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">web-7d4b-x9k2</text>

    <rect x="236" y="64" width="168" height="64" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="320" y="90" text-anchor="middle" fill="#8A8D90" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">web-7d4b-mn4p</text>
    <text x="320" y="112" text-anchor="middle" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">&#10007; TERMINATED</text>

    <rect x="428" y="64" width="168" height="64" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="512" y="102" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">web-7d4b-qq81</text>

    <!-- replacement pod -->
    <rect x="236" y="192" width="168" height="64" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="320" y="218" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">web-7d4b-z7rt</text>
    <text x="320" y="240" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">NEW UID</text>

    <!-- caption -->
    <text x="320" y="296" text-anchor="middle" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">New name, new UID.</text>
    <text x="320" y="316" text-anchor="middle" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">Nothing depended on which one it was.</text>

    <line x1="44" y1="344" x2="596" y2="344" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

    <!-- ============ PANEL 2 : STATEFULSET ============ -->
    <text x="44" y="372" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.06em">STATEFULSET &mdash; IDENTITY IS STICKY</text>
    <text x="44" y="392" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.06em">AND STORAGE BELONGS TO IT</text>

    <!-- arrows: terminated db-0 -> new db-0 -> vol db-0 (SAME IDENTITY, brass) -->
    <line x1="128" y1="480" x2="128" y2="524" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="128" y1="588" x2="128" y2="632" stroke="#B58B3E" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="138" y="602" width="128" height="16" fill="#F5EFE4"/>
    <text x="144" y="613" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.04em">SAME IDENTITY</text>

    <!-- terminated db-0 -->
    <rect x="44" y="416" width="168" height="64" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="128" y="442" text-anchor="middle" fill="#8A8D90" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">db-0</text>
    <text x="128" y="464" text-anchor="middle" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">&#10007; TERMINATED</text>

    <!-- db-1 (pod + its own volume) -->
    <g clip-path="url(#clip-db1)">
      <rect x="236" y="416" width="168" height="52" fill="#FFFFFF"/>
      <rect x="236" y="468" width="168" height="52" fill="rgba(11,30,59,0.05)"/>
    </g>
    <rect x="236" y="416" width="168" height="104" rx="6" fill="none" stroke="#0B1E3B" stroke-width="1"/>
    <line x1="236" y1="468" x2="404" y2="468" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="320" y="450" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">db-1</text>
    <text x="320" y="502" text-anchor="middle" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.04em">vol db-1</text>

    <!-- db-2 (pod + its own volume) -->
    <g clip-path="url(#clip-db2)">
      <rect x="428" y="416" width="168" height="52" fill="#FFFFFF"/>
      <rect x="428" y="468" width="168" height="52" fill="rgba(11,30,59,0.05)"/>
    </g>
    <rect x="428" y="416" width="168" height="104" rx="6" fill="none" stroke="#0B1E3B" stroke-width="1"/>
    <line x1="428" y1="468" x2="596" y2="468" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="512" y="450" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">db-2</text>
    <text x="512" y="502" text-anchor="middle" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.04em">vol db-2</text>

    <!-- replacement db-0 (same name) -->
    <rect x="44" y="524" width="168" height="64" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
    <text x="128" y="550" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">db-0</text>
    <text x="128" y="572" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">SAME NAME</text>

    <!-- vol db-0 (reattachment target) -->
    <rect x="44" y="632" width="168" height="64" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
    <text x="128" y="670" text-anchor="middle" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.04em">vol db-0</text>

    <!-- caption -->
    <text x="320" y="736" text-anchor="middle" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">Same name, same volume.</text>
    <text x="320" y="756" text-anchor="middle" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">The identity outlived the Pod.</text>

    <!-- ============ LEGEND ============ -->
    <line x1="44" y1="780" x2="596" y2="780" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="44" y="804" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <rect x="132" y="792" width="20" height="16" rx="2" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="156" y="804" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.02em">TERMINATED</text>

    <rect x="272" y="792" width="20" height="16" rx="2" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
    <text x="296" y="804" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.02em">VOLUME (PVC)</text>

    <rect x="428" y="792" width="20" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="456" y="804" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.02em">SAME IDENTITY</text>
  </svg>
</div>
</body>
</html>
