    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: flowchart
  figure_spec:
    anchor_id: ch06-zenith-control-loop-instantiated
    diagram_type: flowchart
    source_ascii: "                    ┌───────────────────────────┐\n           \
      \         │      DESIRED STATE        │\n                    └─────────────┬─────────────┘\n\
      \                                  │\n                               compare\n\
      \                                  │\n                    ┌─────────────▼─────────────┐\n\
      \                    │      CURRENT STATE        │\n                    └─────────────┬─────────────┘\n\
      \                                  │\n                          act on the gap\n\
      \                                  │\n                                  └──────▶\
      \ (and again, forever)\n\n\n   Change only what you plug into DESIRED STATE,\
      \ and you have\n   named every controller in this chapter:\n\n        a number\
      \ ............................  ReplicaSet\n        a template + an update policy\
      \ .......  Deployment\n        one per matching node ...............  DaemonSet\n\
      \        completion ..........................  Job\n        a Job existing\
      \ at each scheduled time  CronJob\n        whatever its author decided .........\
      \  your operator\n"
    vendor_terms:
    - ReplicaSet
    - Deployment
    - DaemonSet
    - Job
    - CronJob
    complexity_hint:
      node_count: 2
      edge_count: 3
      label_count: 14
    pedagogy:
      part_18_criteria_met:
      - zenith
      - spatial_structure
      - vendor_taxonomy
      learning_outcome: Recognize that all six workload controllers are one control
        loop differing only in desired state, which is the precursor to Chapter 15's
        GitOps synthesis
      fixed_point_emphasis: true
      fixed_point_emphasis_target: The return arrow closing the cycle, labelled 'and
        again, forever'
    accessibility:
      alt_text_seed: 'A single control loop drawn once: a desired state box compares
        down to a current state box, an act-on-the-gap step follows, and an arrow
        returns to the desired state forever; beneath it a substitution list pairs
        six desired states with their controllers — a number with ReplicaSet, a template
        plus update policy with Deployment, one per matching node with DaemonSet,
        completion with Job, a Job at each scheduled time with CronJob, and whatever
        its author decided with your operator'
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Original synthesis diagram over documented controller semantics; no CNCF
        logo, icon or artwork reproduced.
