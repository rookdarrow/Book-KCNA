    diagram_type: component_diagram
    source_ascii: "  Deployment — Pods are interchangeable\n\n     web-7d4b-x9k2 \
      \     web-7d4b-mn4p      web-7d4b-qq81\n                             ✗ dies\n\
      \                               │\n                               └──▶  web-7d4b-z7rt\n\
      \                                     new name, new UID.\n                 \
      \                    Nothing depended on which one it was.\n\n\n  StatefulSet\
      \ — identity is sticky, and the storage belongs to the identity\n\n     db-0\
      \ ──┐           db-1 ──┐           db-2 ──┐\n            │                 \
      \ │                  │\n        [ vol db-0 ]       [ vol db-1 ]       [ vol\
      \ db-2 ]\n       ✗ dies  ▲\n         │     │\n         └──▶ db-0 reattaches\
      \ here\n              same name, same volume.\n              The identity outlived\
      \ the Pod.\n"
    vendor_terms:
    - Deployment
    - StatefulSet
    - Pod
    complexity_hint:
      node_count: 11
      edge_count: 5
      label_count: 18
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      - fixed_point
      learning_outcome: Distinguish a StatefulSet from a Deployment by whether the
        Pods are interchangeable, not by whether the application writes to disk
      fixed_point_emphasis: true
      fixed_point_emphasis_target: The reattachment arrow returning db-0 to its own
        volume, showing the identity outlived the Pod
    accessibility:
      alt_text_seed: 'Two-panel comparison: in the Deployment panel three hash-named
        Pods sit side by side, one dies and is replaced by a Pod with a different
        name and UID, with no storage shown; in the StatefulSet panel three Pods named
        db-0, db-1 and db-2 each attach to their own volume, and when db-0 dies the
        replacement takes the same name and reattaches to the same volume'
    rendering_hints:
