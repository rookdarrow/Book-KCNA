<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scheduling a Pod: Filter, Score, Bind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFE4;
    --ink:#0B1E3B;
    --muted:#1F4A4E;
    --soft:#8A8D90;
    --accent:#B58B3E;
    --rule:rgba(11,30,59,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Fira Sans', sans-serif;
    color:var(--ink);
    padding:32px 24px 48px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .eyebrow{
    font-family:'Fira Mono', monospace;
    font-size:14px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
  }
  h1{
    font-family:'Roboto Slab', serif;
    font-weight:500;
    font-size:1.75rem;
    color:var(--ink);
    margin:0 0 8px;
  }
  .subtitle{
    font-family:'Fira Sans', sans-serif;
    font-size:16px;
    color:var(--muted);
    margin:0 0 24px;
  }
  .diagram{width:100%;height:auto;display:block;}
  .colophon{
    margin-top:24px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    font-family:'Fira Mono', monospace;
    font-size:14px;
    color:var(--soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">CH07 &middot; FIG 01</p>
  <h1>Scheduling a Pod: Filter, Score, Bind</h1>
  <p class="subtitle">The scheduler decides which node — the kubelet is the one that acts on it.</p>

  <svg class="diagram" viewBox="0 0 680 1224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch07-fig01-filter-score-bind-title ch07-fig01-filter-score-bind-desc">
    <title id="ch07-fig01-filter-score-bind-title">Kubernetes Pod scheduling: filter, score, bind</title>
    <desc id="ch07-fig01-filter-score-bind-desc">Three-stage scheduler pipeline: FILTER keeps three of five candidate nodes, SCORE ranks the survivors with node-c highest at 91, and BIND draws the fixed-point arrow from kube-scheduler to kube-apiserver assigning the Pod to node-c. A separate, unconnected panel below shows the kubelet on node-c starting the container runtime.</desc>

    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
        <polygon points="0 0, 9 4, 0 8" fill="#1F4A4E"/>
      </marker>
      <marker id="arrow-accent" markerWidth="12" markerHeight="10" refX="9.5" refY="5" orient="auto">
        <polygon points="0 0, 12 5, 0 10" fill="#B58B3E"/>
      </marker>
    </defs>

    <rect width="680" height="1224" fill="#F5EFE4"/>

    <!-- POD -> FILTER connector -->
    <line x1="340" y1="144" x2="340" y2="176" stroke="#1F4A4E" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- UNBOUND POD -->
    <rect x="200" y="24" width="280" height="72" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="48" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.10em" fill="#8A8D90">UNBOUND POD</text>
    <rect x="260" y="60" width="160" height="24" rx="4" fill="rgba(11,30,59,0.05)"/>
    <text x="340" y="76" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="600" fill="#0B1E3B">spec.nodeName</text>

    <text x="340" y="124" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">(empty — this is what the scheduler watches for)</text>

    <!-- FILTER -> SCORE connector -->
    <line x1="340" y1="388" x2="340" y2="420" stroke="#1F4A4E" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- FILTER -->
    <rect x="40" y="180" width="600" height="208" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="64" y="212" font-family="'Fira Sans', sans-serif" font-weight="700" font-size="16" fill="#0B1E3B">1 &middot; FILTER</text>

    <g font-family="'Fira Mono', monospace" font-size="14">
      <text x="64" y="244" fill="#0B1E3B">node-a</text>
      <line x1="184" y1="240" x2="556" y2="240" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="244" text-anchor="end" font-weight="600" fill="#0B1E3B">keep</text>
      <text x="64" y="268" fill="#8A8D90">node-b</text>
      <line x1="184" y1="264" x2="556" y2="264" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="268" text-anchor="end" fill="#8A8D90">drop</text>
      <text x="64" y="292" fill="#0B1E3B">node-c</text>
      <line x1="184" y1="288" x2="556" y2="288" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="292" text-anchor="end" font-weight="600" fill="#0B1E3B">keep</text>
      <text x="64" y="316" fill="#8A8D90">node-d</text>
      <line x1="184" y1="312" x2="556" y2="312" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="316" text-anchor="end" fill="#8A8D90">drop</text>
      <text x="64" y="340" fill="#0B1E3B">node-e</text>
      <line x1="184" y1="336" x2="556" y2="336" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="340" text-anchor="end" font-weight="600" fill="#0B1E3B">keep</text>
    </g>
    <text x="340" y="372" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.08em" fill="#8A8D90">= FEASIBLE SET</text>

    <!-- SCORE -> BIND connector -->
    <line x1="340" y1="584" x2="340" y2="616" stroke="#1F4A4E" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- SCORE -->
    <rect x="40" y="424" width="600" height="160" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="64" y="456" font-family="'Fira Sans', sans-serif" font-weight="700" font-size="16" fill="#0B1E3B">2 &middot; SCORE</text>

    <g font-family="'Fira Mono', monospace" font-size="14">
      <text x="64" y="488" fill="#0B1E3B">node-a</text>
      <line x1="184" y1="484" x2="556" y2="484" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="488" text-anchor="end" fill="#0B1E3B">72</text>
      <rect x="56" y="500" width="568" height="32" rx="4" fill="none" stroke="#0B1E3B" stroke-width="1"/>
      <text x="64" y="512" fill="#0B1E3B" font-weight="700">node-c</text>
      <line x1="184" y1="508" x2="556" y2="508" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="512" text-anchor="end" font-weight="700" fill="#0B1E3B">91</text>
      <text x="64" y="536" fill="#0B1E3B">node-e</text>
      <line x1="184" y1="532" x2="556" y2="532" stroke="#8A8D90" stroke-width="0.8" stroke-dasharray="2,3"/>
      <text x="616" y="536" text-anchor="end" fill="#0B1E3B">68</text>
    </g>
    <text x="340" y="568" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.08em" fill="#8A8D90">HIGHEST WINS</text>

    <!-- BIND -->
    <rect x="40" y="620" width="600" height="224" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="64" y="652" font-family="'Fira Sans', sans-serif" font-weight="700" font-size="16" fill="#0B1E3B">3 &middot; BIND</text>

    <line x1="340" y1="704" x2="340" y2="768" stroke="#B58B3E" stroke-width="7" stroke-opacity="0.25" stroke-linecap="round"/>
    <line x1="340" y1="704" x2="340" y2="768" stroke="#B58B3E" stroke-width="3.2" marker-end="url(#arrow-accent)"/>
    <rect x="352" y="728" width="76" height="20" fill="#ffffff"/>
    <text x="358" y="740" font-family="'Fira Mono', monospace" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#B58B3E">ASSIGNS</text>

    <rect x="220" y="672" width="240" height="32" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="692" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-weight="600" font-size="16" fill="#0B1E3B">kube-scheduler</text>

    <rect x="220" y="768" width="240" height="32" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="788" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-weight="600" font-size="16" fill="#0B1E3B">kube-apiserver</text>

    <text x="340" y="828" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">&quot;this Pod: node-c&quot;</text>

    <!-- divider -->
    <text x="340" y="872" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">separate actor, separate moment, separate arrow</text>
    <line x1="40" y1="892" x2="640" y2="892" stroke="#8A8D90" stroke-width="1" stroke-dasharray="6,6"/>

    <!-- KUBELET PANEL -->
    <rect x="40" y="924" width="600" height="176" rx="8" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>

    <rect x="180" y="940" width="320" height="40" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="964" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-weight="600" font-size="16" fill="#0B1E3B">kubelet on node-c</text>

    <line x1="340" y1="980" x2="340" y2="1032" stroke="#1F4A4E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="352" y="996" width="72" height="20" fill="#ffffff"/>
    <text x="358" y="1008" font-family="'Fira Mono', monospace" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#0B1E3B">STARTS</text>

    <rect x="160" y="1036" width="360" height="48" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="1064" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-weight="600" font-size="16" fill="#0B1E3B">container runtime &rarr; containers</text>

    <!-- LEGEND -->
    <line x1="40" y1="1124" x2="640" y2="1124" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="40" y="1148" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.14em" fill="#8A8D90">LEGEND</text>

    <line x1="40" y1="1176" x2="72" y2="1176" stroke="#1F4A4E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="80" y="1180" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">Scheduling progression</text>

    <line x1="284" y1="1176" x2="316" y2="1176" stroke="#B58B3E" stroke-width="3.2" marker-end="url(#arrow-accent)"/>
    <text x="324" y="1180" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">Fixed point — scheduler writes bind</text>

    <line x1="40" y1="1204" x2="72" y2="1204" stroke="#8A8D90" stroke-width="1" stroke-dasharray="6,6"/>
    <text x="80" y="1208" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">Separate actor — no direct call</text>
  </svg>

  <p class="colophon">ch07-fig01-filter-score-bind &middot; flowchart &middot; Lodestar Ledgers</p>
</div>
</body>
</html>
