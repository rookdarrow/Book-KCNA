    <h1>topologyKey Changes the Domain, Not the Rule</h1>

      <title id="ch07-fig04-pod-affinity-anti-affinity-topology-title">topologyKey scope: hostname vs. zone anti-affinity</title>
      <desc id="ch07-fig04-pod-affinity-anti-affinity-topology-desc">Two panels showing the same six-node, two-zone cluster. With topologyKey set to hostname, all six nodes host a web Pod. With topologyKey set to zone, only one node per zone does — six placements become two.</desc>

      <!-- zone containers -->

      <rect x="272" y="336" width="120" height="64" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <rect x="408" y="336" width="120" height="64" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>

      <rect x="408" y="708" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>

      <!-- framing statement -->
      <text text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">
        <tspan x="332" y="64">Same cluster. Same rule: no two Pods labelled app=web in one domain.</tspan>
        <tspan x="332" y="88">The only difference is the topologyKey.</tspan>
      </text>

        <tspan x="332" y="430" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">6 domains &#8594; up to 6 Pods placed</tspan>

        <tspan x="332" y="360" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n5</tspan>
        <tspan x="332" y="382" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#B58B3E">[web]</tspan>
        <tspan x="468" y="360" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n6</tspan>
        <tspan x="468" y="382" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#B58B3E">[web]</tspan>

        <tspan x="332" y="802" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">2 domains &#8594; at most 2 Pods placed</tspan>
      </text>

      <!-- panel 2 zone labels + node contents -->
      <text>
        <tspan x="132" y="554" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">ZONE-A</tspan>
        <tspan x="196" y="596" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n1</tspan>
        <tspan x="196" y="618" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#B58B3E">[web]</tspan>
        <tspan x="332" y="610" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n2</tspan>
        <tspan x="468" y="610" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n3</tspan>

        <tspan x="196" y="732" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n4</tspan>
        <tspan x="196" y="754" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#B58B3E">[web]</tspan>
        <tspan x="332" y="746" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n5</tspan>
        <tspan x="468" y="746" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">n6</tspan>

      <!-- closing insight -->
      <text x="332" y="850" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic" font-weight="400" fill="#0B1E3B">One label key changed. The rule&#8217;s meaning changed with it.</text>
