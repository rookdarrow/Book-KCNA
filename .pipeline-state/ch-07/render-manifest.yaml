  diagram_type: k8s_architecture
  figure_spec:
    anchor_id: ch07-fig04-pod-affinity-anti-affinity-topology
    diagram_type: k8s_architecture
    source_ascii: 'SAME CLUSTER. SAME RULE: "no two Pods labeled app=web in one domain."

      THE ONLY DIFFERENCE IS THE topologyKey.


      topologyKey: kubernetes.io/hostname       topologyKey: topology.kubernetes.io/zone

      a domain = one node                       a domain = one zone


      ┌── zone-a ──────────────────┐            ┌── zone-a ──────────────────┐

      │  n1 [web]   n2 [web]       │            │  n1 [web]   n2      n3     │

      │  n3 [web]                  │            │                            │

      └────────────────────────────┘            └────────────────────────────┘

      ┌── zone-b ──────────────────┐            ┌── zone-b ──────────────────┐

      │  n4 [web]   n5 [web]       │            │  n4 [web]   n5      n6     │

      │  n6 [web]                  │            │                            │

      └────────────────────────────┘            └────────────────────────────┘


      6 domains  →  up to 6 Pods placed         2 domains  →  at most 2 Pods placed


      One label key changed. The rule''s meaning changed with it.

      '
    vendor_terms:
    - kubernetes-node
    - kubernetes-pod
    complexity_hint:
      node_count: 16
      edge_count: 0
      label_count: 22
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      - quantitative_relationships
      learning_outcome: Explain how changing topologyKey changes the meaning of an
        unchanged inter-Pod anti-affinity rule, and why zone-level spread is dramatically
        stricter than node-level spread
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the [web] Pod tags — six of them in the left panel,
        two in the right
    accessibility:
      alt_text_seed: Two panels showing the same six-node, two-zone cluster. With
        topologyKey set to hostname, all six nodes host a web Pod. With topologyKey
        set to zone, only one node per zone does — six placements become two.
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: false
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Original worked example using well-known Kubernetes node label keys;
        no vendor artwork or trade dress.
