    source_ascii: "     ┌────────────────────────────────────────────────┐\n     │\
      \  NODE                                          │\n     │  taint:  key=value:EFFECT\
      \   ───▶  repels       │  refusal originates HERE\n     └────────────────────────────────────────────────┘\n\
      \          ▲                ▲                  ●\n          │              \
      \  │                  └─ Pod C: already aboard, no toleration\n          │ \
      \               └───────────────────  Pod B: arriving, matching toleration\n\
      \          └────────────────────────────────────  Pod A: arriving, no toleration\n\
      \                     (tolerations belong to the POD)\n\n┌──────────────────┬────────────────┬─────────────────┬─────────────────────┐\n\
      │ EFFECT           │ Pod A          │ Pod B           │ Pod C              \
      \ │\n│                  │ arriving,      │ arriving,       │ already running,\
      \    │\n│                  │ no toleration  │ tolerating      │ no toleration\
      \       │\n├──────────────────┼────────────────┼─────────────────┼─────────────────────┤\n\
      │ NoSchedule       │ not placed     │ may be placed   │ unaffected         \
      \ │\n│ PreferNoSchedule │ avoided where  │ may be placed   │ unaffected    \
      \      │\n│                  │ possible       │                 │          \
      \           │\n│ NoExecute        │ not placed     │ may be placed   │ EVICTED\
      \             │\n└──────────────────┴────────────────┴─────────────────┴─────────────────────┘\n\
      \n\"may be placed\" — never \"is placed.\" The other filters and scores still\
      \ run.\n"
    vendor_terms:
    - kubernetes-node
    - kubernetes-pod
    complexity_hint:
