      │  node-c   keep   │    │  node-e ..... 68 │    │         ▼             │\n\
      │  node-d   drop   │    │                  │    │  kube-apiserver       │\n\
      │  node-e   keep   │    │  highest wins    │    │  \"this Pod: node-c\"   │\n\
      │                  │    │                  │    │                       │\n\
      │  = FEASIBLE SET  │    │                  │    │                       │\n\
      └──────────────────┘    └──────────────────┘    └───────────────────────┘\n\n\
