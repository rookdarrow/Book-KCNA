      - fixed_point
      learning_outcome: Predict what each of the three taint effects does to an arriving
        Pod and to a Pod already running on the node, and place the taint on the node
        and the toleration on the Pod
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the EVICTED cell at the intersection of the NoExecute
        row and the Pod C column
    accessibility:
      alt_text_seed: 'A node carrying a taint repels three Pods: two arriving and
        one already resident. A table below shows that NoSchedule and PreferNoSchedule
