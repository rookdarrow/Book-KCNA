    min_font_pt: 14
  diagram_type: other
  figure_spec:
    anchor_id: ch07-fig02-nodeselector-vs-affinity
    diagram_type: other
    source_ascii: "                EXPRESSIVENESS  ────────────────────────────────▶\n\
      \n              nodeSelector          required node        preferred node\n\
      \                                      affinity              affinity\n    \
      \       ┌──────────────────┐  ┌──────────────────┐  ┌──────────────────┐\nHARD\
      \       │ exact matches,   │  │ In, NotIn,       │  │                  │\nthe\
      \ rule   │ all of them      │  │ Exists,          │  │        —         │\n\
      must be    │ (implicit AND)   │  │ DoesNotExist,    │  │                  │\n\
      met        │                  │  │ Gt, Lt           │  │                  │\n\
      \           │ no match →       │  │ no match →       │  │                  │\n\
      \           │ no placement     │  │ no placement     │  │                  │\n\
      \           └──────────────────┘  └──────────────────┘  └──────────────────┘\n\
      \           ┌──────────────────┐  ┌──────────────────┐  ┌──────────────────┐\n\
      SOFT       │                  │  │                  │  │ same operators   │\n\
      the rule   │        —         │  │        —         │  │                  │\n\
      is a wish  │                  │  │                  │  │ no match →       │\n\
      \           │                  │  │                  │  │ placed anyway    │\n\
      \           └──────────────────┘  └──────────────────┘  └──────────────────┘\n\
      \nHardness and expressiveness are independent. Only ONE of the six cells is\
      \ soft.\n"
    vendor_terms: []
    complexity_hint:
      node_count: 6
      edge_count: 1
      label_count: 13
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Choose between nodeSelector, required node affinity, and preferred
        node affinity by treating hardness and expressiveness as two independent axes
        rather than one upgrade path
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the single soft cell — preferred node affinity,
        bottom-right
    accessibility:
      alt_text_seed: A two-by-three matrix. Columns are nodeSelector, required node
        affinity, preferred node affinity, increasing in expressiveness. Rows are
        hard and soft. Only three cells are filled, and only the bottom-right preferred-affinity
        cell is soft.
    rendering_hints:
      preferred_orientation: landscape
