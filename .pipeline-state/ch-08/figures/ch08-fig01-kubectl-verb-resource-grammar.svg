      <path d="M 340 440 L 340 376" fill="none" stroke="#B58B3E" stroke-width="1.5" marker-end="url(#kg-arrow-accent)"></path>

      <text x="244" y="464" text-anchor="end" font-family="'Fira Sans', sans-serif" font-size="16"><tspan fill="#0B1E3B" font-weight="400">case-</tspan><tspan fill="#B58B3E" font-weight="700">INsensitive</tspan></text>
      <text x="244" y="488" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">pod = pods = po</text>

      <text x="340" y="464" text-anchor="start" font-family="'Fira Sans', sans-serif" font-size="16"><tspan fill="#0B1E3B" font-weight="400">case-</tspan><tspan fill="#B58B3E" font-weight="700">SENSITIVE</tspan></text>
      <text x="340" y="488" text-anchor="start" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">node-7 ≠ Node-7</text>
