      <line x1="192" y1="40" x2="192" y2="364" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="296" y1="40" x2="296" y2="364" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <line x1="384" y1="40" x2="384" y2="364" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
