      <text x="144" y="228" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">apply</text>
      <text x="244" y="228" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">—</text>
