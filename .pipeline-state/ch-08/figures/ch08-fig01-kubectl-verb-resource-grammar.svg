      <text x="452" y="284" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">--replicas=5</text>

      <text x="60" y="340" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">kubectl</text>
