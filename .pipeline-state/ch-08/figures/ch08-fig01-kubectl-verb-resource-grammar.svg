<svg viewBox="0 0 544 544" role="img" aria-labelledby="kubectl-verb-resource-grammar-title kubectl-verb-resource-grammar-desc" xmlns="http://www.w3.org/2000/svg" width="556" height="556">
      <title id="kubectl-verb-resource-grammar-title">kubectl command grammar across five example commands</title>
      <desc id="kubectl-verb-resource-grammar-desc">A table aligning five kubectl commands — cordon, get, apply, scale, and describe — on the slots kubectl, command, TYPE, NAME, and flags, with two callouts noting that TYPE is case-insensitive while NAME is case-sensitive.</desc>

      <defs>
        <marker id="kg-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="kg-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
        <marker id="kg-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
      </defs>

      <rect x="0" y="0" width="544" height="544" fill="#F5EFE4"></rect>

