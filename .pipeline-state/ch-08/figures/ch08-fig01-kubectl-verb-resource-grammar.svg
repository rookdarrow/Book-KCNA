      <text x="452" y="228" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">-f deploy.yaml</text>

      <text x="60" y="284" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">kubectl</text>
      <text x="144" y="284" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">scale</text>
      <text x="244" y="284" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">deployment</text>
