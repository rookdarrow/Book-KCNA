      <text x="60" y="68" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#1F4A4E">kubectl</text>
      <text x="144" y="68" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">[command]</text>
