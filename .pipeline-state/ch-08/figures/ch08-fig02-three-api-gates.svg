<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="three-api-gates-title three-api-gates-desc" width="520" height="694">
        <title id="three-api-gates-title">Three API Gates: Authentication, Authorization, Admission</title>
        <desc id="three-api-gates-desc">A Kubernetes API request passes in order through three gates — Authentication, Authorization, and Admission — any of which can reject it, while only Admission can also rewrite the request before the result rejoins the forward path and is persisted to etcd.</desc>
        <defs>
          <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"></polygon>
          </marker>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F5EFE4"></rect>

        <!-- ===== Arrows (drawn before nodes) ===== -->

        <!-- request -> Gate 1 -->
        <line x1="300" y1="72" x2="300" y2="84" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arrow-ink)"></line>

        <!-- Gate 1 -> Gate 2 (main spine) -->
        <line x1="300" y1="152" x2="300" y2="244" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arrow-ink)"></line>

        <!-- Gate 2 -> Gate 3 (main spine) -->
        <line x1="300" y1="312" x2="300" y2="404" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arrow-ink)"></line>

        <!-- Gate 3 -> merge point (plain, converges — no marker) -->
        <line x1="300" y1="472" x2="300" y2="632" stroke="#0B1E3B" stroke-width="1"></line>

        <!-- merge point -> Persisted to etcd -->
        <line x1="300" y1="632" x2="300" y2="668" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arrow-ink)"></line>

        <!-- Gate 1 -> REJECT -->
        <path d="M220,152 L220,192 Q220,200 212,200 L144,200" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>

        <!-- Gate 2 -> REJECT -->
        <path d="M220,312 L220,352 Q220,360 212,360 L144,360" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>

        <!-- Gate 3 -> REJECT -->
        <path d="M220,472 L220,544 Q220,552 212,552 L144,552" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>

        <!-- Gate 3 -> REWRITTEN -> merge point (focal, dashed return path — no marker, converges) -->
        <path d="M420,440 L472,440 Q480,440 480,448 L480,624 Q480,632 472,632 L300,632" fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="5,4"></path>
        <circle cx="420" cy="440" r="3" fill="#B58B3E"></circle>

        <!-- REWRITTEN label (masked, 8px clear of the connector) -->
        <rect x="346" y="612" width="88" height="12" rx="2" fill="#F5EFE4"></rect>
        <text x="390" y="620" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.04em" fill="#B58B3E">REWRITTEN</text>

        <!-- ===== Merge point ===== -->
        <circle cx="300" cy="632" r="4" fill="#0B1E3B"></circle>

        <!-- ===== Nodes ===== -->

        <!-- REQUEST (start) -->
        <rect x="240" y="40" width="120" height="32" rx="16" fill="#F5EFE4"></rect>
        <rect x="240" y="40" width="120" height="32" rx="16" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="300" y="60" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">REQUEST</text>

        <!-- Gate 1: Authentication -->
        <rect x="180" y="88" width="240" height="64" rx="6" fill="#F5EFE4"></rect>
        <rect x="180" y="88" width="240" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="#0B1E3B" stroke-width="1"></rect>
        <rect x="192" y="96" width="64" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"></rect>
        <text x="224" y="108" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.08em" fill="rgba(11,30,59,0.8)">GATE 1</text>
        <text x="300" y="140" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Authentication</text>

        <!-- Gate 1 REJECT -->
        <rect x="20" y="180" width="120" height="40" rx="20" fill="#F5EFE4"></rect>
        <rect x="20" y="180" width="120" height="40" rx="20" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="80" y="204" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">REJECT</text>

        <!-- Gate 2: Authorization -->
        <rect x="180" y="248" width="240" height="64" rx="6" fill="#F5EFE4"></rect>
        <rect x="180" y="248" width="240" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="#0B1E3B" stroke-width="1"></rect>
        <rect x="192" y="256" width="64" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"></rect>
        <text x="224" y="268" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.08em" fill="rgba(11,30,59,0.8)">GATE 2</text>
        <text x="300" y="300" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Authorization</text>

        <!-- Gate 2 REJECT -->
        <rect x="20" y="340" width="120" height="40" rx="20" fill="#F5EFE4"></rect>
        <rect x="20" y="340" width="120" height="40" rx="20" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="80" y="364" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">REJECT</text>

        <!-- Gate 3: Admission -->
        <rect x="180" y="408" width="240" height="64" rx="6" fill="#F5EFE4"></rect>
        <rect x="180" y="408" width="240" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="#0B1E3B" stroke-width="1"></rect>
        <rect x="192" y="416" width="64" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"></rect>
        <text x="224" y="428" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.08em" fill="rgba(11,30,59,0.8)">GATE 3</text>
        <text x="300" y="460" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Admission</text>

        <!-- Gate 3 REJECT -->
        <rect x="20" y="532" width="120" height="40" rx="20" fill="#F5EFE4"></rect>
        <rect x="20" y="532" width="120" height="40" rx="20" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="80" y="556" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">REJECT</text>

        <!-- Persisted to etcd (data store) -->
        <rect x="188" y="672" width="224" height="64" rx="32" fill="#F5EFE4"></rect>
        <rect x="188" y="672" width="224" height="64" rx="32" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
        <text x="300" y="708" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Persisted to etcd</text>

        <!-- ===== Legend ===== -->
        <line x1="32" y1="752" x2="568" y2="752" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

        <rect x="32" y="760" width="20" height="16" rx="4" fill="rgba(11,30,59,0.03)" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="60" y="772" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">STEP</text>

        <rect x="168" y="764" width="24" height="12" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
        <text x="200" y="772" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">START / END</text>

        <rect x="300" y="764" width="24" height="12" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
        <text x="332" y="772" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">DATA STORE</text>

        <line x1="440" y1="768" x2="464" y2="768" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="5,4"></line>
        <text x="472" y="772" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">REWRITE PATH</text>
      </svg>