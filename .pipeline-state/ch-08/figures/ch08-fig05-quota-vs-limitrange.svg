<svg viewBox="0 0 640 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch08-fig05-quota-vs-limitrange-title ch08-fig05-quota-vs-limitrange-desc" width="640" height="688">
    <title id="ch08-fig05-quota-vs-limitrange-title">ResourceQuota versus LimitRange, compared by scope</title>
    <desc id="ch08-fig05-quota-vs-limitrange-desc">Side-by-side comparison: a ResourceQuota namespace boundary holds four Pods at their aggregate cap and rejects a fifth, while an unenclosed LimitRange applies its own minimum and maximum bounds to each Pod individually and fills in defaults for a fifth Pod that declares nothing.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- Panel titles -->
    <text x="168" y="128" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="600">ResourceQuota</text>
    <text x="472" y="128" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="600">LimitRange</text>

    <!-- Left: namespace boundary (focal element) -->
    <rect x="32" y="168" width="272" height="280" rx="8" fill="rgba(181,139,62,0.05)" stroke="rgba(181,139,62,0.50)" stroke-width="1.2" stroke-dasharray="4,4"></rect>
    <rect x="36" y="180" width="264" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="168" y="196" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">namespace: team-atlas — 4 pods</text>

    <!-- Left: 4 pods (admitted, uniform) -->
    <rect x="52" y="236" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="180" y="236" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="52" y="312" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="180" y="312" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>

    <!-- Left: namespace total bar, AT CAP -->
    <rect x="52" y="400" width="232" height="28" rx="4" fill="#1F4A4E" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="168" y="416" text-anchor="middle" fill="#F5EFE4" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="0.06em">AT CAP</text>

    <!-- Right: no boundary — caption states the absence -->
    <text x="472" y="196" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(no namespace boundary)<tspan x="472" y="216" fill="#0B1E3B" font-weight="500">each pod: min ≤ x ≤ max</tspan></text>

    <!-- Right: 4 pods (unenclosed, each individually bounded) -->
    <rect x="356" y="236" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="484" y="236" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="356" y="312" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="484" y="312" width="104" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>

    <!-- Right: per-pod bound bracket (graphic, not text) on each of the 4 pods -->
    <path d="M 104,248 h8 M 108,248 v32 M 104,280 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 232,248 h8 M 236,248 v32 M 232,280 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 104,324 h8 M 108,324 v32 M 104,356 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 232,324 h8 M 236,324 v32 M 232,356 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 408,248 h8 M 412,248 v32 M 408,280 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 536,248 h8 M 540,248 v32 M 536,280 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 408,324 h8 M 412,324 v32 M 408,356 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>
    <path d="M 536,324 h8 M 540,324 v32 M 536,356 h8" fill="none" stroke="#1F4A4E" stroke-width="1.2"></path>

    <!-- Arrows: a 5th Pod arrives, from below, into each panel -->
    <line x1="168" y1="496" x2="168" y2="448" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <line x1="472" y1="496" x2="472" y2="368" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>

    <!-- Arriving 5th Pod, both panels (dashed = not yet admitted) -->
    <rect x="116" y="496" width="104" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.25)" stroke-width="1" stroke-dasharray="4,3"></rect>
    <rect x="420" y="496" width="104" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.25)" stroke-width="1" stroke-dasharray="4,3"></rect>

    <!-- Outcomes -->
    <text x="168" y="584" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em">REJECTED<tspan x="168" y="608" fill="#8A8D90" font-style="italic" font-weight="400" letter-spacing="normal">the namespace total is reached</tspan></text>
    <text x="472" y="584" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em">ACCEPTED<tspan x="472" y="608" fill="#8A8D90" font-style="italic" font-weight="400" letter-spacing="normal">declares nothing,</tspan><tspan x="472" y="632" fill="#8A8D90" font-style="italic" font-weight="400" letter-spacing="normal">defaults filled in</tspan></text>
  </svg>