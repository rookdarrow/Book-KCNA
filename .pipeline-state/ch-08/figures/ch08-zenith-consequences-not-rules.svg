<svg viewBox="0 0 608 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch08-one-door-title ch08-one-door-desc" width="608" height="720">
      <title id="ch08-one-door-title">One Door — every write goes through the API server</title>
      <desc id="ch08-one-door-desc">Four administrative actions on the left — kubectl cordon, applying a quota, applying a deployment, and kubelet self-registration — all converge on a single central box labelled the API server, one door; four arrows leave it to the scheduler from chapter seven, the node controller from chapters four and eight, the workload controllers from chapter six, and the control loop from chapter three, with a single arrow running down from the box to etcd.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Column headers -->
      <text fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.10em"><tspan x="108" y="28">ADMINISTRATIVE</tspan><tspan x="108" y="44">ACTS (§1 §3 §4)</tspan></text>
      <text fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.10em"><tspan x="500" y="28">CONTROLLERS</tspan><tspan x="500" y="44">YOU'VE MET</tspan></text>

      <!-- Arrows: left inputs into hub -->
      <path d="M 192,104 H 200 Q 208,104 208,112 V 208 Q 208,216 216,216 H 224" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <path d="M 192,184 H 200 Q 208,184 208,192 V 240 Q 208,248 216,248 H 224" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <path d="M 192,264 H 202 Q 208,264 208,270 V 274 Q 208,280 214,280 H 224" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>
      <path d="M 192,344 H 200 Q 208,344 208,336 V 320 Q 208,312 216,312 H 224" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>

      <!-- Arrows: hub out to controllers -->
      <path d="M 384,216 H 392 Q 400,216 400,208 V 124 Q 400,116 408,116 H 416" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <path d="M 384,248 H 392 Q 400,248 400,240 V 228 Q 400,220 408,220 H 416" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <path d="M 384,280 H 392 Q 400,280 400,288 V 316 Q 400,324 408,324 H 416" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <path d="M 384,312 H 392 Q 400,312 400,320 V 420 Q 400,428 408,428 H 416" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>

      <!-- Arrow: hub down to etcd -->
      <line x1="304" y1="324" x2="304" y2="516" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>

      <!-- Node: kubectl cordon -->
      <rect x="24" y="76" width="168" height="56" rx="6" fill="#F5EFE4"></rect>
      <rect x="24" y="76" width="168" height="56" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text x="108" y="108" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">kubectl cordon</text>

      <!-- Node: kubectl apply -f quota.yaml -->
      <rect x="24" y="156" width="168" height="56" rx="6" fill="#F5EFE4"></rect>
      <rect x="24" y="156" width="168" height="56" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle"><tspan x="108" y="179">kubectl apply -f</tspan><tspan x="108" y="195">quota.yaml</tspan></text>

      <!-- Node: kubectl apply -f deploy.yaml -->
      <rect x="24" y="236" width="168" height="56" rx="6" fill="#F5EFE4"></rect>
      <rect x="24" y="236" width="168" height="56" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle"><tspan x="108" y="259">kubectl apply -f</tspan><tspan x="108" y="275">deploy.yaml</tspan></text>

      <!-- Node: kubelet self-registration -->
      <rect x="24" y="316" width="168" height="56" rx="6" fill="#F5EFE4"></rect>
      <rect x="24" y="316" width="168" height="56" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle"><tspan x="108" y="339">kubelet self-</tspan><tspan x="108" y="355">registration</tspan></text>

      <!-- Node: the API server / ONE DOOR (focal) -->
      <rect x="224" y="204" width="160" height="120" rx="6" fill="#F5EFE4"></rect>
      <rect x="224" y="204" width="160" height="120" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <rect x="254" y="224" width="100" height="24" rx="4" fill="rgba(181,139,62,0.14)" stroke="#B58B3E" stroke-width="1"></rect>
      <text x="304" y="240" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">ONE DOOR</text>
      <text x="304" y="272" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">the API server</text>
      <text x="304" y="292" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">kube-apiserver</text>

      <!-- Node: scheduler (Ch 7) -->
      <rect x="416" y="76" width="168" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="416" y="76" width="168" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="500" y="111" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">scheduler</text>
      <text x="500" y="133" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">Ch 7</text>

      <!-- Node: node controller (Ch 4/8) -->
      <rect x="416" y="180" width="168" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="416" y="180" width="168" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="500" y="215" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">node controller</text>
      <text x="500" y="237" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">Ch 4/8</text>

      <!-- Node: workload controllers (Ch 6) -->
      <rect x="416" y="284" width="168" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="416" y="284" width="168" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle"><tspan x="500" y="314">workload</tspan><tspan x="500" y="332">controllers</tspan></text>
      <text x="500" y="352" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">Ch 6</text>

      <!-- Node: the control loop (Ch 3) -->
      <rect x="416" y="388" width="168" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="416" y="388" width="168" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="500" y="423" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">the control loop</text>
      <text x="500" y="445" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">Ch 3</text>

      <!-- Node: etcd (store) -->
      <rect x="224" y="516" width="160" height="64" rx="6" fill="#F5EFE4"></rect>
      <rect x="224" y="516" width="160" height="64" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
      <text x="304" y="554" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="middle">etcd</text>

      <!-- Editorial callout -->
      <line x1="24" y1="604" x2="584" y2="604" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle"><tspan x="304" y="628">Every write above — kubectl or kubelet — passes through</tspan><tspan x="304" y="650">this one door before the scheduler, node controller,</tspan><tspan x="304" y="672">workload controllers, or control loop ever see it.</tspan></text>
    </svg>