<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node lifecycle: cordon, drain, uncordon</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-accent: #B58B3E;
      --font-sans:  'Fira Sans', sans-serif;
      --font-slab:  'Roboto Slab', serif;
      --font-mono:  'Fira Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 680px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-slab);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine &middot; Diagram Design</p>
    <h1>Node Lifecycle: Cordon, Drain, Uncordon</h1>

    <svg viewBox="0 0 800 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="node-lifecycle-title node-lifecycle-desc">
      <title id="node-lifecycle-title">Node lifecycle: cordon, drain, uncordon</title>
      <desc id="node-lifecycle-desc">State diagram of a Kubernetes Node moving through Schedulable, Cordoned, Drained, and Schedulable-again states via kubectl cordon, drain, and uncordon, showing Pods A, B, and C unchanged and still running across the Schedulable and Cordoned states, removed after drain, and a new Pod admitted in the Schedulable states but turned away while Cordoned.</desc>
      <defs>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/>
        </marker>
        <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ===== Main flow: Schedulable -> Cordoned -> Drained -> Schedulable ===== -->
      <line x1="400" y1="160" x2="400" y2="300" stroke="#0B1E3B" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
      <line x1="400" y1="420" x2="400" y2="560" stroke="#0B1E3B" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
      <line x1="400" y1="680" x2="400" y2="820" stroke="#0B1E3B" stroke-width="1.2" marker-end="url(#arrow-ink)"/>

      <!-- Transition labels: kubectl verb, beside the vertical line -->
      <rect x="408" y="208" width="140" height="44" fill="#F5EFE4"/>
      <text x="416" y="224" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">KUBECTL</text>
      <text x="416" y="248" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">CORDON</text>

      <rect x="408" y="468" width="140" height="44" fill="#F5EFE4"/>
      <text x="416" y="484" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">KUBECTL</text>
      <text x="416" y="508" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">DRAIN</text>

      <rect x="408" y="728" width="140" height="44" fill="#F5EFE4"/>
      <text x="416" y="744" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">KUBECTL</text>
      <text x="416" y="768" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">UNCORDON</text>

      <!-- ===== Side channel: new Pod admission attempts (right of each panel) ===== -->
      <!-- Panel 1: admitted -->
      <line x1="672" y1="100" x2="580" y2="100" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"/>
      <rect x="580" y="72" width="88" height="16" fill="#F5EFE4"/>
      <text x="624" y="84" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW POD</text>

      <!-- Panel 2: turned away -->
      <line x1="672" y1="360" x2="596" y2="360" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="582" y1="354" x2="594" y2="366" stroke="#1F4A4E" stroke-width="1.4"/>
      <line x1="582" y1="366" x2="594" y2="354" stroke="#1F4A4E" stroke-width="1.4"/>
      <rect x="580" y="332" width="88" height="16" fill="#F5EFE4"/>
      <text x="624" y="344" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW POD</text>

      <!-- Panel 4: admitted -->
      <line x1="672" y1="880" x2="580" y2="880" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"/>
      <rect x="580" y="852" width="88" height="16" fill="#F5EFE4"/>
      <text x="624" y="864" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW POD</text>

      <!-- ===== Panel 1: Schedulable (Pods A, B, C running) ===== -->
      <rect x="220" y="40" width="360" height="120" rx="8" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="236" y="56" width="64" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="268" y="70" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="400" y="104" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">Schedulable</text>

      <rect x="232" y="108" width="336" height="48" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.5"/>
      <rect x="240" y="116" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="288" y="136" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod A</text>
      <rect x="352" y="116" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="400" y="136" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod B</text>
      <rect x="464" y="116" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="512" y="136" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod C</text>

      <!-- ===== Panel 2: Cordoned (same Pods A, B, C — unchanged) ===== -->
      <rect x="220" y="300" width="360" height="120" rx="8" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="236" y="316" width="64" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="268" y="330" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="400" y="364" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">Cordoned</text>

      <rect x="232" y="368" width="336" height="48" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.5"/>
      <rect x="240" y="376" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="288" y="396" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod A</text>
      <rect x="352" y="376" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="400" y="396" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod B</text>
      <rect x="464" y="376" width="96" height="36" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="512" y="396" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Pod C</text>

      <!-- ===== Panel 3: Drained (empty) ===== -->
      <rect x="220" y="560" width="360" height="120" rx="8" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="236" y="576" width="64" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="268" y="590" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="400" y="624" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">Drained</text>
      <text x="400" y="656" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(empty)</text>

      <!-- ===== Panel 4: Schedulable again (no Pods yet) ===== -->
      <rect x="220" y="820" width="360" height="120" rx="8" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="236" y="836" width="64" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="268" y="850" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="400" y="884" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">Schedulable</text>

      <!-- ===== Annotation callout: focal fact (Pods unchanged across panels 1-2) ===== -->
      <text x="16" y="60" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">A, B, C: unchanged,</text>
      <text x="16" y="80" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">still running in</text>
      <text x="16" y="100" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">both panels.</text>
      <text x="16" y="120" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">Cordon blocks NEW</text>
      <text x="16" y="140" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">Pods only &mdash; it</text>
      <text x="16" y="160" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">does not evict.</text>
      <path d="M 140 164 Q 188 148 236 132" fill="none" stroke="rgba(11,30,59,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="236" cy="132" r="2" fill="#0B1E3B"/>

      <!-- ===== Legend ===== -->
      <line x1="48" y1="980" x2="752" y2="980" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="48" y="1000" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="48" y="1024" width="24" height="16" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"/>
      <text x="80" y="1036" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">PODS UNCHANGED</text>

      <line x1="284" y1="1032" x2="308" y2="1032" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"/>
      <text x="316" y="1036" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">NEW POD ADMITTED</text>

      <line x1="520" y1="1032" x2="536" y2="1032" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="544" y1="1028" x2="552" y2="1036" stroke="#1F4A4E" stroke-width="1.4"/>
      <line x1="544" y1="1036" x2="552" y2="1028" stroke="#1F4A4E" stroke-width="1.4"/>
      <text x="560" y="1036" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">NEW POD TURNED AWAY</text>
    </svg>
  </div>
</body>
</html>
