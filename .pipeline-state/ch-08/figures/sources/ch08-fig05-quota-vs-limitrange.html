<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResourceQuota vs. LimitRange</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:        #F5EFE4;
    --ink:          #0B1E3B;
    --muted:        #1F4A4E;
    --soft:         #8A8D90;
    --accent:       #B58B3E;
    --accent-tint:  rgba(181,139,62,0.10);
    --rule:         rgba(11,30,59,0.12);
    --font-title:   'Roboto Slab', serif;
    --font-sans:    'Fira Sans', sans-serif;
    --font-mono:    'Fira Mono', monospace;
  }

  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .frame { max-width: 560px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--font-title);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 1.5rem;
    max-width: 46ch;
  }

  svg { width: 100%; display: block; }

  /* SVG text roles */
  .panel-heading   { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--ink); }
  .zone-label      { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.04em; fill: var(--ink); }
  .absence-caption { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.08em; fill: var(--soft); }
  .node-name       { font-family: var(--font-sans); font-size: 16px; font-weight: 500; fill: var(--ink); }
  .tag-text        { font-family: var(--font-mono); font-size: 14px; font-weight: 400; fill: var(--ink); opacity: 0.75; }
  .sublabel        { font-family: var(--font-mono); font-size: 14px; font-weight: 400; fill: var(--ink); }
  .sublabel-soft   { font-family: var(--font-mono); font-size: 14px; font-weight: 400; fill: var(--soft); }
  .bar-caption     { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.10em; fill: var(--soft); }
  .bar-label       { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.06em; fill: var(--paper); }
  .status          { font-family: var(--font-sans); font-size: 16px; font-weight: 600; fill: var(--ink); }
  .status-caption  { font-family: var(--font-sans); font-size: 14px; font-weight: 400; fill: var(--soft); }
  .legend-heading  { font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--soft); }
  .legend-text     { font-family: var(--font-mono); font-size: 14px; font-weight: 400; letter-spacing: 0.06em; fill: var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Ch08 &middot; Fig 05 &middot; Kubernetes Resource Governance</p>
  <h1>ResourceQuota vs. LimitRange</h1>
  <p class="subtitle">Same object family, opposite scope: one governs a namespace as a whole, the other bounds every individual Pod &mdash; and the two fail differently when a fifth Pod shows up.</p>

  <svg viewBox="0 0 700 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch08-fig05-quota-vs-limitrange-title ch08-fig05-quota-vs-limitrange-desc">
    <title id="ch08-fig05-quota-vs-limitrange-title">ResourceQuota vs. LimitRange enforcement compared</title>
    <desc id="ch08-fig05-quota-vs-limitrange-desc">Side-by-side comparison: a namespace boundary encloses four Pods under a quota bar shown at cap and blocks a fifth arriving Pod, while a panel with no boundary shows four Pods each bounded by individual minimum and maximum limits and admits a fifth Pod that declares nothing by filling in default values.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
    </defs>

    <rect width="700" height="840" fill="#F5EFE4"/>

    <!-- ============ PANEL A — RESOURCEQUOTA ============ -->
    <text x="350" y="36" class="panel-heading" text-anchor="middle">ResourceQuota</text>

    <!-- namespace boundary — FOCAL element -->
    <rect x="64" y="56" width="572" height="208" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="80" y="60" width="232" height="20" rx="2" fill="#F5EFE4"/>
    <text x="196" y="74" class="zone-label" text-anchor="middle">namespace: team-atlas</text>

    <!-- rejected 5th pod: connector drawn before the node it feeds -->
    <path d="M 348,320 V 266" fill="none" stroke="#0B1E3B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="338" y1="266" x2="358" y2="266" stroke="#0B1E3B" stroke-width="2"/>

    <!-- pod cohort (4 identical Pods, shown as one node + count badge) -->
    <rect x="248" y="96" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <rect x="256" y="104" width="40" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
    <text x="276" y="115" class="tag-text" text-anchor="middle">&times;4</text>
    <text x="348" y="146" class="node-name" text-anchor="middle">Pod</text>

    <!-- namespace total quota bar -->
    <text x="348" y="208" class="bar-caption" text-anchor="middle">namespace total</text>
    <rect x="248" y="216" width="200" height="32" rx="4" fill="#F5EFE4" stroke="#1F4A4E" stroke-width="1"/>
    <rect x="248" y="216" width="200" height="32" rx="4" fill="#1F4A4E"/>
    <text x="348" y="237" class="bar-label" text-anchor="middle">AT CAP</text>

    <!-- outcome -->
    <text x="368" y="284" class="status" text-anchor="start">REJECTED</text>
    <text x="368" y="302" class="status-caption" text-anchor="start">namespace total reached</text>

    <!-- the arriving 5th pod -->
    <rect x="260" y="320" width="176" height="64" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="268" y="328" width="40" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
    <text x="288" y="339" class="tag-text" text-anchor="middle">5th</text>
    <text x="348" y="358" class="node-name" text-anchor="middle">Pod</text>

    <line x1="40" y1="408" x2="660" y2="408" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

    <!-- ============ PANEL B — LIMITRANGE ============ -->
    <text x="350" y="440" class="panel-heading" text-anchor="middle">LimitRange</text>
    <text x="350" y="464" class="absence-caption" text-anchor="middle">(no namespace boundary)</text>

    <!-- accepted 5th pod: connector drawn before the node it feeds -->
    <path d="M 348,664 V 608" fill="none" stroke="#0B1E3B" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- pod cohort (4 identical Pods, shown as one node + count badge) -->
    <rect x="248" y="496" width="200" height="112" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <rect x="256" y="504" width="40" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
    <text x="276" y="515" class="tag-text" text-anchor="middle">&times;4</text>
    <text x="348" y="542" class="node-name" text-anchor="middle">Pod</text>
    <text x="348" y="566" class="sublabel" text-anchor="middle">min &le;</text>
    <text x="348" y="586" class="sublabel" text-anchor="middle">&le; max</text>

    <!-- outcome -->
    <text x="368" y="628" class="status" text-anchor="start">ACCEPTED</text>
    <text x="368" y="646" class="status-caption" text-anchor="start">defaults filled in</text>

    <!-- the arriving 5th pod -->
    <rect x="260" y="664" width="176" height="80" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"/>
    <rect x="268" y="672" width="40" height="16" rx="2" fill="none" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
    <text x="288" y="683" class="tag-text" text-anchor="middle">5th</text>
    <text x="348" y="714" class="node-name" text-anchor="middle">Pod</text>
    <text x="348" y="732" class="sublabel-soft" text-anchor="middle">(no request set)</text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="768" x2="660" y2="768" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="64" y="784" class="legend-heading" text-anchor="start">Legend</text>

    <rect x="64" y="796" width="16" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="88" y="808" class="legend-text" text-anchor="start">boundary</text>

    <rect x="214" y="796" width="16" height="16" rx="2" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="240" y="808" class="legend-text" text-anchor="start">pod &times;4</text>

    <line x1="364" y1="804" x2="380" y2="804" stroke="#0B1E3B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="380" y1="798" x2="380" y2="810" stroke="#0B1E3B" stroke-width="2"/>
    <text x="392" y="808" class="legend-text" text-anchor="start">rejected</text>

    <line x1="500" y1="804" x2="516" y2="804" stroke="#0B1E3B" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="524" y="808" class="legend-text" text-anchor="start">accepted</text>
  </svg>
</div>
</body>
</html>
