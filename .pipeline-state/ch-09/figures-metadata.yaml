  alt_text: A Service named database holds the selector app equals db. Four Pods are
    listed; three carry the label app db and one carries app cache. The three matching
    Pods send arrows toward a gate labelled Ready. Two Ready Pods pass through into
    an EndpointSlice containing 10.244.1.7 port 5432 and 10.244.4.2 port 5432. The
    third matching Pod, not Ready, is stopped at the gate. The cache Pod never matched
    the selector and sends no arrow. Beneath, the EndpointSlice controller in kube-controller-manager
    watches Services and Pods and writes the slice.
