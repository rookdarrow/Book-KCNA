  alt_text: 'A single unchanging banner reads database.production.svc.cluster.local
    and cluster IP 10.96.0.42. Beneath it, four time-step boxes labelled t0 through
    t3 each hold three Pods, drawn with different generation glyphs and different
    address fragments; no Pod or address from t0 remains at t3. Below, a chain reads
    query on the label app equals db, then answer as an EndpointSlice, then publish,
    fanning out to three consumers: the rules layer from section six, the endpoint
    list from section four, and the DNS record from section seven. The caption reads
    three readers, one answer, one question that never changed.'
