  alt_text: A four-column grid of cluster DNS name shapes. Normal Service and headless
    Service occupy identical rows — my-svc, my-namespace, svc, cluster.local — resolving
    to the cluster IP and to all the Pod IPs respectively. An SRV row prefixes underscore
    http underscore tcp onto the same four labels. A Pod-by-address row uses 172-17-0-3
    with dots converted to dashes and the literal pod in column three instead of svc.
    A final row uses hostname dot subdomain for a Pod's stable name. Columns two and
    four are identical in every row.
