  alt_text: Above a node boundary, kube-proxy watches a Service object holding cluster
    IP 10.96.0.42 and an EndpointSlice holding two Pod addresses with port 5432, and
    programs rules below the boundary. Inside worker-3, a frontend Pod sends traffic
    to 10.96.0.42, drawn as a dashed empty box marked nothing is here — no process,
    no socket. The traffic descends through a heavy rules layer listing modes iptables
    as default, IPVS, nftables and Windows kernelspace, then is readdressed to two
    backend Pods, one local and one on worker-11.
