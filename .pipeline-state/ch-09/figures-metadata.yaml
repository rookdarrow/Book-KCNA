  alt_text: 'A Service named database holds the selector app equals db. Four Pods
    are listed; three carry the label app db and one carries app cache. The three
    matching Pods send arrows into an EndpointSlice that lists all three: 10.244.1.7
    port 5432 ready true, 10.244.4.2 port 5432 ready true, and 10.244.4.9 port 5432
    ready false. From the slice, the two ready entries pass through a gate labeled
    Ready to traffic; the ready false entry is stopped at the gate. The cache Pod
    never matched the selector and is not listed at all. Beneath, the EndpointSlice
    controller in kube-controller-manager watches Services and Pods and writes the
    slice.'
