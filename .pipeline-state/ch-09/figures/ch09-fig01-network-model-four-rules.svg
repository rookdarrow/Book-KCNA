<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-model-title network-model-desc" width="520" height="694">
    <title id="network-model-title">Kubernetes pod network model across two nodes</title>
    <desc id="network-model-desc">Two worker nodes side by side, each holding Pods labelled with 10.244.x.x addresses. One Pod holds two containers joined over the local loopback interface. Direct lines connect a Pod to another Pod on the same node, to a Pod on the other node, and to the local kubelet, with no intermediate device on any line.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
    </defs>

    <rect width="600" height="800" fill="#F5EFE4"></rect>

    <!-- Zones -->
    <rect x="16" y="32" width="256" height="636" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.25)" stroke-width="1" stroke-dasharray="4,4"></rect>
    <rect x="324" y="32" width="256" height="524" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.25)" stroke-width="1" stroke-dasharray="4,4"></rect>
    <rect x="32" y="40" width="112" height="16" rx="2" fill="#F5EFE4"></rect>
    <rect x="340" y="40" width="120" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="40" y="52" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">WORKER-3<tspan x="348" y="52">WORKER-11</tspan></text>

    <!-- Connectors (drawn before nodes) -->
    <!-- intra-node: Pod 10.244.1.7 -> Pod 10.244.1.8, same worker -->
    <path d="M144,248 L144,440" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
    <!-- cross-node, focal: Pod 10.244.1.7 -> Pod 10.244.4.2, crosses both node boundaries -->
    <path d="M184,248 V304 Q184,312 192,312 H444 Q452,312 452,304 V180" fill="none" stroke="#B58B3E" stroke-width="1.2"></path>
    <!-- kubelet -> Pod 10.244.1.8 -->
    <path d="M144,580 L144,516" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>
    <!-- loopback: ctr a <-> ctr b -->
    <line x1="124" y1="208" x2="164" y2="208" stroke="#1F4A4E" stroke-width="1"></line>

    <!-- Pod 10.244.1.7 (worker-3) -->
    <rect x="36" y="104" width="216" height="144" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="44" y="184" width="80" height="48" rx="4" fill="#F5EFE4" stroke="#1F4A4E" stroke-width="1"></rect>
    <rect x="164" y="184" width="80" height="48" rx="4" fill="#F5EFE4" stroke="#1F4A4E" stroke-width="1"></rect>
    <rect x="132" y="184" width="24" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="144" y="136" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Pod<tspan x="144" y="160" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">10.244.1.7</tspan></text>
    <text x="84" y="216" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">ctr a<tspan x="144" y="196" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#8A8D90">lo</tspan><tspan x="204" y="216">ctr b</tspan></text>

    <!-- Pod 10.244.1.8 (worker-3) -->
    <rect x="36" y="440" width="216" height="76" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="144" y="472" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Pod<tspan x="144" y="496" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">10.244.1.8</tspan></text>

    <!-- kubelet (worker-3) -->
    <rect x="72" y="580" width="144" height="48" rx="6" fill="#F5EFE4" stroke="#1F4A4E" stroke-width="1"></rect>
    <text x="144" y="612" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">kubelet</text>

    <!-- Pod 10.244.4.2 (worker-11) -->
    <rect x="344" y="104" width="216" height="76" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="452" y="136" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Pod<tspan x="452" y="160" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">10.244.4.2</tspan></text>

    <!-- Pod 10.244.4.3 (worker-11) -->
    <rect x="344" y="440" width="216" height="76" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="452" y="472" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Pod<tspan x="452" y="496" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E">10.244.4.3</tspan></text>
  </svg>