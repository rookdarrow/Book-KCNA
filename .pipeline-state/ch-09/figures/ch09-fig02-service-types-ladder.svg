<svg viewBox="0 0 760 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-types-ladder-title service-types-ladder-desc" width="640" height="843">
      <title id="service-types-ladder-title">Kubernetes Service Types: The Additive Ladder</title>
      <desc id="service-types-ladder-desc">Three concentric rings show ClusterIP, NodePort, and LoadBalancer as additive layers of one mechanism, each adding reach without removing the one inside it; below a heavy double-ruled boundary marked not on the ladder, ExternalName is shown as a separate mechanism, a CNAME record with no cluster IP, no endpoints, and no proxying.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ============ RINGS: the additive ladder ============ -->

      <!-- Ring 1: LoadBalancer — outermost, broadest reach -->
      <rect x="40" y="40" width="680" height="520" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <!-- Ring 2: NodePort -->
      <rect x="72" y="152" width="616" height="376" rx="8" fill="rgba(31,74,78,0.04)" stroke="#1F4A4E" stroke-width="1"></rect>
      <!-- Ring 3: ClusterIP — innermost, the default type -->
      <rect x="104" y="264" width="552" height="232" rx="8" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1.2"></rect>

      <!-- Ring 1 label tab -->
      <rect x="56" y="32" width="132" height="16" fill="#F5EFE4"></rect>
      <text x="64" y="44" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LOADBALANCER</text>

      <!-- Ring 1 body -->
      <text x="64" y="84" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">LoadBalancer</text>
      <text x="64" y="108" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">reachable from: the internet</text>
      <text x="64" y="128" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">(external LB — supplied by your cloud provider, not Kubernetes)</text>

      <!-- Ring 2 label tab -->
      <rect x="88" y="144" width="100" height="16" fill="#F5EFE4"></rect>
      <text x="96" y="156" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">NODEPORT</text>

      <!-- Ring 2 body -->
      <text x="96" y="180" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">NodePort</text>
      <text x="96" y="204" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">reachable from: anything that can reach a node</text>
      <text x="96" y="224" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace">&lt;node-ip&gt;:&lt;static-port&gt; — every node</text>

      <!-- Ring 3 label tab -->
      <rect x="120" y="256" width="100" height="16" fill="#F5EFE4"></rect>
      <text x="128" y="268" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">CLUSTERIP</text>

      <!-- Ring 3 body — centered, self-contained -->
      <text x="380" y="360" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">ClusterIP</text>
      <text x="380" y="384" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">reachable from: inside the cluster only</text>
      <text x="380" y="404" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(the default type)</text>

      <!-- Caption -->
      <text x="380" y="588" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Each ring adds to the ones inside it.</text>
      <text x="380" y="612" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Asking for an outer ring does not remove the inner ones.</text>

      <!-- ============ FOCAL: the double-ruled separator ============ -->
      <line x1="40" y1="640" x2="720" y2="640" stroke="#B58B3E" stroke-width="1.2"></line>
      <text x="380" y="672" fill="#B58B3E" font-size="16" font-weight="700" font-family="'Fira Sans', sans-serif" text-anchor="middle" letter-spacing="0.02em">NOT ON THE LADDER</text>
      <text x="380" y="696" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NOT A FOURTH RING · SEPARATE MECHANISM</text>
      <line x1="40" y1="716" x2="720" y2="716" stroke="#B58B3E" stroke-width="1.2"></line>

      <!-- ============ ExternalName: a separate mechanism, not nested ============ -->
      <rect x="40" y="740" width="680" height="164" rx="8" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>

      <rect x="56" y="732" width="140" height="16" fill="#F5EFE4"></rect>
      <text x="64" y="744" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">EXTERNALNAME</text>

      <text x="380" y="780" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">ExternalName</text>

      <!-- CNAME connector: both endpoints share y, straight line permitted -->
      <text x="220" y="820" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">my-svc</text>
      <line x1="232" y1="820" x2="512" y2="820" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <rect x="344" y="796" width="72" height="16" fill="#F5EFE4"></rect>
      <text x="380" y="808" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CNAME</text>
      <text x="528" y="820" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">api.foo.bar.example</text>

      <text x="380" y="860" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">no cluster IP · no endpoints · no proxying of any kind</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="928" x2="720" y2="928" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="40" y="944" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

      <rect x="220" y="936" width="16" height="12" rx="2" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="244" y="944" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Ring — additive layer</text>

      <g>
        <line x1="480" y1="938" x2="504" y2="938" stroke="#B58B3E" stroke-width="1.2"></line>
        <line x1="480" y1="946" x2="504" y2="946" stroke="#B58B3E" stroke-width="1.2"></line>
      </g>
      <text x="512" y="944" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Boundary — not on the ladder</text>
    </svg>