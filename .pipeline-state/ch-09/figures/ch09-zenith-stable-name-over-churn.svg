<svg viewBox="0 0 736 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svc-churn-title svc-churn-desc" width="820" height="829">
      <title id="svc-churn-title">Kubernetes Service: one stable name over churning Pods</title>
      <desc id="svc-churn-desc">A Service's name and cluster IP stay constant across four time steps while every backing Pod is replaced, and the control loop's EndpointSlice answer is published to routing rules, the endpoint list, and DNS.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Connectors: each generation's Pods answer up into the stable banner -->
      <line x1="116" y1="160" x2="116" y2="96" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="284" y1="160" x2="284" y2="96" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="452" y1="160" x2="452" y2="96" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="620" y1="160" x2="620" y2="96" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>

      <!-- Connectors: query -> answer -> publish -->
      <line x1="244" y1="376" x2="268" y2="376" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="468" y1="376" x2="492" y2="376" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>

      <!-- Fan-out: publish -> rules layer / endpoint list / DNS record -->
      <line x1="592" y1="416" x2="592" y2="480" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="144" y1="452" x2="592" y2="452" stroke="#1F4A4E" stroke-width="0.8"></line>
      <line x1="144" y1="452" x2="144" y2="480" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>
      <line x1="368" y1="452" x2="368" y2="480" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></line>

      <!-- Focal: the double-ruled banner -- the one element that never changes -->
      <rect x="44" y="32" width="648" height="64" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <rect x="48" y="36" width="640" height="56" rx="6" fill="none" stroke="#B58B3E" stroke-width="0.8"></rect>
      <text x="368" y="68" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#0B1E3B">database.production.svc.cluster.local   ·   10.96.0.42</text>

      <!-- Snapshot t0 -->
      <rect x="44" y="160" width="144" height="96" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
      <rect x="52" y="168" width="32" height="20" rx="3" fill="none" stroke="#8A8D90" stroke-width="0.8"></rect>
      <text x="68" y="184" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#8A8D90">t₀</text>
      <polygon points="68,201 75,214 61,214" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <polygon points="116,201 123,214 109,214" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <polygon points="164,201 171,214 157,214" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <text x="68" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.1.7</text>
      <text x="116" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.4.2</text>
      <text x="164" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.4.3</text>

      <!-- Snapshot t1 -->
      <rect x="212" y="160" width="144" height="96" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
      <rect x="220" y="168" width="32" height="20" rx="3" fill="none" stroke="#8A8D90" stroke-width="0.8"></rect>
      <text x="236" y="184" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#8A8D90">t₁</text>
      <polygon points="236,201 243,214 229,214" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <circle cx="284" cy="208" r="6" fill="none" stroke="#0B1E3B" stroke-width="1.2"></circle>
      <circle cx="332" cy="208" r="6" fill="none" stroke="#0B1E3B" stroke-width="1.2"></circle>
      <text x="236" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.1.7</text>
      <text x="284" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.2.8</text>
      <text x="332" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.2.9</text>

      <!-- Snapshot t2 -->
      <rect x="380" y="160" width="144" height="96" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
      <rect x="388" y="168" width="32" height="20" rx="3" fill="none" stroke="#8A8D90" stroke-width="0.8"></rect>
      <text x="404" y="184" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#8A8D90">t₂</text>
      <circle cx="404" cy="208" r="6" fill="none" stroke="#0B1E3B" stroke-width="1.2"></circle>
      <rect x="446" y="202" width="12" height="12" rx="1" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <rect x="494" y="202" width="12" height="12" rx="1" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <text x="404" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.2.8</text>
      <text x="452" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.5.1</text>
      <text x="500" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.5.4</text>

      <!-- Snapshot t3 -->
      <rect x="548" y="160" width="144" height="96" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
      <rect x="556" y="168" width="32" height="20" rx="3" fill="none" stroke="#8A8D90" stroke-width="0.8"></rect>
      <text x="572" y="184" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#8A8D90">t₃</text>
      <polygon points="572,201 579,208 572,215 565,208" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <polygon points="620,201 627,208 620,215 613,208" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <polygon points="668,201 675,208 668,215 661,208" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <text x="572" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.7.3</text>
      <text x="620" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.8.9</text>
      <text x="668" y="236" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">.9.0</text>

      <text x="368" y="296" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">(nothing survives from t₀ to t₃ — not one Pod, not one address)</text>

      <!-- Query -->
      <rect x="44" y="336" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="144" y="368" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Query</text>
      <text x="144" y="388" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">(app: db)</text>

      <!-- Answer -->
      <rect x="268" y="336" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="368" y="368" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Answer</text>
      <text x="368" y="388" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">(EndpointSlice)</text>

      <!-- Publish -->
      <rect x="492" y="336" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="592" y="380" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Publish</text>

      <!-- Rules layer (heavier rule -- emphasis, not a hazard) -->
      <rect x="44" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <text x="144" y="512" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Rules layer</text>
      <text x="144" y="532" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">§6</text>

      <!-- Endpoint list -->
      <rect x="268" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="368" y="512" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Endpoint list</text>
      <text x="368" y="532" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">§4</text>

      <!-- DNS record -->
      <rect x="492" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="592" y="512" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">DNS record</text>
      <text x="592" y="532" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">§7</text>

      <text x="368" y="596" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">three readers, one answer, one question that never changed</text>

      <!-- Legend -->
      <line x1="44" y1="628" x2="692" y2="628" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="44" y="648" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">POD GENERATION</text>

      <polygon points="52,665 59,678 45,678" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <text x="64" y="676" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">t₀</text>

      <circle cx="120" cy="672" r="6" fill="none" stroke="#0B1E3B" stroke-width="1.2"></circle>
      <text x="132" y="676" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">t₁</text>

      <rect x="182" y="666" width="12" height="12" rx="1" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <text x="200" y="676" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">t₂</text>

      <polygon points="256,665 263,672 256,679 249,672" fill="none" stroke="#0B1E3B" stroke-width="1.2"></polygon>
      <text x="268" y="676" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">t₃</text>

      <text x="368" y="708" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">Same glyph carries one Pod into the next snapshot; none reach t₃.</text>
    </svg>