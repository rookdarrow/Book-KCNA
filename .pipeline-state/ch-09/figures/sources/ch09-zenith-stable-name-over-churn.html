<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Name That Outlives Every Pod</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5EFE4;
    --ink: #0B1E3B;
    --muted: #1F4A4E;
    --soft: #8A8D90;
    --rule: rgba(11,30,59,0.12);
    --accent: #B58B3E;
    --accent-tint: rgba(181,139,62,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Fira Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .page { width: 100%; max-width: 656px; }
  .eyebrow {
    font-family: 'Fira Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px 0;
  }
  h1 {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: 1.75rem;
    margin: 0 0 12px 0;
    color: var(--ink);
  }
  .subtitle {
    font-family: 'Fira Sans', sans-serif;
    font-size: 16px;
    color: var(--muted);
    max-width: 56ch;
    margin: 0 0 28px 0;
    line-height: 1.5;
  }
  svg { width: 100%; height: auto; display: block; }
  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-family: 'Fira Mono', monospace;
    font-size: 14px;
    color: var(--soft);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Kubernetes &middot; Services</p>
  <h1>The Name That Outlives Every Pod</h1>
  <p class="subtitle">A Service address never moves. Three control loops keep republishing the same answer while the Pods behind it turn over completely.</p>

  <div class="diagram-wrap">
    <svg viewBox="0 0 640 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svc-churn-title svc-churn-desc">
      <title id="svc-churn-title">The Service name that outlives every Pod behind it</title>
      <desc id="svc-churn-desc">Concept map showing a Kubernetes Service's stable name and cluster IP unchanged across four time steps while its backing Pods completely turn over, with a query-answer-publish loop fanning the EndpointSlice answer out to routing rules, the endpoint list, and DNS.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="640" height="656" fill="#F5EFE4"/>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- time-box -> banner: 4 vertical, straight (shared x, no elbow needed) -->
      <line x1="92" y1="168" x2="92" y2="104" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="244" y1="168" x2="244" y2="104" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="396" y1="168" x2="396" y2="104" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="548" y1="168" x2="548" y2="104" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="100" y="128" width="32" height="16" rx="2" fill="#F5EFE4"/>
      <text x="116" y="140" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t0</text>
      <rect x="252" y="128" width="32" height="16" rx="2" fill="#F5EFE4"/>
      <text x="268" y="140" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t1</text>
      <rect x="404" y="128" width="32" height="16" rx="2" fill="#F5EFE4"/>
      <text x="420" y="140" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t2</text>
      <rect x="556" y="128" width="32" height="16" rx="2" fill="#F5EFE4"/>
      <text x="572" y="140" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">t3</text>

      <!-- query -> answer -> publish -->
      <line x1="172" y1="340" x2="272" y2="340" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="376" y1="340" x2="460" y2="340" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- publish fan-out: trunk + spine (unmarked) then three marked drops -->
      <line x1="516" y1="384" x2="516" y2="408" stroke="#1F4A4E" stroke-width="1.2"/>
      <line x1="116" y1="408" x2="524" y2="408" stroke="#1F4A4E" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="116" y1="408" x2="116" y2="432" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="408" x2="320" y2="432" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="408" x2="524" y2="432" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ BANNER — the one constant, t0 through t3 ============ -->
      <rect x="24" y="24" width="592" height="80" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <rect x="28" y="28" width="584" height="72" rx="4" fill="none" stroke="#B58B3E" stroke-width="0.8"/>
      <text x="44" y="44" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">SERVICE &mdash; SAME ANSWER, EVERY TICK</text>
      <text x="320" y="84" fill="#0B1E3B" font-size="16" font-weight="700" font-family="'Fira Mono', monospace" text-anchor="middle">database.production.svc.cluster.local &#183; 10.96.0.42</text>

      <!-- ============ TIME-STEP BOXES — everything inside turns over ============ -->

      <!-- t0 -->
      <rect x="24" y="168" width="136" height="88" rx="6" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"/>
      <polygon points="48,185 55,199 41,199" fill="#0B1E3B"/>
      <polygon points="92,185 99,199 85,199" fill="#0B1E3B"/>
      <polygon points="136,185 143,199 129,199" fill="#0B1E3B"/>
      <text x="48" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.1.7</text>
      <text x="92" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.4.2</text>
      <text x="136" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.4.3</text>

      <!-- t1 -->
      <rect x="176" y="168" width="136" height="88" rx="6" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"/>
      <polygon points="200,185 207,199 193,199" fill="#0B1E3B"/>
      <circle cx="244" cy="192" r="7" fill="#0B1E3B"/>
      <circle cx="288" cy="192" r="7" fill="#0B1E3B"/>
      <text x="200" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.1.7</text>
      <text x="244" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.2.8</text>
      <text x="288" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.2.9</text>

      <!-- t2 -->
      <rect x="328" y="168" width="136" height="88" rx="6" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"/>
      <circle cx="352" cy="192" r="7" fill="#0B1E3B"/>
      <rect x="389" y="185" width="14" height="14" rx="1" fill="#0B1E3B"/>
      <rect x="433" y="185" width="14" height="14" rx="1" fill="#0B1E3B"/>
      <text x="352" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.2.8</text>
      <text x="396" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.5.1</text>
      <text x="440" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.5.4</text>

      <!-- t3 -->
      <rect x="480" y="168" width="136" height="88" rx="6" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"/>
      <polygon points="504,185 511,192 504,199 497,192" fill="#0B1E3B"/>
      <polygon points="548,185 555,192 548,199 541,192" fill="#0B1E3B"/>
      <polygon points="592,185 599,192 592,199 585,192" fill="#0B1E3B"/>
      <text x="504" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.7.3</text>
      <text x="548" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.8.9</text>
      <text x="592" y="244" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">.9.0</text>

      <text x="320" y="288" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">nothing survives from t0 to t3 &mdash; not one Pod, not one address</text>

      <!-- ============ QUERY / ANSWER / PUBLISH ============ -->
      <rect x="24" y="312" width="592" height="72" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="124" y="336" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">query</text>
      <text x="124" y="368" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(app: db)</text>
      <text x="320" y="336" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">answer</text>
      <text x="320" y="368" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(EndpointSlice)</text>
      <text x="516" y="336" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">publish</text>

      <!-- ============ THREE CONSUMERS ============ -->

      <!-- rules layer: double-rule echoes the banner's motif, in ink, for the source's heavier border -->
      <rect x="24" y="432" width="184" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1.2"/>
      <rect x="28" y="436" width="176" height="80" rx="4" fill="none" stroke="#0B1E3B" stroke-width="0.8"/>
      <text x="116" y="472" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">rules layer</text>
      <text x="116" y="496" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">&sect;6</text>

      <rect x="228" y="432" width="184" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="320" y="472" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">endpoint list</text>
      <text x="320" y="496" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">&sect;4</text>

      <rect x="432" y="432" width="184" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
      <text x="524" y="472" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">DNS record</text>
      <text x="524" y="496" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">&sect;7</text>

      <text x="320" y="552" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">three readers &#183; one answer &#183; one question that never changed</text>

      <!-- ============ LEGEND ============ -->
      <line x1="24" y1="584" x2="616" y2="584" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="24" y="604" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

      <rect x="24" y="616" width="16" height="16" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="48" y="628" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">STABLE IDENTITY &mdash; UNCHANGED T0&ndash;T3</text>

      <polygon points="440,617 447,631 433,631" fill="#0B1E3B"/>
      <circle cx="464" cy="624" r="7" fill="#0B1E3B"/>
      <rect x="481" y="617" width="14" height="14" rx="1" fill="#0B1E3B"/>
      <polygon points="512,617 519,624 512,631 505,624" fill="#0B1E3B"/>
      <text x="528" y="628" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">POD GENERATIONS, EACH DISTINCT</text>
    </svg>
  </div>

  <footer>kubernetes &middot; service &middot; endpointslice</footer>
</div>
</body>
</html>
