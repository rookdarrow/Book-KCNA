  alt_text: 'Two stacked panels comparing Ingress routing. In the upper panel, two
    HTTP requests share the host shop.example.com but differ by path; a single IP
    address 203.0.113.10 feeds a box labelled ''reads: path'' that forks to a catalog
    Service and a checkout Service. In the lower panel, two requests share the path
    slash but differ by host; the same IP address feeds a box labelled ''reads: host''
    that forks to a shop Service and a blog Service. The matched fragment of each
    request is underlined.'
