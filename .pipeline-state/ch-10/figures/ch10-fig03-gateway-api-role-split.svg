<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gw-role-split-title gw-role-split-desc" width="600" height="800">
    <title id="gw-role-split-title">Gateway API resource ownership across three roles</title>
    <desc id="gw-role-split-desc">Hierarchy diagram showing a GatewayClass owned by the infrastructure provider, a Gateway owned by the cluster operator with exactly one reference up to GatewayClass, and three HTTPRoute resources owned by application developers each referencing the shared Gateway through parentRefs.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- ownership bands -->
    <rect x="40" y="32" width="520" height="176" rx="8" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"></rect>
    <rect x="40" y="268" width="520" height="176" rx="8" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"></rect>
    <rect x="40" y="504" width="520" height="224" rx="8" fill="rgba(11,30,59,0.03)" stroke="#8A8D90" stroke-width="1"></rect>

    <!-- connectors: exactly 1 (Gateway -> GatewayClass) -->
    <line x1="300" y1="340" x2="300" y2="160" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"></line>

    <!-- connectors: many, parentRefs (HTTPRoute x3 -> Gateway) -->
    <path d="M 140 600 L 140 488 Q 140 480 148 480 L 248 480 Q 256 480 256 472 L 256 396" fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow-accent)"></path>
    <line x1="300" y1="600" x2="300" y2="396" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"></line>
    <path d="M 460 600 L 460 488 Q 460 480 452 480 L 352 480 Q 344 480 344 472 L 344 396" fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow-accent)"></path>

    <!-- band labels -->
    <rect x="48" y="44" width="228" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="56" y="60" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">INFRASTRUCTURE PROVIDER</text>

    <rect x="48" y="280" width="160" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="56" y="296" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">CLUSTER OPERATOR</text>

    <rect x="48" y="516" width="212" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="56" y="532" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">APPLICATION DEVELOPER</text>

    <!-- nodes -->
    <rect x="212" y="104" width="176" height="56" rx="6" fill="#ffffff"></rect>
    <rect x="212" y="104" width="176" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="136" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">GatewayClass</text>

    <rect x="212" y="340" width="176" height="56" rx="6" fill="#ffffff"></rect>
    <rect x="212" y="340" width="176" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="372" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">Gateway</text>

    <rect x="68" y="600" width="144" height="56" rx="6" fill="#ffffff"></rect>
    <rect x="68" y="600" width="144" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="140" y="632" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">HTTPRoute</text>

    <rect x="228" y="600" width="144" height="56" rx="6" fill="#ffffff"></rect>
    <rect x="228" y="600" width="144" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="300" y="632" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">HTTPRoute</text>

    <rect x="388" y="600" width="144" height="56" rx="6" fill="#ffffff"></rect>
    <rect x="388" y="600" width="144" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="460" y="632" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">HTTPRoute</text>

    <!-- cardinality labels (focal) -->
    <rect x="308" y="224" width="88" height="24" rx="2" fill="#F5EFE4"></rect>
    <text x="352" y="240" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EXACTLY 1</text>

    <rect x="468" y="456" width="88" height="40" rx="2" fill="#F5EFE4"></rect>
    <text x="512" y="472" fill="#B58B3E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MANY</text>
    <text x="512" y="488" fill="#1F4A4E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" text-anchor="middle">(parentRefs)</text>

    <!-- caption -->
    <line x1="40" y1="740" x2="560" y2="740" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="300" y="764" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Bands are ownership boundaries, not runtime layers.</text>
  </svg>