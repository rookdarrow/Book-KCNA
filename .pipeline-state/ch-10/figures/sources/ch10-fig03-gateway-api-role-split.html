<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway API Resources by Ownership Role</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-soft:   #8A8D90;
      --color-accent: #B58B3E;
      --font-sans:    'Fira Sans', sans-serif;
      --font-serif:   'Roboto Slab', serif;
      --font-mono:    'Fira Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 720px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 1.8vw + 1rem, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 480px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hierarchy Tree · Gateway API</p>
    <h1>Gateway API Resources by Ownership Role</h1>

    <svg viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch10-fig03-gateway-api-role-split-title ch10-fig03-gateway-api-role-split-desc">
      <title id="ch10-fig03-gateway-api-role-split-title">Gateway API resources by organisational ownership role</title>
      <desc id="ch10-fig03-gateway-api-role-split-desc">Three stacked ownership bands: the infrastructure provider owns a GatewayClass; the cluster operator owns a Gateway that references exactly one GatewayClass; application developers own three HTTPRoutes that each reference the Gateway through parentRefs, a many-to-one relationship. A caption notes the bands are ownership boundaries, not runtime layers.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#B58B3E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ZONES -->
      <rect x="40" y="64" width="560" height="168" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.22)" stroke-width="1.2"/>
      <rect x="40" y="232" width="560" height="184" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.22)" stroke-width="1.2"/>
      <rect x="40" y="416" width="560" height="168" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.22)" stroke-width="1.2"/>

      <!-- ZONE LABELS -->
      <rect x="56" y="80" width="232" height="24" rx="2" fill="#F5EFE4"/>
      <text x="64" y="92" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" dominant-baseline="central">INFRASTRUCTURE PROVIDER</text>

      <rect x="56" y="248" width="172" height="24" rx="2" fill="#F5EFE4"/>
      <text x="64" y="260" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" dominant-baseline="central">CLUSTER OPERATOR</text>

      <rect x="56" y="432" width="212" height="24" rx="2" fill="#F5EFE4"/>
      <text x="64" y="444" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" dominant-baseline="central">APPLICATION DEVELOPER</text>

      <!-- CONNECTORS: exactly 1 (Gateway -> GatewayClass) -->
      <path d="M320,304 V192" fill="none" stroke="#B58B3E" stroke-width="4" marker-end="url(#arrow-accent)"/>
      <rect x="332" y="220" width="96" height="24" rx="2" fill="#F5EFE4"/>
      <text x="380" y="232" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.04em" dominant-baseline="central">exactly 1</text>

      <!-- CONNECTORS: many (parentRefs) (HTTPRoute x3 -> Gateway) -->
      <path d="M144,488 V424 Q144,416 152,416 H272 Q280,416 280,408 V360" fill="none" stroke="#B58B3E" stroke-width="4" marker-end="url(#arrow-accent)"/>
      <path d="M320,488 V360" fill="none" stroke="#B58B3E" stroke-width="4" marker-end="url(#arrow-accent)"/>
      <path d="M496,488 V424 Q496,416 488,416 H368 Q360,416 360,408 V360" fill="none" stroke="#B58B3E" stroke-width="4" marker-end="url(#arrow-accent)"/>
      <rect x="384" y="372" width="184" height="24" rx="2" fill="#F5EFE4"/>
      <text x="476" y="384" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.04em" dominant-baseline="central">many (parentRefs)</text>

      <!-- NODES -->
      <rect x="240" y="136" width="160" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="320" y="164" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">GatewayClass</text>

      <rect x="240" y="304" width="160" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="320" y="332" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">Gateway</text>

      <rect x="72" y="488" width="144" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="144" y="516" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">HTTPRoute</text>

      <rect x="248" y="488" width="144" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="320" y="516" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">HTTPRoute</text>

      <rect x="424" y="488" width="144" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="496" y="516" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">HTTPRoute</text>

      <!-- CAPTION -->
      <text x="320" y="648" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" text-anchor="middle">Bands are ownership boundaries, not runtime layers.</text>
    </svg>
  </div>
</body>
</html>
