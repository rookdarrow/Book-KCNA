  diagram_type: data_flow
  figure_spec:
    anchor_id: ch10-fig02-ingress-fanout-and-name-based-hosts
    diagram_type: data_flow
    source_ascii: "                    SIMPLE FANOUT — split by PATH\n\n   GET /catalog\
      \ HTTP/1.1                     ┌──────────────────┐\n   Host: shop.example.com\
      \                    │  catalog Service │\n        ▲▲▲▲▲▲▲▲                \
      \             └──────────────────┘\n                                       \
      \               ▲\n        ┌──────────────┐    ┌──────────────┐          │ path\
      \ = /catalog\n   ───▶ │ 203.0.113.10 │───▶│ reads: path  │──────────┤\n    \
      \    └──────────────┘    └──────────────┘          │ path = /checkout\n    \
      \                                                  ▼\n   GET /checkout HTTP/1.1\
      \                    ┌──────────────────┐\n   Host: shop.example.com       \
      \             │ checkout Service │\n        ▲▲▲▲▲▲▲▲▲                      \
      \      └──────────────────┘\n\n\n           NAME-BASED VIRTUAL HOSTING — split\
      \ by HOST\n\n   GET / HTTP/1.1                            ┌──────────────────┐\n\
      \   Host: shop.example.com                    │   shop Service   │\n       \
      \  ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲                    └──────────────────┘\n              \
      \                                        ▲\n        ┌──────────────┐    ┌──────────────┐\
      \          │ host = shop…\n   ───▶ │ 203.0.113.10 │───▶│ reads: host  │──────────┤\n\
      \        └──────────────┘    └──────────────┘          │ host = blog…\n    \
      \                                                  ▼\n   GET / HTTP/1.1    \
      \                        ┌──────────────────┐\n   Host: blog.example.com   \
      \                 │   blog Service   │\n         ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲          \
      \          └──────────────────┘\n\n   Same address in both. Same number of Services\
      \ in both.\n   ▲▲▲ marks the part of the request the rule matched on.\n"
    vendor_terms:
    - ingress
    - service
    complexity_hint:
      node_count: 12
      edge_count: 10
      label_count: 16
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      - fixed_point
      learning_outcome: Distinguish simple fanout from name-based virtual hosting
        by identifying which part of the HTTP request the Ingress rule reads
      fixed_point_emphasis: true
      fixed_point_emphasis_target: The underline beneath the matched request fragment
        — the path in the upper panel, the hostname in the lower — together with the
        two 'reads:' decision boxes
    accessibility:
      alt_text_seed: 'Two stacked panels comparing Ingress routing. In the upper panel,
        two HTTP requests share the host shop.example.com but differ by path; a single
        IP address 203.0.113.10 feeds a box labelled ''reads: path'' that forks to
        a catalog Service and a checkout Service. In the lower panel, two requests
        share the path slash but differ by host; the same IP address feeds a box labelled
        ''reads: host'' that forks to a shop Service and a blog Service. The matched
        fragment of each request is underlined.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders: []
      clearance: own_interpretation
      notes: Generic boxes, plain text, and example-range addresses (203.0.113.0/24,
        RFC 5737) only; no CNCF icon assets reproduced. If the renderer substitutes
        a Kubernetes icon pack, re-evaluate as licensed_icon_set.
