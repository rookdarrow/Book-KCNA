      \ SET\n   podSelector: role=db  ─────┐                    ╭───────────────╮\n\
      \   ingress from: app=web      │                    │               │\n    \
      \                          ▼                    │   app=web     │\n        \
      \                ┌───────────┐              │      +        │\n            \
      \            │  Pod      │─────────────▶│   app=batch   │\n                \
      \        │  role=db  │              │               │\n                    \
      \    └───────────┘              │  (one set,    │\n                        \
      \      ▲                    │   two grants) │\n   POLICY B                 \
      \  │                    ╰───────────────╯\n   podSelector: role=db  ─────┘\n\
      \   ingress from: app=batch\n                                              \
      \       ┌───────────┐\n   ═══▶  podSelector (chooses the SUBJECT)          \
      \  │ app=other │\n   ───▶  peer selector (chooses WHO MAY CONNECT)      └───────────┘\n\
      \                                                       no arrow.\n        \
      \                                               not denied —\n             \
      \                                          simply never\n                  \
      \                                     granted.\n"
    vendor_terms:
    - networkpolicy
    - pod
