<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kubernetes Storage Lifetime Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:       #F5EFE4;
    --color-ink:         #0B1E3B;
    --color-muted:       #1F4A4E;
    --color-soft:        #8A8D90;
    --color-accent:      #B58B3E;
    --color-accent-tint: rgba(181,139,62,0.10);
    --font-sans:  'Fira Sans', sans-serif;
    --font-serif: 'Roboto Slab', serif;
    --font-mono:  'Fira Mono', monospace;
  }

  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 760px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.6rem;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2vw + 0.9rem, 1.9rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.6rem;
  }

  .subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    color: var(--color-muted);
    line-height: 1.5;
    margin-bottom: 1.75rem;
    max-width: 60ch;
  }

  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Kubernetes Storage &middot; Nested Boundaries</p>
    <h1>The Volume Lifetime Ladder</h1>
    <p class="subtitle">Trace a file outward from the container filesystem and name which of two boundaries destroys it.</p>

    <svg viewBox="0 0 720 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch11-fig01-title ch11-fig01-desc">
      <title id="ch11-fig01-title">Kubernetes Storage Lifetime Ladder</title>
      <desc id="ch11-fig01-desc">Three nested rectangles show widening Kubernetes storage lifetimes: an innermost container writable layer that survives nothing, a middle Pod-scoped volume that survives a container restart, and an outermost cluster-scoped storage boundary that survives the Pod's deletion, with the two lifecycle boundaries marked where data below the line is discarded.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- RING 3 — CLUSTER-SCOPED STORAGE (outermost) -->
      <rect x="40" y="64" width="640" height="856" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(31,74,78,0.35)" stroke-width="1"/>
      <rect x="60" y="56" width="380" height="16" fill="#F5EFE4"/>
      <text x="68" y="68" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">CLUSTER-SCOPED STORAGE &mdash; RUNG 3</text>
      <text x="68" y="104" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">survives the Pod&#8217;s deletion</text>

      <!-- RING 2 — POD-SCOPED VOLUME -->
      <rect x="96" y="156" width="528" height="504" rx="8" fill="rgba(11,30,59,0.035)" stroke="rgba(11,30,59,0.45)" stroke-width="1"/>
      <rect x="116" y="148" width="340" height="16" fill="#F5EFE4"/>
      <text x="124" y="160" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">POD-SCOPED VOLUME &mdash; RUNG 2</text>
      <text x="124" y="196" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">survives a container restart</text>

      <!-- RING 1 — CONTAINER WRITABLE LAYER (innermost) -->
      <rect x="152" y="248" width="416" height="268" rx="8" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1.2"/>
      <rect x="172" y="240" width="380" height="16" fill="#F5EFE4"/>
      <text x="180" y="252" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">CONTAINER WRITABLE LAYER &mdash; RUNG 1</text>
      <text x="180" y="288" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">survives nothing</text>

      <!-- BOUNDARY 1 — CONTAINER RESTART (focal) -->
      <path d="M 152 560 L 568 560" fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="6,4"/>
      <path d="M 200 560 L 200 516" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="152" y="528" width="300" height="20" fill="#F5EFE4"/>
      <text x="160" y="544" fill="#B58B3E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" letter-spacing="0.04em">BOUNDARY: CONTAINER RESTART</text>
      <text x="160" y="580" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">(data below this line is discarded)</text>

      <!-- BOUNDARY 2 — POD CEASES TO EXIST (focal) -->
      <path d="M 96 740 L 624 740" fill="none" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="6,4"/>
      <path d="M 192 740 L 192 660" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="96" y="708" width="320" height="20" fill="#F5EFE4"/>
      <text x="104" y="724" fill="#B58B3E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" letter-spacing="0.04em">BOUNDARY: POD CEASES TO EXIST</text>
      <text x="104" y="760" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">(data below this line is discarded)</text>

      <!-- Closing note — editorial callout -->
      <text x="360" y="832" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">nothing in a Pod&#8217;s lifecycle crosses this outer boundary</text>
    </svg>
  </div>
</body>
</html>
