  <p class="eyebrow">Kubernetes &middot; StatefulSets</p>
  <h1>The Claim Outlives the Pod</h1>
  <p class="subtitle">A StatefulSet's PersistentVolumeClaim is bound to the replica's identity, not to any one Pod instance &mdash; it follows the Pod across a reschedule and stays behind after the Pod is deleted.</p>
