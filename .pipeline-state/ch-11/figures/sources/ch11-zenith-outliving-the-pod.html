<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storage outlives the Pod that claimed it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5EFE4;
    --ink: #0B1E3B;
    --muted: #1F4A4E;
    --soft: #8A8D90;
    --rule: rgba(11,30,59,0.12);
    --accent: #B58B3E;
    --accent-tint: rgba(181,139,62,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fira Sans', sans-serif;
    padding: 40px 24px 32px;
  }
  .page { max-width: 760px; margin: 0 auto; }
  .eyebrow {
    font-family: 'Fira Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  h1 {
    font-family: 'Roboto Slab', serif;
    font-size: 1.75rem;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 12px;
    line-height: 1.25;
  }
  .subtitle {
    font-family: 'Fira Sans', sans-serif;
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 32px;
    max-width: 46ch;
  }
  .diagram { width: 100%; }
  .diagram svg { width: 100%; height: auto; display: block; }
  footer {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-family: 'Fira Mono', monospace;
    font-size: 14px;
    color: var(--soft);
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">PersistentVolumeClaim</p>
  <h1>Storage outlives the Pod that asked for it</h1>
  <p class="subtitle">A claim is a record of intent — it survives the object that made it.</p>

  <div class="diagram">
    <svg viewBox="0 0 720 860" role="img" aria-labelledby="ch11-zenith-outliving-the-pod-title ch11-zenith-outliving-the-pod-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="ch11-zenith-outliving-the-pod-title">Storage outlives the Pod that claimed it</title>
      <desc id="ch11-zenith-outliving-the-pod-desc">A two-lane vertical timeline. The Pod lane shows three separate instances of web-1 — on node-b, then node-e, then node-e again — each separated by a gap where the Pod was rescheduled. The Storage lane runs alongside as a single unbroken bar labelled the PersistentVolumeClaim www-web-1, spanning the entire timeline, with a claims connector linking each Pod instance to it.</desc>

      <defs>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/>
        </marker>
        <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="720" height="860" fill="#F5EFE4"/>

      <!-- Lane eyebrows -->
      <text x="160" y="60" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">POD</text>
      <text x="480" y="60" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STORAGE</text>

      <!-- Time axis: runs top to bottom -->
      <line x1="650" y1="68" x2="650" y2="720" stroke="#0B1E3B" stroke-width="1"/>
      <line x1="650" y1="720" x2="650" y2="728" stroke="#0B1E3B" stroke-width="1" marker-end="url(#arrow-ink)"/>
      <text x="650" y="56" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TIME</text>

      <!-- Claims connectors (drawn before boxes) -->
      <line x1="260" y1="158" x2="380" y2="158" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
      <line x1="260" y1="398" x2="380" y2="398" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
      <line x1="260" y1="638" x2="380" y2="638" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

      <!-- Storage lane: one continuous bar, the focal element -->
      <rect x="380" y="68" width="200" height="660" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <rect x="388" y="80" width="48" height="20" rx="2" fill="transparent" stroke="rgba(181,139,62,0.5)" stroke-width="0.8"/>
      <text x="412" y="94" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PVC</text>
      <text x="480" y="392" fill="#B58B3E" font-size="16" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="middle">www-web-1</text>
      <text x="480" y="416" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">one continuous</text>
      <text x="480" y="436" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">line, never</text>
      <text x="480" y="456" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">broken</text>

      <!-- Pod segment 1 -->
      <rect x="60" y="68" width="200" height="180" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="68" y="80" width="48" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="92" y="94" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="160" y="154" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">web-1</text>
      <text x="160" y="176" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(node-b)</text>

      <!-- Gap 1: pod rescheduled -->
      <text x="160" y="282" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" font-style="italic">rescheduled</text>

      <!-- Pod segment 2 -->
      <rect x="60" y="308" width="200" height="180" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="68" y="320" width="48" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="92" y="334" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="160" y="394" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">web-1</text>
      <text x="160" y="416" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(node-e)</text>

      <!-- Gap 2: pod rescheduled -->
      <text x="160" y="522" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" font-style="italic">rescheduled</text>

      <!-- Pod segment 3 -->
      <rect x="60" y="548" width="200" height="180" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="68" y="560" width="48" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.4)" stroke-width="0.8"/>
      <text x="92" y="574" fill="rgba(11,30,59,0.8)" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="160" y="634" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">web-1</text>
      <text x="160" y="656" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(node-e)</text>

      <!-- Claims connector labels (masked, gap preserved above each line) -->
      <rect x="285" y="130" width="70" height="20" fill="#F5EFE4"/>
      <text x="320" y="144" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIMS</text>

      <rect x="285" y="370" width="70" height="20" fill="#F5EFE4"/>
      <text x="320" y="384" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIMS</text>

      <rect x="285" y="610" width="70" height="20" fill="#F5EFE4"/>
      <text x="320" y="624" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIMS</text>

      <!-- Legend -->
      <line x1="30" y1="760" x2="690" y2="760" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <rect x="30" y="780" width="16" height="16" rx="3" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="54" y="792" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">Pod — recreated on every reschedule</text>

      <rect x="30" y="812" width="16" height="16" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="54" y="824" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">PersistentVolumeClaim — persists across reschedules</text>

      <line x1="480" y1="788" x2="508" y2="788" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
      <text x="518" y="792" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">claims</text>
    </svg>
  </div>

  <footer>Fig. — ch11-zenith-outliving-the-pod</footer>
</div>
</body>
</html>
