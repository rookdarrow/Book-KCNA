<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch12-fig05-supply-chain-checkpoints-title ch12-fig05-supply-chain-checkpoints-desc" width="640" height="848">
    <title id="ch12-fig05-supply-chain-checkpoints-title">Container supply chain: checkpoints from build to run</title>
    <desc id="ch12-fig05-supply-chain-checkpoints-desc">A top-to-bottom supply chain pipeline of build, scan, sign, record, restrict, verify, and run, crossed by a horizontal boundary between restrict and verify that separates work done outside the cluster from work done inside it; each step notes what it produces and the tools that perform it, and a callout marks that the artifact's digest travels the whole length of the chain.</desc>
    <defs>
      <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#1F4A4E"></path>
      </marker>
      <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#B58B3E"></path>
      </marker>
    </defs>

    <rect width="680" height="900" fill="#F5EFE4"></rect>

    <!-- connectors (drawn before nodes) -->
    <line x1="260" y1="136" x2="260" y2="168" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="260" y1="256" x2="260" y2="288" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="260" y1="376" x2="260" y2="408" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="260" y1="496" x2="260" y2="528" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="260" y1="616" x2="260" y2="672" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arr-accent)"></line>
    <line x1="260" y1="760" x2="260" y2="792" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>

    <!-- 01 BUILD -->
    <rect x="40" y="48" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="48" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="60" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="40" y="28" font-family="Fira Mono" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">OUTSIDE THE CLUSTER</tspan>
      <tspan x="72" y="74" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">01</tspan>
      <tspan x="100" y="76" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">BUILD</tspan>
      <tspan x="100" y="96" font-family="Fira Mono" font-size="14" fill="#1F4A4E">image + digest + SBOM</tspan>
    </text>

    <!-- 02 SCAN -->
    <rect x="40" y="168" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="168" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="180" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="72" y="194" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">02</tspan>
      <tspan x="100" y="196" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">SCAN</tspan>
      <tspan x="100" y="216" font-family="Fira Mono" font-size="14" fill="#1F4A4E">known CVEs</tspan>
      <tspan x="100" y="236" font-family="Fira Mono" font-size="14" fill="#8A8D90">Trivy · Harbor scanners</tspan>
    </text>

    <!-- 03 SIGN, with digest-thread callout -->
    <rect x="40" y="288" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="288" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="300" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="72" y="314" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">03</tspan>
      <tspan x="100" y="316" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">SIGN</tspan>
      <tspan x="100" y="336" font-family="Fira Mono" font-size="14" fill="#1F4A4E">binds to the digest</tspan>
      <tspan x="100" y="356" font-family="Fira Mono" font-size="14" fill="#8A8D90">Cosign · Notation · Fulcio</tspan>
      <tspan x="500" y="300" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">the artifact's identity</tspan>
      <tspan x="500" y="324" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">— the same digest —</tspan>
      <tspan x="500" y="348" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">travels the full length</tspan>
      <tspan x="500" y="372" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">of the chain</tspan>
    </text>

    <!-- 04 RECORD -->
    <rect x="40" y="408" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="408" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="420" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="72" y="434" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">04</tspan>
      <tspan x="100" y="436" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">RECORD</tspan>
      <tspan x="100" y="456" font-family="Fira Mono" font-size="14" fill="#1F4A4E">append-only log</tspan>
      <tspan x="100" y="476" font-family="Fira Mono" font-size="14" fill="#8A8D90">Rekor</tspan>
    </text>

    <!-- 05 RESTRICT -->
    <rect x="40" y="528" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="528" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="540" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="72" y="554" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">05</tspan>
      <tspan x="100" y="556" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">RESTRICT</tspan>
      <tspan x="100" y="576" font-family="Fira Mono" font-size="14" fill="#1F4A4E">private registry</tspan>
      <tspan x="100" y="596" font-family="Fira Mono" font-size="14" fill="#8A8D90">Harbor · imagePullSecrets</tspan>
    </text>

    <!-- boundary: outside / inside the cluster (focal) -->
    <line x1="16" y1="644" x2="664" y2="644" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="4,4"></line>

    <!-- 06 VERIFY — focal node, with boundary tag, admission label, checkpoint callout -->
    <rect x="40" y="672" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="672" width="440" height="88" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <rect x="56" y="684" width="32" height="20" rx="4" fill="rgba(181,139,62,0.15)" stroke="#B58B3E" stroke-width="0.8"></rect>
    <rect x="276" y="624" width="88" height="20" rx="2" fill="#F5EFE4"></rect>
    <text>
      <tspan x="40" y="660" font-family="Fira Mono" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">INSIDE THE CLUSTER</tspan>
      <tspan x="284" y="640" font-family="Fira Mono" font-size="14" font-weight="500" letter-spacing="0.06em" fill="#0B1E3B">ADMISSION</tspan>
      <tspan x="72" y="698" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#B58B3E">06</tspan>
      <tspan x="100" y="700" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">VERIFY</tspan>
      <tspan x="100" y="720" font-family="Fira Mono" font-size="14" fill="#1F4A4E">admission controller</tspan>
      <tspan x="100" y="740" font-family="Fira Mono" font-size="14" fill="#8A8D90">Kyverno · Gatekeeper · Policy Controller</tspan>
      <tspan x="500" y="616" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">everything above</tspan>
      <tspan x="500" y="640" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">happened elsewhere —</tspan>
      <tspan x="500" y="664" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">outside our control.</tspan>
      <tspan x="500" y="688" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">VERIFY is the first</tspan>
      <tspan x="500" y="712" font-family="Fira Sans" font-style="italic" font-size="16" fill="#0B1E3B">check the cluster runs.</tspan>
    </text>

    <!-- 07 RUN -->
    <rect x="40" y="792" width="440" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="792" width="440" height="88" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.35)" stroke-width="1"></rect>
    <rect x="56" y="804" width="32" height="20" rx="4" fill="rgba(11,30,59,0.06)" stroke="rgba(11,30,59,0.25)" stroke-width="0.8"></rect>
    <text>
      <tspan x="72" y="818" text-anchor="middle" font-family="Fira Mono" font-size="14" font-weight="500" fill="#0B1E3B">07</tspan>
      <tspan x="100" y="820" font-family="Fira Sans" font-size="16" font-weight="500" fill="#0B1E3B">RUN</tspan>
    </text>

    <!-- callout leaders (drawn last, on top) -->
    <path d="M500,290 Q490,310 480,332" fill="none" stroke="rgba(11,30,59,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="480" cy="332" r="2.5" fill="#0B1E3B"></circle>
    <path d="M500,606 Q488,624 480,644" fill="none" stroke="rgba(11,30,59,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="480" cy="644" r="2.5" fill="#0B1E3B"></circle>
  </svg>