<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiceAccount token flow: auth vs authorization</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-title: 'Roboto Slab', serif;
    --font-sans:  'Fira Sans', sans-serif;
    --font-mono:  'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 640px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-title);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · Ch. 12</p>
  <h1>ServiceAccount Token Flow</h1>

  <svg viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svc-token-flow-title svc-token-flow-desc">
    <title id="svc-token-flow-title">ServiceAccount token flow: auth vs authorization</title>
    <desc id="svc-token-flow-desc">Flow from a Kubernetes ServiceAccount through the TokenRequest API and a Pod's mounted token to two gates: authentication succeeds while authorization remains unimplemented.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <!-- ================= ARROWS (behind nodes) ================= -->
    <line x1="340" y1="120" x2="340" y2="192" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="340" y1="272" x2="340" y2="320" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="340" y1="424" x2="340" y2="496" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="340" y1="608" x2="340" y2="656" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow label: spec.serviceAccountName: my-app (beside A->B segment) -->
    <rect x="100" y="134" width="224" height="18" rx="2" fill="#F5EFE4"/>
    <text x="324" y="148" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">spec.serviceAccountName:</text>
    <rect x="260" y="154" width="64" height="18" rx="2" fill="#F5EFE4"/>
    <text x="324" y="168" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">my-app</text>

    <!-- Arrow label: API request, bearing the token (beside C->D segment) -->
    <rect x="200" y="430" width="124" height="18" rx="2" fill="#F5EFE4"/>
    <text x="324" y="444" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">API request,</text>
    <rect x="156" y="450" width="168" height="18" rx="2" fill="#F5EFE4"/>
    <text x="324" y="464" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="end">bearing the token</text>

    <!-- ================= NODE A: ServiceAccount (step) ================= -->
    <rect x="180" y="40" width="320" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="68" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">ServiceAccount</text>
    <text x="340" y="88" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">ns/my-app</text>

    <text x="520" y="64" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">a namespaced API</text>
    <text x="520" y="84" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">object — an</text>
    <text x="520" y="104" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">identity, nothing more</text>

    <!-- ================= NODE B: TokenRequest API (step) ================= -->
    <rect x="180" y="192" width="320" height="80" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="240" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">TokenRequest API</text>

    <text x="520" y="224" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">short-lived,</text>
    <text x="520" y="244" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">auto-rotating</text>

    <!-- ================= NODE C: Pod (stateful) ================= -->
    <rect x="180" y="320" width="320" height="104" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
    <text x="204" y="360" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif">Pod</text>
    <text x="220" y="380" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">projected volume</text>
    <text x="236" y="400" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">&#x2514; token</text>
    <text x="328" y="400" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif">mounted, rotated</text>

    <!-- ================= NODE D: GATE 1 / AUTHENTICATION (step) ================= -->
    <rect x="180" y="496" width="320" height="112" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="524" fill="#0B1E3B" font-size="14" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.10em">GATE 1</text>
    <text x="340" y="544" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">AUTHENTICATION</text>
    <text x="340" y="564" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">&#x201C;who are you?&#x201D;</text>
    <text x="340" y="584" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">&#x2714; you are ns/my-app</text>

    <!-- ================= NODE E: GATE 2 / AUTHORIZATION (FOCAL — the gap) ================= -->
    <rect x="180" y="656" width="320" height="128" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="340" y="684" fill="#B58B3E" font-size="14" font-weight="600" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.10em">GATE 2</text>
    <text x="340" y="704" fill="#0B1E3B" font-size="16" font-weight="700" font-family="'Fira Sans', sans-serif" text-anchor="middle">AUTHORIZATION</text>
    <text x="340" y="724" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">&#x201C;what may you do?&#x201D;</text>
    <text x="340" y="760" fill="#8A8D90" font-size="24" font-family="'Fira Mono', monospace" text-anchor="middle">&#x2026;</text>

    <!-- Callout: editorial annotation, focal/accent variant, pointing at the empty gate -->
    <circle cx="500" cy="720" r="2" fill="#B58B3E"/>
    <path d="M 512 708 Q 508 714 500 720" fill="none" stroke="rgba(181,139,62,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="512" y="700" fill="#B58B3E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">nothing here yet.</text>
    <text x="512" y="720" fill="#B58B3E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">see &#xA7;3.</text>

    <!-- ================= LEGEND ================= -->
    <line x1="40" y1="848" x2="640" y2="848" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="40" y="868" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <rect x="40" y="880" width="24" height="14" rx="4" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="68" y="890" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Step</text>

    <rect x="200" y="880" width="24" height="14" rx="4" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"/>
    <text x="228" y="890" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Stateful</text>

    <rect x="360" y="880" width="24" height="14" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="388" y="890" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Focal (gap)</text>

    <line x1="520" y1="887" x2="548" y2="887" stroke="rgba(181,139,62,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="548" cy="887" r="2" fill="#B58B3E"/>
    <text x="560" y="890" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Note</text>
  </svg>
</div>
</body>
</html>
