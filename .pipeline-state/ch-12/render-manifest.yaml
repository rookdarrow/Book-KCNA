  diagram_type: flowchart
  figure_spec:
    anchor_id: ch12-fig02-rbac-four-way-matrix
    diagram_type: flowchart
    source_ascii: "   THE BOUNDARY YOU ALREADY HAVE  (Ch 4 §3)\n   ─────────────────────────────────────────\n\
      \n   NAMESPACED resource                       CLUSTER-SCOPED resource\n   lives\
      \ inside a namespace                  lives in NO namespace\n   Pod, Service,\
      \ Secret,                     Node, PersistentVolume,\n   Deployment, ConfigMap\
      \                     StorageClass, Namespace\n        │                   \
      \                         │\n        │                                     \
      \       │\n        │  a Role's scope has room for it            │  a Role has\
      \ nowhere\n        │                                            │  to put it\n\
      \        ▼                                            ▼\n   ┌─────────────────────┐\
      \                  ┌─────────────────────┐\n   │ Role                │     \
      \             │ ClusterRole         │\n   │  or ClusterRole     │  ◀── either\
      \ ──   │  FORCED             │\n   └─────────────────────┘                 \
      \ └─────────────────────┘\n\n\n   THE SECOND, INDEPENDENT QUESTION\n   ─────────────────────────────────────────\n\
      \n        where should the grant apply?\n                  │\n        ┌─────────┴──────────┐\n\
      \        ▼                    ▼\n   one namespace        every namespace\n \
      \       │                    │\n        ▼                    ▼\n   ┌──────────────┐\
      \    ┌─────────────────────┐\n   │ RoleBinding  │    │ ClusterRoleBinding  │\n\
      \   └──────────────┘    └─────────────────────┘\n\n\n   THE FOUR COMBINATIONS\
      \ FALL OUT\n   ─────────────────────────────────────────\n\n   Role      + RoleBinding\
      \         → those rules, in that namespace\n   ClusterRole + RoleBinding   \
      \    → those rules, in that ONE namespace\n   ClusterRole + ClusterRoleBinding→\
      \ those rules, everywhere\n   Role      + ClusterRoleBinding  → ✗ does not exist.\
      \ A Role's rules\n                                       are namespace-local;\
      \ there is\n                                       nothing cluster-wide to grant.\n\
      \n   ┌───────────────────────────────────────────────────────────────┐\n   │\
      \  ▶  THE BINDING DETERMINES THE SCOPE OF THE GRANT.            │\n   └───────────────────────────────────────────────────────────────┘\n"
    vendor_terms: []
    complexity_hint:
      node_count: 14
      edge_count: 11
      label_count: 30
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Derive which of Role, ClusterRole, RoleBinding and ClusterRoleBinding
        a situation calls for from the namespaced/cluster-scoped boundary, rather
        than from a memorised matrix
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the closing banner reading THE BINDING DETERMINES
        THE SCOPE OF THE GRANT
    accessibility:
      alt_text_seed: 'Three-panel derivation: namespaced resources permit either a
        Role or a ClusterRole while cluster-scoped resources force a ClusterRole;
