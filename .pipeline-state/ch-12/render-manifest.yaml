        a check fails; and the per-namespace label form with a worked example carrying
        all three modes at two different levels
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
