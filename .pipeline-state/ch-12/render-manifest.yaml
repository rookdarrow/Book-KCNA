      \                     │\n   │      └── token  ◀── mounted, rotated     │\n \
      \  └──────────┬───────────────────────────────┘\n              │\n         \
      \     │  API request, bearing the token\n              ▼\n   ┌──────────────────────┐\n\
      \   │  GATE 1              │      \"who are you?\"\n   │  AUTHENTICATION   \
      \   │      ✔ you are ns/my-app\n   └──────────┬───────────┘\n              │\n\
      \              ▼\n   ┌──────────────────────┐\n   │  GATE 2              │ \
      \     \"what may you do?\"\n   │  AUTHORIZATION       │\n   │              \
      \        │      ┌─────────────────────────┐\n   │      ...             │◀─────┤\
      \  nothing here yet.      │\n   │                      │      │  see §3.   \
