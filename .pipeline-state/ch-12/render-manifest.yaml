      \n   ┌─ CLOUD ──────────────────────────────────────────────┐\n   │  ┌─ CLUSTER\
      \ ─────────────────────────────────────┐   │\n   │  │  ┌─ CONTAINER ────────────────────────────┐\
      \   │   │\n   │  │  │  ┌─ CODE ──────────────────────────┐   │   │   │\n   │\
      \  │  │  │                                 │   │   │   │\n   │  │  │  └─────────────────────────────────┘\
      \   │   │   │\n   │  │  └────────────────────────────────────────┘   │   │\n\
      \   │  └───────────────────────────────────────────────┘   │\n   └──────────────────────────────────────────────────────┘\n\
      \n\n   FIVE CONTROLS, PLOTTED ON BOTH\n   ─────────────────────────────────────────────────────────────────\n\
      \n   control                    phase                layer\n   ──────────────────────────────────────────────────────────────\n\
      \   RBAC                       runtime / access     Cluster\n   ServiceAccount\
      \             runtime / access     Cluster\n   securityContext            runtime\
      \ / compute    Container\n   encryption at rest         runtime / storage  \
      \  Cloud → Cluster\n   image signing              distribute           Container\n"
