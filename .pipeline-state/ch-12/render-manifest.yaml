    anchor_id: ch12-fig04-pod-security-standards-levels
    diagram_type: other
    source_ascii: "   THE LEVELS — what gets checked\n   ══════════════════════════════════════════════════════════════════\n\
      \n   securityContext field          privileged   baseline    restricted\n  \
      \ ──────────────────────────────────────────────────────────────────\n   privileged:\
      \ true               allowed      ✗ forbidden ✗ forbidden\n   hostNetwork/hostPID/hostIPC\
      \    allowed      ✗ forbidden ✗ forbidden\n   hostPath volumes             \
      \  allowed      ✗ forbidden ✗ forbidden\n   hostPort                       allowed\
      \      restricted  restricted\n   capabilities.add               allowed   \
      \   known list  only\n                                                     \
      \      NET_BIND_SERVICE\n   capabilities.drop              —            —  \
      \         must include ALL\n   seccompProfile.type            allowed      not\
      \          RuntimeDefault\n                                               Unconfined\
      \   or Localhost\n   appArmorProfile.type           allowed      Runtime   \
      \   Runtime\n                                               Default or   Default\
      \ or\n                                               Localhost    Localhost\n\
      \   allowPrivilegeEscalation       allowed      —           must be false\n\
      \   runAsNonRoot                   —            —           must be true\n \
      \  runAsUser                      any          any         must be non-zero\n\
      \                                                           or unset\n   volume\
      \ types                   any          any         safe list only\n        \
      \                                                   (configMap, csi,\n     \
      \                                                      emptyDir, secret,\n \
      \                                                          projected, pvc, …)\n\
      \n   cumulative:  privileged  ⊃  baseline  ⊃  restricted\n                (restricted\
      \ includes every baseline requirement,\n                 plus the rows below\
      \ the line)\n\n\n   THE MODES — what happens when a check fails\n   ══════════════════════════════════════════════════════════════════\n\
      \n           enforce  ──▶  the Pod is REJECTED\n           audit    ──▶  recorded\
      \ in the audit log; the Pod runs\n           warn     ──▶  user-facing warning;\
      \ the Pod runs\n\n\n   APPLIED PER NAMESPACE, BY LABEL\n   ══════════════════════════════════════════════════════════════════\n\
      \n           pod-security.kubernetes.io/<MODE>: <LEVEL>\n\n   e.g.    pod-security.kubernetes.io/enforce:\
      \ baseline\n           pod-security.kubernetes.io/warn:    restricted\n    \
      \       pod-security.kubernetes.io/audit:   restricted\n\n           ▲ all three,\
      \ on one namespace, at two different levels.\n             This is not a contradiction.\
      \ It is a migration.\n"
    vendor_terms: []
    complexity_hint:
      node_count: 17
      edge_count: 4
      label_count: 60
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      - fixed_point
      learning_outcome: Read a namespace's Pod Security labels together with a Pod's
        securityContext and predict whether the Pod is admitted, warned about, or
        refused
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the two panel subtitles 'what gets checked' and
        'what happens when a check fails', accented as the level axis against the
        mode axis
    accessibility:
      alt_text_seed: A matrix of fourteen securityContext fields checked against the
        privileged, baseline and restricted Pod Security levels, noted as cumulative;
