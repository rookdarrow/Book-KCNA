<svg viewBox="0 0 800 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch13fig02-title ch13fig02-desc" width="900" height="1080">
    <title id="ch13fig02-title">Pod failure signature map</title>
    <desc id="ch13fig02-desc">A decision tree beginning with the question of whether the Pod object exists; the No branch leads to admission refusal, and the Yes branch asks how far start-up got, splitting into not scheduled yet, phase Pending, and scheduled to a node with containers Waiting, which fans out into the image-pull, configuration, and image-policy failure reasons.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- ================= CONNECTORS (drawn before nodes) ================= -->

    <!-- Root split: trunk (shared, no marker) -->
    <line x1="400" y1="152" x2="400" y2="200" stroke="#1F4A4E" stroke-width="1.2"></line>
    <!-- Root -> YES -> diamond2 (default, straight) -->
    <line x1="400" y1="200" x2="400" y2="260" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <!-- Root -> NO -> admission (focal, elbow) -->
    <path d="M 400 200 L 156 200 Q 148 200 148 208 L 148 248" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"></path>

    <!-- NO / YES labels -->
    <rect x="260" y="176" width="32" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="276" y="188" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NO</text>

    <rect x="408" y="220" width="40" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="428" y="232" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">YES</text>

    <!-- Diamond2 split: trunk -->
    <line x1="400" y1="356" x2="400" y2="408" stroke="#1F4A4E" stroke-width="1.2"></line>
    <!-- -> Scheduled to a node (straight continue) -->
    <line x1="400" y1="408" x2="400" y2="464" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <!-- -> Not scheduled yet (elbow) -->
    <path d="M 400 408 L 156 408 Q 148 408 148 416 L 148 464" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>

    <!-- Scheduled-node 3-way fan: trunk -->
    <line x1="400" y1="584" x2="400" y2="632" stroke="#1F4A4E" stroke-width="1.2"></line>
    <!-- -> CreateContainerConfigError (straight middle) -->
    <line x1="400" y1="632" x2="400" y2="680" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <!-- -> ErrImagePull group (elbow left) -->
    <path d="M 400 632 L 140 632 Q 132 632 132 640 L 132 680" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
    <!-- -> ImageInspectError group (elbow right) -->
    <path d="M 400 632 L 660 632 Q 668 632 668 640 L 668 680" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>

    <!-- ================= NODES ================= -->

    <!-- Root diamond (FOCAL) -->
    <polygon points="400,48 500,100 400,152 300,100" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></polygon>
    <text x="400" y="96" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Does the Pod</text>
    <text x="400" y="116" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">object exist?</text>

    <!-- NO -> Admission refused (FOCAL) -->
    <rect x="28" y="248" width="240" height="120" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="148" y="280" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Admission refused it.</text>
    <text x="148" y="300" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Read the CREATE error,</text>
    <text x="148" y="320" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">not the Pod.</text>
    <text x="148" y="344" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(Ch 12 §6)</text>

    <!-- Diamond2: How far did start-up get? -->
    <polygon points="400,260 500,308 400,356 300,308" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></polygon>
    <text x="400" y="304" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">How far did</text>
    <text x="400" y="324" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">start-up get?</text>

    <!-- Not scheduled yet (phase Pending) -->
    <rect x="28" y="464" width="240" height="120" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="148" y="496" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Not scheduled yet</text>
    <text x="148" y="516" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(phase Pending)</text>
    <text x="148" y="536" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Read: describe → Events</text>
    <text x="148" y="556" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">from the scheduler.</text>

    <!-- Scheduled to a node (containers Waiting) -->
    <rect x="284" y="464" width="232" height="120" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="400" y="496" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Scheduled to a node</text>
    <text x="400" y="516" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(containers Waiting)</text>
    <text x="400" y="536" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Can't start.</text>
    <text x="400" y="556" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Read: container Reason</text>

    <!-- ErrImagePull / ImagePullBackOff -->
    <rect x="16" y="680" width="232" height="136" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="132" y="708" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">ErrImagePull /</text>
    <text x="132" y="728" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">ImagePullBackOff</text>
    <text x="132" y="748" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Registry said no, or</text>
    <text x="132" y="768" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">was never asked properly.</text>
    <text x="132" y="796" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(Ch 2 §3, §6)</text>

    <!-- CreateContainerConfigError -->
    <rect x="264" y="680" width="272" height="136" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="400" y="728" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">CreateContainerConfigError</text>
    <text x="400" y="748" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Named ConfigMap or Secret</text>
    <text x="400" y="768" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">doesn't exist.</text>
    <text x="400" y="796" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(Ch 4 §4)</text>

    <!-- ImageInspectError / ErrImageNeverPull -->
    <rect x="552" y="680" width="232" height="136" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="668" y="708" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">ImageInspectError /</text>
    <text x="668" y="728" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">ErrImageNeverPull</text>
    <text x="668" y="748" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Image is broken, or policy</text>
    <text x="668" y="768" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">Never with no local image.</text>
    <text x="668" y="796" fill="#8A8D90" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">(Ch 2 §6)</text>

    <!-- ================= LEGEND ================= -->
    <line x1="40" y1="850" x2="760" y2="850" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="40" y="866" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.12em">LEGEND</text>

    <polygon points="52,884 64,878 76,884 64,890" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></polygon>
    <text x="88" y="888" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Decision</text>

    <rect x="216" y="878" width="24" height="12" rx="3" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="252" y="888" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">State / read instruction</text>

    <line x1="460" y1="884" x2="492" y2="884" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"></line>
    <text x="500" y="888" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Most consequential branch</text>
  </svg>