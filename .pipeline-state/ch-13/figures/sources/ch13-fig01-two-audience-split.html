<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform scope or application scope?</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #F5EFE4;
    --color-ink:     #0B1E3B;
    --color-muted:   #1F4A4E;
    --color-soft:    #8A8D90;
    --color-accent:  #B58B3E;
    --font-sans:  'Fira Sans', sans-serif;
    --font-slab:  'Roboto Slab', serif;
    --font-mono:  'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 640px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.75rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    color: var(--color-muted);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    max-width: 46ch;
  }
  svg { width: 100%; display: block; margin: 0 auto; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Concept Map &middot; Chapter 13</p>
    <h1>Platform Scope or Application Scope?</h1>
    <p class="subtitle">Decide which side of the line owns the failure before you spend time debugging either one.</p>

    <svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ch13-fig01-two-audience-split-title ch13-fig01-two-audience-split-desc">
      <title id="ch13-fig01-two-audience-split-title">Platform scope vs. application scope: which owns the bug</title>
      <desc id="ch13-fig01-two-audience-split-desc">Two stacked panels of diagnostic questions, platform scope on top and application scope below, joined by a single downward arrow labelled with the condition that the Pod is Running and Ready and the behavior is still wrong.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#B58B3E"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="680" height="900" fill="#F5EFE4"/>

      <!-- Panel: Platform Scope -->
      <rect x="48" y="48" width="584" height="312" rx="8"
            fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <text x="72" y="80" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em">
        <tspan fill="#1F4A4E" font-weight="600">PLATFORM SCOPE</tspan>
        <tspan fill="#8A8D90" font-weight="400">   &middot;   THIS CHAPTER</tspan>
      </text>

      <circle cx="72" cy="115" r="3" fill="#8A8D90"/>
      <text x="88" y="120" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Did the Pod get scheduled?</text>

      <circle cx="72" cy="159" r="3" fill="#8A8D90"/>
      <text x="88" y="164" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Did the image pull?</text>

      <circle cx="72" cy="203" r="3" fill="#8A8D90"/>
      <text x="88" y="208" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Did the container start?</text>

      <circle cx="72" cy="247" r="3" fill="#8A8D90"/>
      <text x="88" y="252" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is the node healthy?</text>

      <circle cx="72" cy="291" r="3" fill="#8A8D90"/>
      <text x="88" y="296" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Did something kill it?</text>

      <!-- Panel: Application Scope -->
      <rect x="48" y="540" width="584" height="312" rx="8"
            fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <text x="72" y="572" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.12em">
        <tspan fill="#1F4A4E" font-weight="600">APPLICATION SCOPE</tspan>
        <tspan fill="#8A8D90" font-weight="400">   &middot;   CHAPTER 16</tspan>
      </text>

      <circle cx="72" cy="607" r="3" fill="#8A8D90"/>
      <text x="88" y="612" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is the process doing the right thing?</text>

      <circle cx="72" cy="651" r="3" fill="#8A8D90"/>
      <text x="88" y="656" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is it reading the right config?</text>

      <circle cx="72" cy="695" r="3" fill="#8A8D90"/>
      <text x="88" y="700" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is it reaching its dependencies?</text>

      <circle cx="72" cy="739" r="3" fill="#8A8D90"/>
      <text x="88" y="744" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is it returning correct results?</text>

      <circle cx="72" cy="783" r="3" fill="#8A8D90"/>
      <text x="88" y="788" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">Is it selected by its Service?</text>

      <!-- Focal: the one-way handoff -->
      <line x1="340" y1="360" x2="340" y2="540" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

      <rect x="348" y="428" width="208" height="44" rx="2" fill="#F5EFE4"/>
      <text x="452" y="446" fill="#B58B3E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Running and Ready,</text>
      <text x="452" y="466" fill="#B58B3E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">and still wrong</text>
    </svg>
  </div>
</body>
</html>
