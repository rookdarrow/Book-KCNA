    diagram_type: flowchart
    source_ascii: "      OOMKilled                              Evicted\n      ─────────\
      \                              ───────\n\nContainer exceeds ITS OWN limit  \
      \      NODE runs low on a resource\n            │                          \
      \          │\n            ▼                                    ▼\nKernel cgroup\
      \ enforcement kills        kubelet chooses victims by\nthat one process    \
      \                   QoS class and terminates Pods\n            │           \
      \                         │\n            ▼                                 \
      \   ▼\nContainer state: Terminated            Pod phase: Failed\nReason: OOMKilled\
      \                      Reason: Evicted\n            │                      \
      \              │\n            ▼                                    ▼\nRestarted\
      \ IN PLACE on the              Pod is GONE from this node.\nsame node, per restartPolicy.\
      \          A controller creates a\nRestart count increments.              REPLACEMENT\
      \ elsewhere.\n            │                                    │\n         \
      \   ▼                                    ▼\nScope: ONE container           \
      \        Scope: THE WHOLE POD\nTrigger: this Pod's own limit          Trigger:\
      \ the node's pressure\n"
    vendor_terms:
    - kubelet
    complexity_hint:
      node_count: 10
      edge_count: 8
      label_count: 12
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      learning_outcome: Distinguish OOMKilled from Evicted by killer, scope, trigger,
        and outcome
      fixed_point_emphasis: true
      fixed_point_emphasis_target: 'the final row: Scope one container versus the
        whole Pod, Trigger own limit versus node pressure'
    accessibility:
      alt_text_seed: 'Two parallel vertical chains compared row by row: OOMKilled,
        where a container exceeds its own limit and the kernel kills it and the kubelet
        restarts it in place, against Evicted, where the node runs low on a resource
        and the kubelet terminates the whole Pod so a controller replaces it elsewhere'
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 960
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
