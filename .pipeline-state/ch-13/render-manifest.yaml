    source_ascii: "                Does the Pod object exist?\n                  \
      \        │\n          ┌───────────────┴───────────────┐\n          NO      \
      \                        YES\n          │                                │\n\
      Admission refused it.                 What's the phase?\nRead the CREATE error,\
      \                     │\nnot the Pod.                    ┌──────────┴──────────┐\n\
      (Ch 12 §6)                   Pending                Running\n              \
      \                  │                  (containers Waiting)\n               \
      \       Not scheduled yet.                 │\n                      Read: describe\
      \ → Events    Scheduled; can't start.\n                      from the scheduler.\
      \        Read: container Reason\n                                          \
      \              │\n                          ┌─────────────────────────────┼────────────────────┐\n\
      \                 ErrImagePull /                CreateContainerConfigError \
      \   ImageInspectError /\n                 ImagePullBackOff                 \
      \       │                   ErrImageNeverPull\n                          │ \
      \                   Named ConfigMap or Secret            │\n               \
      \ Registry said no, or               doesn't exist.            Image is broken,\
      \ or\n                was never asked properly.          (Ch 4 §4)         \
      \        policy Never with no\n                (Ch 2 §3, §6)               \
      \                                 local image. (Ch 2 §6)\n"
    vendor_terms:
