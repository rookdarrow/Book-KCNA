  diagram_type: flowchart
  figure_spec:
    anchor_id: ch13-fig03-phase-before-logs-flow
    diagram_type: flowchart
    source_ascii: "  SCOPE      kubectl config current-context      Right cluster?\
      \ Right namespace?\n    │\n    ▼\n  PHASE      kubectl get pods            \
      \        Pending? Running? Restarts > 0?\n    │        kubectl get pod <name>\
      \ -o wide      Which node? Which IP?\n    ▼\nCONDITIONS   kubectl describe pod\
      \ <name>         Container state + Reason.\n    │        kubectl describe node\
      \ <node>        Node conditions, if suspect.\n    ▼\n  EVENTS     kubectl events\
      \ --for pod/<name>     What did the components SAY?\n    │        kubectl get\
      \ events --sort-by=...    Chronology, when object unknown.\n    ▼\n   LOGS \
      \     kubectl logs <name> -c <container>  Only meaningful once you know\n  \
      \           kubectl logs <name> --previous      the container actually ran.\n"
    vendor_terms:
    - kubectl
    complexity_hint:
      node_count: 5
      edge_count: 4
      label_count: 15
    pedagogy:
      part_18_criteria_met:
      - temporal_structure
      - spatial_structure
      learning_outcome: Run the triage commands in the order that narrows the problem,
        with logs last
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the LOGS stage in final position, with its 'only
        meaningful once you know the container ran' caption
    accessibility:
      alt_text_seed: A five-stage vertical sequence — scope, phase, conditions, events,
        logs — each stage listing its kubectl commands and the question those commands
        answer, with logs in the final position
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
