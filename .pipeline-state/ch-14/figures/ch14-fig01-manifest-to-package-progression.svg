<svg viewBox="0 0 800 1056" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14fig01-title ch14fig01-desc" width="640" height="845">
      <title id="ch14fig01-title">From duplicated manifests to a versioned package</title>
      <desc id="ch14fig01-desc">Three-panel comparison: a single manifests directory deploying to one cluster is correct; three near-identical manifests directories for dev, staging, and production are ninety-five percent identical with nothing marking the difference, labeled as where most teams live; the fix is one versioned package plus three per-environment value files fanning out to three clusters.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
      </defs>

      <rect width="800" height="1056" fill="#F5EFE4"></rect>

      <!-- ===================== PANEL 1 — ONE CLUSTER ===================== -->
      <rect x="40" y="20" width="720" height="280" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <text x="64" y="44" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">ONE CLUSTER</text>

      <!-- arrow: folder -> cluster -->
      <line x1="400" y1="168" x2="400" y2="200" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>

      <!-- folder: manifests/ -->
      <rect x="300" y="64" width="200" height="104" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="400" y="88" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">manifests/</text>
      <text x="400" y="108" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">deployment.yaml</text>
      <text x="400" y="128" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">service.yaml</text>
      <text x="400" y="148" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">configmap.yaml</text>

      <!-- cluster -->
      <rect x="344" y="200" width="112" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="400" y="233" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">cluster</text>

      <!-- caption -->
      <text x="400" y="284" text-anchor="middle" fill="#1F4A4E" font-style="italic" font-size="16" font-family="'Fira Sans', sans-serif">Correct. Keep doing this.</text>

      <!-- ===================== PANEL 2 — THREE CLUSTERS (focal) ===================== -->
      <rect x="40" y="324" width="720" height="328" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <text x="64" y="348" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">THREE CLUSTERS</text>

      <!-- brace: three near-duplicate folders merge to one point -->
      <path d="M176,468 V484 Q176,492 184,492 H400" fill="none" stroke="#B58B3E" stroke-width="1.2"></path>
      <path d="M624,468 V484 Q624,492 616,492 H400" fill="none" stroke="#B58B3E" stroke-width="1.2"></path>
      <line x1="400" y1="468" x2="400" y2="524" stroke="#B58B3E" stroke-width="1.2"></line>
      <circle cx="400" cy="524" r="2" fill="#B58B3E"></circle>

      <!-- folder: manifests-dev/ -->
      <rect x="76" y="364" width="200" height="104" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="176" y="388" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">manifests-dev/</text>
      <text x="176" y="408" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">deployment.yaml</text>
      <text x="176" y="428" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">service.yaml</text>
      <text x="176" y="448" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">configmap.yaml</text>

      <!-- folder: manifests-staging/ -->
      <rect x="300" y="364" width="200" height="104" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="400" y="388" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">manifests-staging/</text>
      <text x="400" y="408" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">deployment.yaml</text>
      <text x="400" y="428" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">service.yaml</text>
      <text x="400" y="448" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">configmap.yaml</text>

      <!-- folder: manifests-prod/ -->
      <rect x="524" y="364" width="200" height="104" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="624" y="388" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">manifests-prod/</text>
      <text x="624" y="408" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">deployment.yaml</text>
      <text x="624" y="428" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">service.yaml</text>
      <text x="624" y="448" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">configmap.yaml</text>

      <!-- brace callout labels -->
      <rect x="316" y="530" width="168" height="20" fill="#F5EFE4"></rect>
      <text x="400" y="544" text-anchor="middle" fill="#B58B3E" font-weight="700" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.08em">95% IDENTICAL</text>
      <rect x="288" y="554" width="224" height="18" fill="#F5EFE4"></rect>
      <text x="400" y="568" text-anchor="middle" fill="#1F4A4E" font-style="italic" font-size="14" font-family="'Fira Sans', sans-serif">and nothing marks the 5%</text>

      <!-- focal band -->
      <rect x="64" y="590" width="672" height="44" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="400" y="620" text-anchor="middle" fill="#B58B3E" font-weight="600" font-size="16" font-family="'Fira Sans', sans-serif" letter-spacing="0.04em">THIS IS WHERE MOST TEAMS LIVE</text>

      <!-- ===================== PANEL 3 — WHAT YOU WANT ===================== -->
      <rect x="40" y="676" width="720" height="312" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <text x="64" y="700" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">WHAT YOU WANT</text>

      <!-- fan-out arrows: package -> dev/stg/prd clusters -->
      <path d="M340,840 V868 Q340,876 332,876 H184 Q176,876 176,884 V916" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <line x1="400" y1="840" x2="400" y2="916" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <path d="M460,840 V868 Q460,876 468,876 H616 Q624,876 624,884 V916" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>

      <!-- package -->
      <rect x="280" y="716" width="240" height="124" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="400" y="740" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">package v1.2.0</text>
      <text x="400" y="760" text-anchor="middle" fill="#1F4A4E" font-style="italic" font-size="14" font-family="'Fira Sans', sans-serif">(one copy, versioned)</text>
      <text x="400" y="780" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">+ dev-values</text>
      <text x="400" y="800" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">+ staging-values</text>
      <text x="400" y="820" text-anchor="middle" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace">+ prod-values</text>

      <!-- clusters: dev / stg / prd -->
      <rect x="120" y="916" width="112" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="176" y="949" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">dev</text>

      <rect x="344" y="916" width="112" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="400" y="949" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">stg</text>

      <rect x="568" y="916" width="112" height="56" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="624" y="949" text-anchor="middle" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif">prd</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="1004" x2="760" y2="1004" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="40" y="1035" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="1024" width="14" height="14" rx="4" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="162" y="1035" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.06em">CONFIG FILES</text>

      <rect x="380" y="1024" width="14" height="14" rx="4" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="402" y="1035" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.06em">K8S CLUSTER</text>

      <rect x="600" y="1024" width="14" height="14" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="622" y="1035" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.06em">DUPLICATION RISK</text>
    </svg>