<svg viewBox="0 0 720 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-fig05-templating-vs-overlay-decision-title ch14-fig05-templating-vs-overlay-decision-desc" width="720" height="676">
    <title id="ch14-fig05-templating-vs-overlay-decision-title">Helm vs. Kustomize: templating vs. overlay decision</title>
    <desc id="ch14-fig05-templating-vs-overlay-decision-desc">Comparison table of Helm and Kustomize across five rows — what varies, the unit, distribution, lifecycle, and where the engine lives — closing with a decision band stating that distributing to strangers who will not read it points to Helm, while adapting what you already have for yourself points to Kustomize.</desc>
    <defs>
      <marker id="ch14fig05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
    </defs>

    <rect width="720" height="676" fill="#F5EFE4"></rect>

    <!-- ===== table backgrounds ===== -->
    <rect x="24" y="80" width="672" height="384" fill="rgba(11,30,59,0.03)"></rect>
    <rect x="24" y="24" width="672" height="56" fill="#0B1E3B"></rect>

    <!-- ===== column dividers ===== -->
    <line x1="192" y1="24" x2="192" y2="80" stroke="rgba(245,239,228,0.25)" stroke-width="1"></line>
    <line x1="444" y1="24" x2="444" y2="80" stroke="rgba(245,239,228,0.25)" stroke-width="1"></line>
    <line x1="192" y1="80" x2="192" y2="464" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
    <line x1="444" y1="80" x2="444" y2="464" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>

    <!-- ===== row dividers ===== -->
    <line x1="24" y1="152" x2="696" y2="152" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
    <line x1="24" y1="224" x2="696" y2="224" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
    <line x1="24" y1="296" x2="696" y2="296" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
    <line x1="24" y1="392" x2="696" y2="392" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>

    <!-- ===== outer border ===== -->
    <rect x="24" y="24" width="672" height="440" fill="none" stroke="#0B1E3B" stroke-width="1.2"></rect>

    <!-- ===== header row text ===== -->
    <text x="40" y="57" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="rgba(245,239,228,0.6)">CRITERIA</text>
    <text x="318" y="59" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="600" letter-spacing="0.04em" fill="#F5EFE4">HELM</text>
    <text x="570" y="59" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="20" font-weight="600" letter-spacing="0.04em" fill="#F5EFE4">KUSTOMIZE</text>

    <!-- ===== row 1 — What varies ===== -->
    <text x="40" y="122" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">What varies</text>
    <text x="212" y="110" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">values, filling holes</text>
    <text x="212" y="134" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">in templates</text>
    <text x="464" y="110" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">patches, applied to a</text>
    <text x="464" y="134" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">complete base</text>

    <!-- ===== row 2 — The unit ===== -->
    <text x="40" y="194" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">The unit</text>
    <text x="212" y="182" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">a versioned chart</text>
    <text x="212" y="206" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">(version <tspan font-weight="700">REQUIRED</tspan>)</text>
    <text x="464" y="182" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">a directory. no version</text>
    <text x="464" y="206" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">(nothing requires one)</text>

    <!-- ===== row 3 — Distribution ===== -->
    <text x="40" y="266" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Distribution</text>
    <text x="212" y="254" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">chart repository, or</text>
    <text x="212" y="278" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">an OCI registry</text>
    <text x="464" y="266" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">none. it's your repo.</text>

    <!-- ===== row 4 — Lifecycle ===== -->
    <text x="40" y="350" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Lifecycle</text>
    <text x="212" y="314" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">releases and revisions;</text>
    <text x="212" y="338" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">install/upgrade/rollback</text>
    <text x="212" y="362" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">as single acts</text>
    <text x="464" y="314" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">none. apply is apply.</text>
    <text x="464" y="338" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">no installed-state</text>
    <text x="464" y="362" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">record of its own</text>

    <!-- ===== row 5 — Where the engine lives ===== -->
    <text x="40" y="422" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Where the engine</text>
    <text x="40" y="446" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">lives</text>
    <text x="212" y="434" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">a CLI you install</text>
    <text x="464" y="422" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">in <tspan font-family="'Fira Mono', monospace">kubectl</tspan>. <tspan font-family="'Fira Mono', monospace">apply -k</tspan></text>
    <text x="464" y="446" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">Nothing to install.</text>

    <!-- ===== decision band ===== -->
    <rect x="24" y="496" width="672" height="156" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="48" y="532" font-family="'Fira Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.12em" fill="#0B1E3B">WHAT THE CHOICE ACTUALLY TURNS ON:</text>

    <line x1="420" y1="570" x2="520" y2="570" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#ch14fig05-arrow-accent)"></line>
    <text x="48" y="576" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">Distributing to strangers who won't read it</text>
    <rect x="524" y="556" width="88" height="28" rx="4" fill="rgba(181,139,62,0.22)" stroke="#B58B3E" stroke-width="1"></rect>
    <text x="568" y="575" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">HELM</text>

    <line x1="420" y1="618" x2="520" y2="618" stroke="#B58B3E" stroke-width="1.6" marker-end="url(#ch14fig05-arrow-accent)"></line>
    <text x="48" y="624" font-family="'Fira Sans', sans-serif" font-size="16" fill="#0B1E3B">Adapting what you already have, for yourself</text>
    <rect x="524" y="604" width="132" height="28" rx="4" fill="rgba(181,139,62,0.22)" stroke="#B58B3E" stroke-width="1"></rect>
    <text x="590" y="623" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">KUSTOMIZE</text>
  </svg>