<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy of a Helm Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #F5EFE4;
    --color-ink:    #0B1E3B;
    --color-muted:  #1F4A4E;
    --color-soft:   #8A8D90;
    --color-accent: #B58B3E;
    --font-display: 'Roboto Slab', serif;
    --font-sans:    'Fira Sans', sans-serif;
    --font-mono:    'Fira Mono', monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 640px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hierarchy Tree &middot; Ch.14 Fig.02</p>
    <h1>Anatomy of a Helm Chart</h1>

    <svg viewBox="0 0 820 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-fig02-helm-chart-anatomy-title ch14-fig02-helm-chart-anatomy-desc">
      <title id="ch14-fig02-helm-chart-anatomy-title">Anatomy of a Helm chart</title>
      <desc id="ch14-fig02-helm-chart-anatomy-desc">Directory tree of a Helm chart named wordpress, with Chart.yaml, values.yaml, templates, charts and crds each annotated with its purpose; the charts directory is marked emphatically as not a repository but a directory inside the chart holding its dependencies.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      </defs>

      <rect width="820" height="920" fill="#F5EFE4"/>

      <!-- ===== connectors (drawn before text) ===== -->

      <!-- main trunk -->
      <line x1="64" y1="80" x2="64" y2="800" stroke="#1F4A4E" stroke-width="1"/>

      <!-- Row A: Chart.yaml -->
      <line x1="64" y1="120" x2="88" y2="120" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="260" y1="120" x2="296" y2="120" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Row B: values.yaml -->
      <line x1="64" y1="208" x2="88" y2="208" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="260" y1="208" x2="296" y2="208" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Row C: templates/ -->
      <line x1="64" y1="296" x2="88" y2="296" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="260" y1="296" x2="296" y2="296" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- templates/ contents: secondary spine -->
      <line x1="88" y1="368" x2="88" y2="496" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="88" y1="376" x2="112" y2="376" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="88" y1="416" x2="112" y2="416" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="88" y1="456" x2="112" y2="456" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="88" y1="496" x2="112" y2="496" stroke="#1F4A4E" stroke-width="1"/>

      <!-- Row D: charts/ (focal) -->
      <line x1="64" y1="536" x2="88" y2="536" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="260" y1="536" x2="296" y2="536" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Row E: crds/ -->
      <line x1="64" y1="672" x2="88" y2="672" stroke="#1F4A4E" stroke-width="1"/>
      <line x1="260" y1="672" x2="296" y2="672" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Row F: LICENSE -->
      <line x1="64" y1="760" x2="88" y2="760" stroke="#1F4A4E" stroke-width="1"/>

      <!-- Row G: README.md (trunk terminus) -->
      <line x1="64" y1="800" x2="88" y2="800" stroke="#1F4A4E" stroke-width="1"/>

      <!-- ===== focal badge (drawn before its own text, after connectors) ===== -->
      <rect x="304" y="560" width="200" height="32" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"/>

      <!-- ===== labels ===== -->

      <text x="40" y="56" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="20" font-weight="500">wordpress/</text>

      <!-- Row A -->
      <text x="96" y="128" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">Chart.yaml</text>
      <text x="308" y="128" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">WHO THIS CHART IS.</text>
      <text x="308" y="152" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">Name, version, description. Every chart</text>
      <text x="308" y="176" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">must have this file.</text>

      <!-- Row B -->
      <text x="96" y="216" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">values.yaml</text>
      <text x="308" y="216" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">THE KNOBS, AND THEIR DEFAULTS.</text>
      <text x="308" y="240" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">Everything the installer is allowed to change,</text>
      <text x="308" y="264" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">with a working value for each.</text>

      <!-- Row C -->
      <text x="96" y="304" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">templates/</text>
      <text x="308" y="304" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">WHAT GETS CREATED.</text>
      <text x="308" y="328" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">Combined with values, generates valid</text>
      <text x="308" y="352" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">Kubernetes manifests.</text>

      <!-- templates/ contents -->
      <text x="120" y="384" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">deployment.yaml</text>
      <text x="120" y="424" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">service.yaml</text>
      <text x="120" y="464" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">NOTES.txt</text>
      <text x="280" y="464" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="14">usage notes printed on install</text>
      <text x="120" y="504" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">_helpers.tpl</text>
      <text x="280" y="504" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="14">partials, not manifests</text>

      <!-- Row D: charts/ (focal) -->
      <text x="96" y="544" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">charts/</text>
      <text x="308" y="544" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">CHARTS THIS CHART DEPENDS ON.</text>
      <text x="316" y="584" fill="#B58B3E" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.02em">NOT A REPOSITORY.</text>
      <text x="308" y="616" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">A directory, inside this chart, holding</text>
      <text x="308" y="640" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">other charts. See &#167;4 for repositories.</text>

      <!-- Row E -->
      <text x="96" y="680" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">crds/</text>
      <text x="308" y="680" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">DEFINITIONS THAT MUST EXIST FIRST.</text>
      <text x="308" y="704" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">Not templated. Installed before the</text>
      <text x="308" y="728" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">templates render. See &#167;6 for why.</text>

      <!-- Row F -->
      <text x="96" y="768" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">LICENSE</text>
      <text x="220" y="768" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="14">optional</text>

      <!-- Row G -->
      <text x="96" y="808" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">README.md</text>
      <text x="220" y="808" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="14">optional</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="840" x2="780" y2="840" stroke="rgba(11,30,59,0.15)" stroke-width="0.8"/>
      <text x="40" y="864" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">LEGEND</text>

      <line x1="140" y1="860" x2="172" y2="860" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="180" y="864" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">ENTRY &#8594; PURPOSE</text>

      <rect x="380" y="852" width="24" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"/>
      <text x="412" y="864" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">CRITICAL DISTINCTION</text>

      <circle cx="608" cy="860" r="3" fill="#8A8D90"/>
      <text x="620" y="864" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">OPTIONAL DETAIL</text>
    </svg>
  </div>
</body>
</html>
