<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart, release, and revision — ch14-fig03</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-soft:   #8A8D90;
      --color-accent: #B58B3E;
      --font-sans:  'Fira Sans', system-ui, sans-serif;
      --font-serif: 'Roboto Slab', serif;
      --font-mono:  'Fira Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 560px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hierarchy tree · Ch.14 Fig.03</p>
    <h1>Chart &rarr; Release &rarr; Revision</h1>

    <svg viewBox="0 0 680 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-fig03-title ch14-fig03-desc">
      <title id="ch14-fig03-title">Helm chart, release, and revision hierarchy</title>
      <desc id="ch14-fig03-desc">One Helm chart installs twice, producing two independent releases named marketing and docs in separate namespaces with different replica counts; the marketing release has a numbered chain of four revisions, and a rollback arrow returns from revision four to revision two.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ============ CONNECTORS (drawn before nodes) ============ -->

      <!-- Focal: chart fans into two divergent "helm install" arrows -->
      <path d="M 340 128 L 340 156" fill="none" stroke="#B58B3E" stroke-width="1.2"/>
      <path d="M 190 156 L 490 156" fill="none" stroke="#B58B3E" stroke-width="1.2"/>
      <path d="M 190 156 L 190 212" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 490 156 L 490 212" fill="none" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="60" y="172" width="120" height="24" fill="#F5EFE4"/>
      <text x="120" y="188" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HELM INSTALL</text>

      <rect x="500" y="172" width="120" height="24" fill="#F5EFE4"/>
      <text x="560" y="188" fill="#B58B3E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HELM INSTALL</text>

      <!-- Marketing release into its revision chain -->
      <path d="M 190 316 L 190 356" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 190 416 L 190 456" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 190 516 L 190 556" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 190 616 L 190 656" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Rollback: revision 4 back to revision 2 -->
      <path d="M 280 686 L 312 686 A 8 8 0 0 0 320 678 L 320 494 A 8 8 0 0 0 312 486 L 280 486"
            fill="none" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="328" y="574" width="96" height="24" fill="#F5EFE4"/>
      <text x="376" y="590" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ROLLBACK</text>

      <!-- ============ NODES ============ -->

      <!-- CHART -->
      <rect x="200" y="40" width="280" height="88" rx="6" fill="#F5EFE4"/>
      <rect x="200" y="40" width="280" height="88" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="212" y="48" width="60" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="242" y="62" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHART</text>
      <text x="340" y="90" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">wordpress 15.2.0</text>
      <text x="340" y="112" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">on the shelf &#8212; installed zero times so far</text>

      <!-- RELEASE: marketing -->
      <rect x="60" y="212" width="260" height="104" rx="6" fill="#F5EFE4"/>
      <rect x="60" y="212" width="260" height="104" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="72" y="220" width="88" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="116" y="234" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>
      <text x="190" y="260" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">"marketing"</text>
      <text x="190" y="282" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">namespace: marketing</text>
      <text x="190" y="300" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">values: 12 replicas</text>

      <!-- RELEASE: docs -->
      <rect x="360" y="212" width="260" height="104" rx="6" fill="#F5EFE4"/>
      <rect x="360" y="212" width="260" height="104" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <rect x="372" y="220" width="88" height="20" rx="2" fill="transparent" stroke="rgba(11,30,59,0.40)" stroke-width="0.8"/>
      <text x="416" y="234" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>
      <text x="490" y="260" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">"docs"</text>
      <text x="490" y="282" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">namespace: docs</text>
      <text x="490" y="300" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">values: 2 replicas</text>

      <!-- Docs editorial aside -->
      <text x="490" y="340" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">its own history,</text>
      <text x="490" y="360" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">untouched by anything</text>
      <text x="490" y="380" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">done to marketing</text>

      <!-- REV 1 -->
      <rect x="100" y="356" width="180" height="60" rx="6" fill="#F5EFE4"/>
      <rect x="100" y="356" width="180" height="60" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="190" y="382" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">REV 1</text>
      <text x="190" y="402" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">install</text>

      <!-- REV 2 -->
      <rect x="100" y="456" width="180" height="60" rx="6" fill="#F5EFE4"/>
      <rect x="100" y="456" width="180" height="60" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="190" y="482" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">REV 2</text>
      <text x="190" y="502" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">upgrade</text>

      <!-- REV 3 -->
      <rect x="100" y="556" width="180" height="60" rx="6" fill="#F5EFE4"/>
      <rect x="100" y="556" width="180" height="60" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="190" y="582" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">REV 3</text>
      <text x="190" y="602" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">upgrade</text>

      <!-- REV 4 (outcome not yet known — dashed) -->
      <rect x="100" y="656" width="180" height="60" rx="6" fill="#F5EFE4"/>
      <rect x="100" y="656" width="180" height="60" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="190" y="682" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">REV 4</text>
      <text x="190" y="702" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">???</text>

      <!-- Rollback caption -->
      <text x="328" y="612" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace" text-anchor="start">helm rollback marketing 2</text>
      <text x="328" y="634" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="start">returns the release to</text>
      <text x="328" y="654" fill="#8A8D90" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="start">revision 2's state</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="740" x2="640" y2="740" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="40" y="756" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="40" y1="778" x2="60" y2="778" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="68" y="782" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Helm install (focal)</text>

      <rect x="360" y="772" width="20" height="12" rx="2" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"/>
      <text x="388" y="782" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Chart / release / revision</text>

      <rect x="40" y="796" width="20" height="12" rx="2" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="68" y="806" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Outcome not yet recorded</text>

      <line x1="360" y1="802" x2="380" y2="802" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="388" y="806" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="start">Rollback (return)</text>
    </svg>
  </div>
</body>
</html>
