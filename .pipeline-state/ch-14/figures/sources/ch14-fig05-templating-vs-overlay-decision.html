<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helm vs. Kustomize: What the Choice Turns On</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:       #F5EFE4;
    --color-ink:         #0B1E3B;
    --color-muted:       #1F4A4E;
    --color-soft:        #8A8D90;
    --color-accent:      #B58B3E;
    --color-accent-tint: rgba(181,139,62,0.10);
    --font-sans:  'Fira Sans', sans-serif;
    --font-serif: 'Roboto Slab', serif;
    --font-mono:  'Fira Mono', monospace;
  }

  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 640px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.35rem, 1.6vw + 0.9rem, 1.75rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }

  svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Configuration Management &middot; Comparison</p>
  <h1>Helm vs. Kustomize: What the Choice Turns On</h1>

  <svg viewBox="0 0 680 716" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ch14-fig05-title ch14-fig05-desc">
    <title id="ch14-fig05-title">Helm vs. Kustomize: what the choice turns on</title>
    <desc id="ch14-fig05-desc">Comparison table of Helm and Kustomize across five rows — what varies, the unit, distribution, lifecycle, and where the engine lives — closing with a decision band stating that distributing to strangers who will not read it points to Helm, while adapting what you already have for yourself points to Kustomize</desc>

    <defs>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
      </marker>
      <clipPath id="table-clip">
        <rect x="24" y="32" width="632" height="440" rx="8"/>
      </clipPath>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"/>

    <!-- ============ TABLE ============ -->
    <g clip-path="url(#table-clip)">
      <rect x="24" y="32" width="632" height="440" fill="#F5EFE4"/>

      <!-- header banners -->
      <rect x="176" y="32" width="240" height="56" fill="#0B1E3B"/>
      <rect x="416" y="32" width="240" height="56" fill="#0B1E3B"/>

      <!-- row-label column tint -->
      <rect x="24" y="88" width="152" height="384" fill="rgba(11,30,59,0.03)"/>

      <!-- header / body divider -->
      <line x1="24" y1="88" x2="656" y2="88" stroke="rgba(11,30,59,0.20)" stroke-width="1"/>

      <!-- row dividers -->
      <line x1="24" y1="160" x2="656" y2="160" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="232" x2="656" y2="232" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="304" x2="656" y2="304" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="400" x2="656" y2="400" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <!-- column dividers -->
      <line x1="176" y1="32" x2="176" y2="472" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <line x1="416" y1="32" x2="416" y2="472" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    </g>
    <rect x="24" y="32" width="632" height="440" rx="8" fill="none" stroke="rgba(11,30,59,0.15)" stroke-width="1"/>

    <!-- header text -->
    <text x="100" y="65" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace"
          font-size="14" font-weight="500" letter-spacing="0.12em">CRITERIA</text>
    <text x="296" y="65" text-anchor="middle" fill="#F5EFE4" font-family="'Fira Sans', sans-serif"
          font-size="16" font-weight="700" letter-spacing="0.04em">HELM</text>
    <text x="536" y="65" text-anchor="middle" fill="#F5EFE4" font-family="'Fira Sans', sans-serif"
          font-size="16" font-weight="700" letter-spacing="0.04em">KUSTOMIZE</text>

    <!-- Row 0 — What varies -->
    <text x="40" y="129" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">What varies</text>
    <text x="192" y="119" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="192" y="119">values, filling holes</tspan>
      <tspan x="192" y="139">in templates</tspan>
    </text>
    <text x="432" y="119" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="432" y="119">patches, applied to a</tspan>
      <tspan x="432" y="139">complete base</tspan>
    </text>

    <!-- Row 1 — The unit -->
    <text x="40" y="201" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">The unit</text>
    <text x="192" y="191" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="192" y="191">a versioned chart</tspan>
      <tspan x="192" y="211">(version REQUIRED)</tspan>
    </text>
    <text x="432" y="191" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="432" y="191">a directory. no version</tspan>
      <tspan x="432" y="211">(nothing requires one)</tspan>
    </text>

    <!-- Row 2 — Distribution -->
    <text x="40" y="273" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">Distribution</text>
    <text x="192" y="263" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="192" y="263">chart repository, or an</tspan>
      <tspan x="192" y="283">OCI registry</tspan>
    </text>
    <text x="432" y="273" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">none. it's your repo.</text>

    <!-- Row 3 — Lifecycle -->
    <text x="40" y="357" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">Lifecycle</text>
    <text x="192" y="337" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="192" y="337">releases and revisions;</tspan>
      <tspan x="192" y="357">install/upgrade/rollback</tspan>
      <tspan x="192" y="377">as single acts</tspan>
    </text>
    <text x="432" y="337" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="432" y="337">none. apply is apply.</tspan>
      <tspan x="432" y="357">no installed-state</tspan>
      <tspan x="432" y="377">record of its own</tspan>
    </text>

    <!-- Row 4 — Where the engine lives -->
    <text x="40" y="431" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">
      <tspan x="40" y="431">Where the</tspan>
      <tspan x="40" y="451">engine lives</tspan>
    </text>
    <text x="192" y="441" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">a CLI you install</text>
    <text x="432" y="431" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">
      <tspan x="432" y="431">in kubectl. <tspan font-family="'Fira Mono', monospace">`apply -k`</tspan></tspan>
      <tspan x="432" y="451">Nothing to install.</tspan>
    </text>

    <!-- ============ DECISION BAND ============ -->
    <rect x="24" y="504" width="632" height="180" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>

    <text x="44" y="536" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14"
          font-weight="500" letter-spacing="0.10em">WHAT THE CHOICE ACTUALLY TURNS ON:</text>

    <!-- decision row 1 -> HELM -->
    <text x="44" y="587" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">Distributing to strangers who won't read it</text>
    <line x1="452" y1="582" x2="516" y2="582" stroke="#B58B3E" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
    <rect x="524" y="564" width="112" height="36" rx="6" fill="#F5EFE4" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="580" y="587" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif"
          font-size="16" font-weight="700" letter-spacing="0.02em">HELM</text>

    <!-- decision row 2 -> KUSTOMIZE -->
    <text x="44" y="647" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="14">Adapting what you already have, for yourself</text>
    <line x1="452" y1="642" x2="516" y2="642" stroke="#B58B3E" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
    <rect x="524" y="624" width="112" height="36" rx="6" fill="#F5EFE4" stroke="#B58B3E" stroke-width="1.2"/>
    <text x="580" y="647" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif"
          font-size="16" font-weight="700" letter-spacing="0.02em">KUSTOMIZE</text>

  </svg>
</div>
</body>
</html>
