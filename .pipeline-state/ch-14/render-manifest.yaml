    diagram_type: other
    source_ascii: "  ┌────────────────────┬──────────────────────────┬──────────────────────────┐\n\
      \  │                    │  HELM                    │  KUSTOMIZE            \
      \   │\n  ├────────────────────┼──────────────────────────┼──────────────────────────┤\n\
      \  │ What varies        │  values, filling holes   │  patches, applied to a\
      \   │\n  │                    │  in templates            │  complete base  \
      \         │\n  ├────────────────────┼──────────────────────────┼──────────────────────────┤\n\
      \  │ The unit           │  a versioned chart       │  a directory. no version\
      \ │\n  │                    │  (version REQUIRED)      │  (nothing requires\
      \ one)  │\n  ├────────────────────┼──────────────────────────┼──────────────────────────┤\n\
      \  │ Distribution       │  chart repository, or    │  none. it's your repo.\
      \   │\n  │                    │  an OCI registry         │                 \
      \         │\n  ├────────────────────┼──────────────────────────┼──────────────────────────┤\n\
      \  │ Lifecycle          │  releases and revisions; │  none. apply is apply.\
      \   │\n  │                    │  install/upgrade/rollback│  no installed-state\
      \      │\n  │                    │  as single acts          │  record of its\
      \ own       │\n  ├────────────────────┼──────────────────────────┼──────────────────────────┤\n\
      \  │ Where the engine   │  a CLI you install       │  in kubectl. `apply -k`\
      \  │\n  │ lives              │                          │  Nothing to install.\
      \     │\n  ├────────────────────┴──────────────────────────┴──────────────────────────┤\n\
      \  │  WHAT THE CHOICE ACTUALLY TURNS ON:                                   \
      \   │\n  │  Distributing to strangers who won't read it  ─────────────►  HELM\
      \       │\n  │  Adapting what you already have, for yourself ─────────────►\
      \  KUSTOMIZE  │\n  └──────────────────────────────────────────────────────────────────────────┘\n"
