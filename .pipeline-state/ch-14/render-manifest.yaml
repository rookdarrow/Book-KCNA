  figure_spec:
    anchor_id: ch14-fig02-helm-chart-anatomy
    diagram_type: hierarchy_tree
    source_ascii: "  wordpress/\n  │\n  ├── Chart.yaml ─────────► WHO THIS CHART IS.\n\
      \  │                         Name, version, description. Every chart\n  │  \
      \                       must have this file.\n  │\n  ├── values.yaml ────────►\
      \ THE KNOBS, AND THEIR DEFAULTS.\n  │                         Everything the\
      \ installer is allowed to\n  │                         change, with a working\
      \ value for each.\n  │\n  ├── templates/ ─────────► WHAT GETS CREATED.\n  │\
      \                         Combined with values, generates valid\n  │       \
      \                  Kubernetes manifests.\n  │     ├── deployment.yaml\n  │ \
      \    ├── service.yaml\n  │     ├── NOTES.txt          (grey: usage notes printed\
      \ on install)\n  │     └── _helpers.tpl       (grey: partials, not manifests)\n\
      \  │\n  ├── charts/ ────────────► CHARTS THIS CHART DEPENDS ON.\n  │       \
      \                  *** NOT A REPOSITORY. ***\n  │                         A\
      \ directory, inside this chart, holding\n  │                         other charts.\
      \ See §4 for repositories.\n  │\n  ├── crds/ ──────────────► DEFINITIONS THAT\
      \ MUST EXIST FIRST.\n  │                         Not templated. Installed before\
      \ the\n  │                         templates render. See §6 for why.\n  │\n\
      \  ├── LICENSE                  (grey: optional)\n  └── README.md          \
      \      (grey: optional)\n"
    vendor_terms:
    - helm
    - wordpress
    complexity_hint:
      node_count: 12
      edge_count: 16
      label_count: 17
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - vendor_taxonomy
      - fixed_point
      learning_outcome: Read a Helm chart's directory layout and say what each entry
        is for, and distinguish the in-chart charts/ directory from a chart repository
      fixed_point_emphasis: true
      fixed_point_emphasis_target: The 'NOT A REPOSITORY.' line annotating the charts/
        directory
    accessibility:
      alt_text_seed: Directory tree of a Helm chart named wordpress, with Chart.yaml,
        values.yaml, templates, charts and crds each annotated with its purpose; the
        charts directory is marked emphatically as not a repository but a directory
