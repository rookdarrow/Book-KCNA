    source_ascii: "  ONE CLUSTER                THREE CLUSTERS                  WHAT\
      \ YOU WANT\n  ───────────                ──────────────                  ─────────────\n\
      \n  manifests/                 manifests-dev/     ◄─┐          package v1.2.0\n\
      \    deployment.yaml            deployment.yaml    │            (one copy,\n\
      \    service.yaml               service.yaml       │             versioned)\n\
      \    configmap.yaml             configmap.yaml     │\n                     \
      \                             │          + dev-values\n       │            \
      \         manifests-staging/   │          + staging-values\n       ▼       \
      \                deployment.yaml    ├─ 95%      + prod-values\n   ┌────────┐\
      \                  service.yaml       │  identical\n   │cluster │          \
      \        configmap.yaml     │  and nothing              │\n   └────────┘   \
      \                                  │  marks the 5%      ┌──────┼──────┐\n  \
      \                           manifests-prod/      │                    ▼    \
      \  ▼      ▼\n   Correct. Keep              deployment.yaml     │           \
      \      ┌───┐  ┌───┐  ┌───┐\n   doing this.                service.yaml     \
      \   │                 │dev│  │stg│  │prd│\n                              configmap.yaml\
      \    ◄─┘                 └───┘  └───┘  └───┘\n\n                           \
      \  ▲▲▲ THIS IS WHERE MOST TEAMS LIVE ▲▲▲\n"
    vendor_terms: []
