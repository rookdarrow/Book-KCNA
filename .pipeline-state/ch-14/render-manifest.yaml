    source_ascii: "        overlays/staging/                                overlays/prod/\n\
      \        ┌────────────────────┐                       ┌────────────────────┐\n\
      \        │ kustomization.yaml │                       │ kustomization.yaml │\n\
      \        │  resources:        │                       │  resources:        │\n\
      \        │    - ../../base    │                       │    - ../../base    │\n\
      \        │  namePrefix: stg-  │                       │  namePrefix: prod- │\n\
      \        │  replicas: 2       │                       │  replicas: 12      │\n\
      \        │  patches: [...]    │                       │  patches: [...]    │\n\
      \        │                    │                       │                    │\n\
      \        │  ONLY THE DELTAS   │                       │  ONLY THE DELTAS   │\n\
      \        └─────────┬──────────┘                       └──────────┬─────────┘\n\
      \                  │                                             │\n       \
      \           │          base/                              │\n              \
      \    │      ┌───────────────────────┐              │\n                  └─────►│\
      \ kustomization.yaml    │◄─────────────┘\n                         │ deployment.yaml\
      \       │\n                         │ service.yaml          │\n            \
      \             │                       │\n                         │  NEVER EDITED.\
      \        │\n                         │  NEVER COPIED.        │\n           \
      \              │  ONE OF IT.           │\n                         └───────────┬───────────┘\n\
      \                                     │\n                  ┌──────────────────┴──────────────────┐\n\
      \                  ▼                                     ▼\n        kubectl\
      \ apply -k overlays/staging     kubectl apply -k overlays/prod\n           \
      \       │                                     │\n                  ▼       \
      \                              ▼\n           stg- objects, 2 replicas      \
      \      prod- objects, 12 replicas\n"
    vendor_terms:
