  alt_text: A closed control loop with no beginning and no end. Desired state, now
    a Git repository rather than etcd and marked as the only substitution, is observed
    by a controller; the controller acts to close the gap through the API server,
    still the only door in; the API server changes current state, what is actually
    true, which the controller observes in turn. And then it does it again, forever.
