  alt_text: Two scenarios comparing target state in a Git repository against live
    state in a cluster, with an agent between them observing both. In the first, both
    say replicas three and the status is Synced. In the second, the repository still
    says three but the cluster says five because someone ran kubectl scale, and the
    status is OutOfSync; a separate sync operation applies the target state and the
    two match again.
