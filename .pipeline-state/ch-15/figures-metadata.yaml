  alt_text: Four release strategies in two groups. The upper group, fields on a Deployment,
    holds Recreate with a gap where neither version serves, and RollingUpdate with
    both versions overlapping throughout. The lower group, patterns needing tooling
    above it, holds blue/green with a single switch line and two-times capacity, and
    canary stepping five to twenty-five to fifty to one hundred percent and needing
    traffic splitting plus metric analysis.
