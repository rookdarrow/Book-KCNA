  alt_text: 'Three sync phases run left to right: PreSync holding a database migration,
    Sync, then PostSync holding a smoke test. Inside the Sync phase a vertical wave
    axis orders three resources lowest first: wave minus one Namespace, wave zero
    CustomResourceDefinition, wave one custom resource. Ordering precedence is phase,
    then wave, then kind, then name.'
