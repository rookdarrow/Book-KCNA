<svg viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch15-zenith-loop-title ch15-zenith-loop-desc" width="640" height="760">
    <title id="ch15-zenith-loop-title">The control loop, now pointed at a Git repository</title>
    <desc id="ch15-zenith-loop-desc">A closed reconciliation loop with no start or end: a controller observes desired state, now a Git repository instead of etcd, and current state, then acts through the API server to close the gap, and repeats indefinitely.</desc>
    <defs>
      <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"></polygon>
      </marker>
    </defs>

    <rect width="640" height="760" fill="#F5EFE4"></rect>

    <!-- Arrow 1: DESIRED STATE -> CONTROLLER (observe) -->
    <line x1="320" y1="208" x2="320" y2="272" stroke="#1F4A4E" stroke-width="1.5" marker-end="url(#arrow-muted)"></line>
    <rect x="328" y="232" width="64" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="360" y="244" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">OBSERVE</text>

    <!-- Arrow 2: CONTROLLER -> API SERVER (act) -->
    <path d="M 416 320 H 476 Q 484 320 484 328 V 460" fill="none" stroke="#0B1E3B" stroke-width="1.5" marker-end="url(#arrow-ink)"></path>
    <rect x="332" y="384" width="144" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="404" y="396" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#0B1E3B">ACT: CLOSE GAP</text>

    <!-- Arrow 3: API SERVER -> CURRENT STATE (changes) -->
    <line x1="384" y1="520" x2="256" y2="520" stroke="#0B1E3B" stroke-width="1.5" marker-end="url(#arrow-ink)"></line>
    <rect x="272" y="496" width="96" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="320" y="508" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#0B1E3B">CHANGES</text>

    <!-- Arrow 4: CURRENT STATE -> CONTROLLER (observe, loop closes here) -->
    <path d="M 120 460 V 328 Q 120 320 128 320 H 224" fill="none" stroke="#1F4A4E" stroke-width="1.5" marker-end="url(#arrow-muted)"></path>
    <rect x="36" y="384" width="76" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="74" y="396" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.04em" fill="#1F4A4E">OBSERVE</text>

    <!-- DESIRED STATE container -->
    <rect x="180" y="40" width="280" height="168" rx="8" fill="#F5EFE4"></rect>
    <rect x="180" y="40" width="280" height="168" rx="8" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
    <text x="320" y="68" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">DESIRED STATE</text>

    <!-- Git repository — focal, double-ruled -->
    <rect x="228" y="112" width="184" height="72" rx="6" fill="#F5EFE4"></rect>
    <rect x="228" y="112" width="184" height="72" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <rect x="236" y="120" width="168" height="56" rx="4" fill="none" stroke="#B58B3E" stroke-width="1"></rect>
    <text x="320" y="152" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Git repository</text>

    <!-- Callout: the only substitution -->
    <text x="608" y="56" text-anchor="end" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#B58B3E">the only</text>
    <text x="608" y="76" text-anchor="end" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#B58B3E">substitution</text>
    <text x="608" y="96" text-anchor="end" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#B58B3E">(was: etcd)</text>
    <path d="M 500 104 Q 460 128 412 148" fill="none" stroke="rgba(181,139,62,0.5)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="412" cy="148" r="3" fill="#B58B3E"></circle>

    <!-- CONTROLLER -->
    <rect x="224" y="272" width="192" height="96" rx="6" fill="#F5EFE4"></rect>
    <rect x="224" y="272" width="192" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="320" y="328" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">CONTROLLER</text>

    <!-- CURRENT STATE -->
    <rect x="56" y="460" width="200" height="120" rx="6" fill="#F5EFE4"></rect>
    <rect x="56" y="460" width="200" height="120" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
    <text x="156" y="500" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">CURRENT STATE</text>
    <text x="156" y="524" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">what is actually true</text>

    <!-- API SERVER -->
    <rect x="384" y="460" width="200" height="120" rx="6" fill="#F5EFE4"></rect>
    <rect x="384" y="460" width="200" height="120" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="484" y="500" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">API SERVER</text>
    <text x="484" y="524" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">still the only door in</text>
    <text x="484" y="548" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.02em" fill="#8A8D90">kube-apiserver</text>

    <!-- Caption -->
    <text x="320" y="624" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#0B1E3B">and then it does it again. forever.</text>

    <!-- Legend -->
    <line x1="56" y1="664" x2="584" y2="664" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="56" y="696" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">LEGEND</text>

    <rect x="168" y="680" width="16" height="16" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="192" y="696" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">ONLY SUBSTITUTION</text>

    <line x1="372" y1="692" x2="396" y2="692" stroke="#1F4A4E" stroke-width="2"></line>
    <text x="408" y="696" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">OBSERVE</text>

    <line x1="480" y1="692" x2="504" y2="692" stroke="#0B1E3B" stroke-width="2"></line>
    <text x="516" y="696" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">ACT / WRITE</text>
  </svg>