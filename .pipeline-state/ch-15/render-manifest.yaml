    source_ascii: "  ┌─ FIELDS ON A DEPLOYMENT ──────────────────────────────────────┐\n\
      \  │                                                               │\n  │  Recreate\
      \            RollingUpdate                            │\n  │  old ████░░░░░░\
      \      old ████▓▓▒▒░░░░                          │\n  │  new ░░░░░░████    \
      \  new ░░░░▒▒▓▓████                          │\n  │      └gap┘             \
      \                                       │\n  │  downtime; never     no downtime;\
      \ both                        │\n  │  two versions        versions live at once\
      \                    │\n  │  needs: nothing      needs: nothing            \
      \               │\n  └───────────────────────────────────────────────────────────────┘\n\
      \n  ┌─ PATTERNS NEEDING TOOLING ABOVE IT ───────────────────────────┐\n  │ \
      \                                                              │\n  │  Blue/Green\
      \          Canary                                   │\n  │  blue  ████████│░░\
      \   old ████████▓▓▓▓░░░░                      │\n  │  green ░░░░░░░░│██   new\
      \ ░░░░▒▒▒▒▓▓▓▓████                      │\n  │            switch          5%\
      \ → 25% → 50% → 100%              │\n  │  test before any     small slice meets\
      \ it                     │\n  │  user arrives        first; metrics decide \
      \                   │\n  │  needs: 2x capacity  needs: traffic splitting   \
      \              │\n  │                             + metric analysis        \
      \         │\n  └───────────────────────────────────────────────────────────────┘\n\
      \n  █ = new version serving   ░ = old version serving / absent\n"
    vendor_terms:
    - deployment
    complexity_hint:
      node_count: 6
      edge_count: 0
      label_count: 22
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - temporal_structure
      - fixed_point
      learning_outcome: Separate the two Deployment strategy field values from the
        two release patterns that require tooling above the Deployment, and state
        what each costs
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the lower enclosure's title band, PATTERNS NEEDING
        TOOLING ABOVE IT
    accessibility:
      alt_text_seed: Four release strategies in two groups. The upper group, fields
        on a Deployment, holds Recreate with a gap where neither version serves, and
