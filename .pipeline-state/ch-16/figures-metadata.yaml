  alt_text: 'A request path runs left to right from client, to DNS name, to Service,
    to EndpointSlice, to Pod, to container port. Three callouts drop from it. From
    the DNS name: break four, the name does not resolve to this Service. From the
    EndpointSlice: breaks one and two, the list is empty, caused either by a selector
    mismatch or by Pods not being Ready. From the container port: break three, port
    does not equal targetPort, and here the list is populated. A legend notes that
    upstream breaks empty the list, the downstream break leaves it populated while
    the request still fails, and break four means this Service was never reached.'
