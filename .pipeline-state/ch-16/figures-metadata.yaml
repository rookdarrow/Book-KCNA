  alt_text: 'A left-to-right sequence of three init containers followed by the app
    containers. Beneath each, the Pod status it produces: Init:0/3 under the first
    init container, Init:1/3 under the second, Init:2/3 under the third, and Running
    under the app containers. Below, the commands for reading init container logs,
    and three failure signatures paired with their causes: stuck with no error means
    an ordering deadlock, failing only on restart means non-idempotency, and exiting
    non-zero means a configuration error.'
