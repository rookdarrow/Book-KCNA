  alt_text: 'A request path runs left to right from client, to DNS name, to Service,
    to EndpointSlice, to Pod, to container port. Three callouts drop from it. From
    the DNS name: break four, the name does not resolve to this Service. From the
    EndpointSlice: breaks one and two, no ready endpoints — a selector mismatch leaves
    the slice empty, while Pods that are not Ready stay listed with ready false. From
    the container port: break three, port does not equal targetPort, and here the
    endpoints are ready. A legend notes that breaks one and two sit upstream of readiness
    and yield no ready endpoints, break three sits downstream with ready endpoints
    and a failing request, and break four means this Service was never reached.'
