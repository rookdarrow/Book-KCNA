  alt_text: Two separate request paths. The Service path, travelled by users, runs
    from client to DNS to the Service's ClusterIP to the service proxy to the Pod's
    targetPort, annotated with selector and endpoints at the Service and kube-proxy
    rules at the proxy; all four of section four's break points live on this path.
    The port-forward path, travelled by the engineer, runs from kubectl to the API
    server via the pods/portforward subresource and on to the Pod's port. The two
    paths share no step except the Pod itself.
