  alt_text: 'Three panels comparing kubectl debug''s shapes. Panel A: an ephemeral
    debug container added inside an unchanged Pod alongside a distroless app container,
    annotated as unable to be removed; it asks what the running process sees now.
    Panel B: two unconnected Pods side by side, the original still running and crashing
    on startup, and a separate copy with its entrypoint replaced; it asks what would
    happen if something changed. Panel C, shown as platform scope: a debug Pod on
    a Node with the host filesystem mounted; it asks whether the machine itself is
    the problem.'
