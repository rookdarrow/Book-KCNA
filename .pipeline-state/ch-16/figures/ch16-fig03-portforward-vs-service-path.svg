<svg viewBox="0 0 600 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pfw-vs-svc-title pfw-vs-svc-desc" width="480" height="647">
      <title id="pfw-vs-svc-title">Two Paths to the Pod: Service vs. Port-Forward</title>
      <desc id="pfw-vs-svc-desc">Two separate request paths. The Service path, travelled by users, runs from client to DNS to the Service's ClusterIP to the service proxy to the Pod's targetPort, annotated with selector and endpoints at the Service and kube-proxy rules at the proxy; all four of section four's break points live on this path. The port-forward path, travelled by the engineer, runs from kubectl to the API server via the pods/portforward subresource and on to the Pod's port. The two paths share no step except the Pod itself.</desc>

      <defs>
        <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#1F4A4E"></path>
        </marker>
        <marker id="arr-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#B58B3E"></path>
        </marker>
        <marker id="arr-link" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#1F4A4E"></path>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ===== column headers ===== -->
      <text x="128" y="24" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#0B1E3B">THE SERVICE PATH</text>
      <text x="128" y="44" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-style="italic" font-size="14" fill="#1F4A4E">(what your users travel)</text>

      <text x="472" y="24" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#0B1E3B">THE PORT-FORWARD PATH</text>
      <text x="472" y="44" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-style="italic" font-size="14" fill="#1F4A4E">(what you travel)</text>

      <!-- ===== connectors (drawn before nodes) ===== -->
      <!-- main chain: service path -->
      <line x1="128" y1="136" x2="128" y2="200" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <line x1="128" y1="264" x2="128" y2="328" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <line x1="128" y1="392" x2="128" y2="456" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <line x1="128" y1="520" x2="128" y2="584" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <!-- main chain: port-forward path -->
      <line x1="472" y1="264" x2="472" y2="328" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <line x1="472" y1="392" x2="472" y2="456" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
      <line x1="472" y1="520" x2="472" y2="584" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>

      <!-- annotation stub A: Service -> "selector, endpoints" -->
      <line x1="216" y1="360" x2="224" y2="360" stroke="#8A8D90" stroke-width="0.8"></line>
      <circle cx="216" cy="360" r="2" fill="#8A8D90"></circle>
      <circle cx="224" cy="360" r="2" fill="#8A8D90"></circle>

      <!-- annotation stub B: kube-proxy -> "kube-proxy rules" -->
      <line x1="216" y1="488" x2="224" y2="488" stroke="#8A8D90" stroke-width="0.8"></line>
      <circle cx="216" cy="488" r="2" fill="#8A8D90"></circle>
      <circle cx="224" cy="488" r="2" fill="#8A8D90"></circle>

      <!-- annotation stub C: kube-apiserver -> "pods/portforward subresource" -->
      <path d="M384,372 H364 Q356,372 356,380 V416 Q356,424 364,424 H376" fill="none" stroke="#8A8D90" stroke-width="0.8"></path>
      <circle cx="384" cy="372" r="2" fill="#8A8D90"></circle>
      <circle cx="376" cy="424" r="2" fill="#8A8D90"></circle>

      <!-- same-pod link: dashed, no directional marker -->
      <line x1="216" y1="616" x2="384" y2="616" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4"></line>
      <circle cx="216" cy="616" r="3" fill="#B58B3E"></circle>
      <circle cx="384" cy="616" r="3" fill="#B58B3E"></circle>
      <rect x="260" y="592" width="80" height="16" rx="2" fill="#F5EFE4"></rect>
      <text x="300" y="604" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" letter-spacing="0.04em" fill="#0B1E3B">SAME POD</text>

      <!-- ===== nodes: service path (left column) ===== -->
      <!-- client -->
      <rect x="40" y="72" width="176" height="64" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text x="128" y="109" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">client</text>

      <!-- DNS -->
      <rect x="40" y="200" width="176" height="64" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="128" y="237" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">DNS</text>

      <!-- Service -->
      <rect x="40" y="328" width="176" height="64" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="128" y="355" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Service</text>
      <text x="128" y="374" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">ClusterIP</text>

      <!-- kube-proxy -->
      <rect x="40" y="456" width="176" height="64" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="128" y="483" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">kube-proxy</text>
      <text x="128" y="502" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">service proxy</text>

      <!-- Pod (service path terminus) -->
      <rect x="40" y="584" width="176" height="64" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="128" y="611" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod</text>
      <text x="128" y="630" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">targetPort</text>

      <!-- ===== nodes: port-forward path (right column) ===== -->
      <!-- kubectl -->
      <rect x="384" y="200" width="176" height="64" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>
      <text x="472" y="237" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">kubectl</text>

      <!-- kube-apiserver -->
      <rect x="384" y="328" width="176" height="64" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="472" y="355" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">kube-apiserver</text>
      <text x="472" y="374" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">API server</text>

      <!-- kubelet -->
      <rect x="384" y="456" width="176" height="64" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="472" y="483" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">kubelet</text>

      <!-- Pod (port-forward path terminus) -->
      <rect x="384" y="584" width="176" height="64" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="472" y="611" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod</text>
      <text x="472" y="630" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">port</text>

      <!-- ===== annotation boxes ===== -->
      <!-- Box A: selector, endpoints -->
      <rect x="224" y="336" width="152" height="48" rx="4" fill="#F5EFE4" stroke="rgba(138,141,144,0.5)" stroke-width="0.8"></rect>
      <text x="300" y="356" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">selector,</text>
      <text x="300" y="374" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">endpoints</text>

      <!-- Box B: kube-proxy rules -->
      <rect x="224" y="464" width="152" height="48" rx="4" fill="#F5EFE4" stroke="rgba(138,141,144,0.5)" stroke-width="0.8"></rect>
      <text x="300" y="484" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">kube-proxy</text>
      <text x="300" y="502" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">rules</text>

      <!-- Box C: pods/portforward subresource -->
      <rect x="224" y="400" width="152" height="48" rx="4" fill="#F5EFE4" stroke="rgba(138,141,144,0.5)" stroke-width="0.8"></rect>
      <text x="300" y="420" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">pods/portforward</text>
      <text x="300" y="438" text-anchor="middle" font-family="'Fira Mono',monospace" font-size="14" fill="#1F4A4E">subresource</text>

      <!-- ===== footnotes (editorial callouts, max 2) ===== -->
      <text x="128" y="692" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-style="italic" font-size="16" fill="#1F4A4E">
        <tspan x="128" dy="0">§4 breaks 1-4 all live</tspan>
        <tspan x="128" dy="20">on this path.</tspan>
      </text>

      <text x="472" y="672" text-anchor="middle" font-family="'Fira Sans',sans-serif" font-style="italic" font-size="16" fill="#1F4A4E">
        <tspan x="472" dy="0">Shares no step with</tspan>
        <tspan x="472" dy="20">the Service path —</tspan>
        <tspan x="472" dy="20">except the Pod itself.</tspan>
      </text>

      <!-- ===== legend ===== -->
      <text x="32" y="744" font-family="'Fira Mono',monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">LEGEND</text>
      <line x1="32" y1="752" x2="568" y2="752" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

      <rect x="32" y="770" width="16" height="10" rx="2" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="0.8"></rect>
      <text x="56" y="779" font-family="'Fira Sans',sans-serif" font-size="14" fill="#0B1E3B">Entry</text>

      <rect x="140" y="770" width="16" height="10" rx="2" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="0.8"></rect>
      <text x="164" y="779" font-family="'Fira Sans',sans-serif" font-size="14" fill="#0B1E3B">Step</text>

      <rect x="232" y="770" width="16" height="10" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"></rect>
      <text x="256" y="779" font-family="'Fira Sans',sans-serif" font-size="14" fill="#0B1E3B">Shared Pod</text>

      <line x1="384" y1="775" x2="408" y2="775" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="5,4"></line>
      <text x="416" y="779" font-family="'Fira Sans',sans-serif" font-size="14" fill="#0B1E3B">Same object</text>

    </svg>