<svg viewBox="0 0 560 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16-fig03-portforward-vs-service-path-title ch16-fig03-portforward-vs-service-path-desc" width="640" height="892">
    <title id="ch16-fig03-portforward-vs-service-path-title">Service Path vs. Port-Forward Path to a Pod</title>
    <desc id="ch16-fig03-portforward-vs-service-path-desc">Diagram comparing the Service path a user's request travels — client, DNS, the Service's ClusterIP with its selector and endpoints, the service proxy applying kube-proxy rules, then the Pod's targetPort — against the port-forward path an engineer travels — kubectl, the API server's pods/portforward subresource, kubelet, then the Pod's port — showing the two paths share no step except the Pod itself.</desc>

    <defs>
      <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
      <marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
    </defs>

    <!-- background -->
    <rect width="560" height="780" fill="#F5EFE4"></rect>

    <!-- structural dividers -->
    <line x1="40" y1="56" x2="520" y2="56" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <line x1="280" y1="56" x2="280" y2="648" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <line x1="40" y1="664" x2="520" y2="664" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>

    <!-- column headers -->
    <text x="152" y="20" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">SERVICE PATH</text>
    <text x="152" y="40" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="14">what your users travel</text>

    <text x="408" y="20" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">PORT-FORWARD PATH</text>
    <text x="408" y="40" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="14">what you travel</text>

    <!-- arrows: left column (client -> DNS -> Service -> service proxy -> Pod) -->
    <line x1="152" y1="152" x2="152" y2="184" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="152" y1="272" x2="152" y2="304" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="152" y1="392" x2="152" y2="424" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="152" y1="512" x2="152" y2="544" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>

    <!-- arrows: right column (kubectl -> API server -> kubelet -> Pod), skipping the empty DNS-equivalent row -->
    <line x1="408" y1="152" x2="408" y2="304" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="408" y1="392" x2="408" y2="424" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <line x1="408" y1="512" x2="408" y2="544" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>

    <!-- dashed connector: same Pod, different access point (no arrowhead - equivalence, not flow) -->
    <line x1="252" y1="588" x2="308" y2="588" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,3"></line>
    <circle cx="252" cy="588" r="3" fill="#8A8D90"></circle>
    <circle cx="308" cy="588" r="3" fill="#8A8D90"></circle>

    <!-- ===== LEFT COLUMN NODES ===== -->

    <!-- client -->
    <rect x="52" y="64" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="152" y="100" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">client</text>
    <text x="152" y="120" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">sends the request</text>

    <!-- DNS -->
    <rect x="52" y="184" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="152" y="220" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">DNS</text>
    <text x="152" y="240" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">resolves the name</text>

    <!-- Service -->
    <rect x="52" y="304" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="152" y="328" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Service</text>
    <text x="152" y="348" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">ClusterIP</text>
    <text x="152" y="368" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">selector, endpoints</text>

    <!-- service proxy -->
    <rect x="52" y="424" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="152" y="460" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">service proxy</text>
    <text x="152" y="480" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">kube-proxy rules</text>

    <!-- Pod (targetPort) - FOCAL -->
    <rect x="52" y="544" width="200" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="52" y="544" width="200" height="88" rx="6" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="152" y="580" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Pod</text>
    <text x="152" y="600" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">targetPort</text>

    <!-- ===== RIGHT COLUMN NODES ===== -->

    <!-- kubectl -->
    <rect x="308" y="64" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="408" y="100" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">kubectl</text>
    <text x="408" y="120" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">port-forward</text>

    <!-- (empty cell: no DNS-equivalent step on this path) -->

    <!-- API server -->
    <rect x="308" y="304" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="408" y="328" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">API server</text>
    <text x="408" y="348" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">kube-apiserver</text>
    <text x="408" y="368" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">pods/portforward</text>

    <!-- kubelet -->
    <rect x="308" y="424" width="200" height="88" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="408" y="460" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">kubelet</text>
    <text x="408" y="480" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">streams connection</text>

    <!-- Pod (port) - FOCAL -->
    <rect x="308" y="544" width="200" height="88" rx="6" fill="#F5EFE4"></rect>
    <rect x="308" y="544" width="200" height="88" rx="6" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="408" y="580" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Pod</text>
    <text x="408" y="600" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">port</text>

    <!-- ===== LEGEND ===== -->
    <text x="40" y="688" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">LEGEND</text>

    <rect x="40" y="704" width="16" height="16" rx="4" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="64" y="716" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">PIPELINE STEP</text>

    <rect x="300" y="704" width="16" height="16" rx="4" fill="#B58B3E" fill-opacity="0.10" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="324" y="716" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">SHARED STEP (FOCAL)</text>

    <line x1="40" y1="740" x2="60" y2="740" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"></line>
    <text x="68" y="744" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">REQUEST / CONNECTION FLOW</text>

    <line x1="300" y1="740" x2="320" y2="740" stroke="#8A8D90" stroke-width="1" stroke-dasharray="4,3"></line>
    <circle cx="300" cy="740" r="3" fill="#8A8D90"></circle>
    <circle cx="320" cy="740" r="3" fill="#8A8D90"></circle>
    <text x="328" y="744" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14">SAME POD, DIFF. PORT</text>
  </svg>