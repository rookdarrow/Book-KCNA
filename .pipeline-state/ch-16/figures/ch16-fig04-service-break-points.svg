<svg viewBox="0 0 600 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16fig04-title ch16fig04-desc" width="560" height="699">
    <title id="ch16fig04-title">Where a Service request breaks along its path</title>
    <desc id="ch16fig04-desc">A request path runs from client to DNS name to Service to EndpointSlice to Pod to container port, with callouts showing that a name-resolution break happens beside the path, that a selector mismatch or unready Pods empty the EndpointSlice's list upstream, and that a port-to-targetPort mismatch fails the request downstream even though the list is populated.</desc>
    <defs>
      <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
    </defs>

    <rect width="600" height="748" fill="#F5EFE4"></rect>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- spine chain, top to bottom -->
    <line x1="120" y1="72" x2="120" y2="112" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"></line>
    <line x1="120" y1="160" x2="120" y2="200" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"></line>
    <line x1="120" y1="248" x2="120" y2="288" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"></line>
    <line x1="120" y1="336" x2="120" y2="376" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"></line>
    <line x1="120" y1="424" x2="120" y2="464" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow-muted)"></line>

    <!-- branch to BREAK 4 (dashed, secondary) -->
    <line x1="200" y1="136" x2="248" y2="136" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"></line>
    <!-- branch to BREAK 1+2 (focal, solid accent) -->
    <line x1="200" y1="312" x2="248" y2="312" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"></line>
    <!-- branch to BREAK 3 (dashed, secondary) -->
    <line x1="200" y1="488" x2="248" y2="488" stroke="#1F4A4E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"></line>

    <!-- ============ SPINE NODES ============ -->

    <!-- client: input/user treatment -->
    <rect x="40" y="24" width="160" height="48" rx="6" fill="#F5EFE4"></rect>
    <rect x="40" y="24" width="160" height="48" rx="6" fill="rgba(31,74,78,0.10)" stroke="#8A8D90" stroke-width="1"></rect>

    <!-- DNS name / Service / EndpointSlice / Pod / container port: backend treatment -->
    <rect x="40" y="112" width="160" height="48" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="40" y="200" width="160" height="48" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="40" y="288" width="160" height="48" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="40" y="376" width="160" height="48" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <rect x="40" y="464" width="160" height="48" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>

    <!-- one text block for the whole path: it is a single ordered chain, one concept -->
    <text text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">
      <tspan x="120" y="54">client</tspan>
      <tspan x="120" y="142">DNS name</tspan>
      <tspan x="120" y="230">Service</tspan>
      <tspan x="120" y="318">EndpointSlice</tspan>
      <tspan x="120" y="406">Pod</tspan>
      <tspan x="120" y="494">container port</tspan>
    </text>

    <!-- ============ CALLOUT: BREAK 4 (secondary, dashed) ============ -->
    <rect x="248" y="80" width="280" height="112" rx="6" fill="#F5EFE4"></rect>
    <rect x="248" y="80" width="280" height="112" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"></rect>
    <text font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#0B1E3B">
      <tspan x="264" y="108">BREAK 4</tspan>
      <tspan x="264" y="136" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">The name doesn’t resolve</tspan>
      <tspan x="264" y="160" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">to this Service.</tspan>
    </text>

    <!-- ============ CALLOUT: BREAK 1+2 (FOCAL) ============ -->
    <rect x="248" y="240" width="280" height="144" rx="6" fill="#F5EFE4"></rect>
    <rect x="248" y="240" width="280" height="144" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#0B1E3B">
      <tspan x="264" y="268">BREAK 1+2</tspan>
      <tspan x="264" y="296" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="normal" fill="#B58B3E">LIST EMPTY</tspan>
      <tspan x="264" y="324" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#0B1E3B">1 · selector mismatch</tspan>
      <tspan x="264" y="348" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#0B1E3B">2 · Pods not Ready</tspan>
    </text>

    <!-- ============ CALLOUT: BREAK 3 (secondary, dashed) ============ -->
    <rect x="248" y="428" width="280" height="120" rx="6" fill="#F5EFE4"></rect>
    <rect x="248" y="428" width="280" height="120" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"></rect>
    <text font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#0B1E3B">
      <tspan x="264" y="456">BREAK 3</tspan>
      <tspan x="264" y="484" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">port ≠ </tspan><tspan font-family="'Fira Mono', monospace" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">targetPort</tspan>
      <tspan x="264" y="508" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="normal" fill="#0B1E3B">(list is POPULATED)</tspan>
    </text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="580" x2="560" y2="580" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">
      <tspan x="40" y="600">LEGEND</tspan>
      <tspan x="40" y="628" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="normal" fill="#0B1E3B">UPSTREAM</tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E"> of the list — breaks 1 and 2 → EMPTY LIST</tspan>
      <tspan x="40" y="656" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="normal" fill="#0B1E3B">DOWNSTREAM</tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E"> of the list — break 3 →</tspan>
      <tspan x="40" y="680" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">POPULATED LIST, request still fails</tspan>
      <tspan x="40" y="708" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="normal" fill="#0B1E3B">BESIDE</tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E"> the whole path — break 4 →</tspan>
      <tspan x="40" y="732" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="normal" fill="#1F4A4E">you never reached this Service at all</tspan>
    </text>
  </svg>