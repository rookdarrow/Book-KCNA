<!DOCTYPE html>
<!--

  them left-to-right), each chain's internal axis is rotated: nodes read top-to-bottom
  within a path instead of left-to-right. Section order (Service path first, then
  Port-forward) and node reading order within each path are unchanged from the ASCII.

  regenerate hint.

<body>
<div class="page">
  <p class="eyebrow">Ch.16 · Fig.03 — Data Flow</p>
  <h1>Port-Forward vs. Service Path</h1>
  <p class="subtitle">A working port-forward beside a failing Service call points at a break in the Service path — not a broken Pod.</p>

  <div class="diagram">
    <svg viewBox="0 0 872 1176" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16-fig03-title ch16-fig03-desc">
      <title id="ch16-fig03-title">Port-forward path vs. Service path to a Pod</title>
      <desc id="ch16-fig03-desc">Two separate request paths to a Kubernetes Pod: the Service path — client, DNS, the Service's ClusterIP, the service proxy, and the Pod's targetPort — carries every failure point from section four, while the port-forward path — kubectl, the API server's pods/portforward subresource, and the Pod's port — shares no step with it except the Pod itself.</desc>

      <defs>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#1F4A4E"/>
        </marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#B58B3E"/>
        </marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="872" height="1176" fill="#F5EFE4"/>

      <!-- ===== Arrows first (z-order) ===== -->
      <!-- Section A: Service path -->
      <line x1="436" y1="144" x2="436" y2="168" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="436" y1="224" x2="436" y2="248" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="436" y1="352" x2="436" y2="376" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="436" y1="480" x2="436" y2="504" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <!-- Section B: Port-forward path -->
      <line x1="436" y1="792" x2="436" y2="816" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="436" y1="920" x2="436" y2="944" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>

      <!-- ===== Section A header ===== -->
      <text x="436" y="52" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">THE SERVICE PATH</text>
      <text x="436" y="72" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#8A8D90">(what your users travel)</text>

      <!-- Node: client -->
      <rect x="316" y="88" width="240" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="122" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">client</text>

      <!-- Node: DNS -->
      <rect x="316" y="168" width="240" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="202" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">DNS</text>

      <!-- Node: Service -->
      <rect x="316" y="248" width="240" height="104" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="274" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Service</text>
      <text x="436" y="298" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">ClusterIP</text>
      <text x="436" y="320" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">selector, endpoints</text>

      <!-- Node: service proxy -->
      <rect x="316" y="376" width="240" height="104" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="402" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">service proxy</text>
      <text x="436" y="426" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">kube-proxy or its</text>
      <text x="436" y="448" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="14" fill="#8A8D90">equivalent</text>

      <!-- Node: Pod (focal, Service path terminus) -->
      <rect x="316" y="504" width="240" height="80" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>

      <text x="436" y="562" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">targetPort</text>

      <!-- Caption: Section A -->
      <text x="436" y="628" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">§4's breaks 1–4 all live on this path.</text>

      <!-- Section divider -->
      <line x1="32" y1="664" x2="840" y2="664" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <!-- ===== Section B header ===== -->
      <text x="436" y="700" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">THE PORT-FORWARD PATH</text>
      <text x="436" y="720" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" fill="#8A8D90">(what you travel)</text>

      <!-- Node: kubectl -->
      <rect x="316" y="736" width="240" height="56" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="770" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">kubectl</text>

      <!-- Node: API server -->
      <rect x="316" y="816" width="240" height="104" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="436" y="842" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">API server</text>
      <text x="436" y="866" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">pods/portforward</text>
      <text x="436" y="888" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">subresource</text>

      <!-- Node: Pod (focal, port-forward path terminus) -->
      <rect x="316" y="944" width="240" height="80" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="436" y="974" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Pod</text>
      <text x="436" y="1002" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">port</text>

      <!-- Caption: Section B -->
      <text x="436" y="1068" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#8A8D90">Shares no step with the path above except the Pod itself.</text>

      <!-- ===== Legend ===== -->
      <text x="48" y="1108" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">LEGEND</text>
      <line x1="32" y1="1112" x2="840" y2="1112" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <rect x="48" y="1124" width="16" height="16" rx="3" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
      <text x="72" y="1136" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#0B1E3B">PATH STEP</text>

      <rect x="340" y="1124" width="16" height="16" rx="3" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="364" y="1136" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#0B1E3B">THE SHARED POD</text>

      <line x1="600" y1="1132" x2="632" y2="1132" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arr-muted)"/>
      <text x="644" y="1136" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.06em" fill="#0B1E3B">REQUEST FLOW</text>
    </svg>
  </div>

  <footer>Lodestar Ledgers · Ch.16 Fig.03 · ch16-fig03-portforward-vs-service-path</footer>
</div>
</body>
</html>
