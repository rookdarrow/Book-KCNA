<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where a Service Request Breaks</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:  #F5EFE4;
    --ink:    #0B1E3B;
    --muted:  #1F4A4E;
    --soft:   #8A8D90;
    --accent: #B58B3E;
    --font-slab: 'Roboto Slab', serif;
    --font-sans: 'Fira Sans', sans-serif;
    --font-mono: 'Fira Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1000px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-slab);
    font-size: clamp(1.5rem, 2.2vw + 0.75rem, 1.75rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    max-width: 640px;
  }
  svg { width: 100%; display: block; }
  footer {
    margin-top: 1.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgba(11,30,59,0.12);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--soft);
  }
</style>
</head>
<body>
<!--
  Type-fit note: the figure spec labels this "data_flow", but the authored content
  is a single linear request-path trace (client -> DNS -> Service -> EndpointSlice ->
  Pod -> port) with break callouts, not a role-scoped multi-lane pipeline. Rendering it
  against the skill's parametric Data Flow grammar (lanes/steps/chips) would invent
  organizational lanes that don't exist in the source. Rendered instead as an
  Architecture-style linear chain with annotation-style callout boxes, per the
  content-fidelity/topology-preservation instructions, which take precedence here.

  Aspect-ratio note: preserving the authored left-to-right order (load-bearing for the
  legend's "upstream / downstream / beside" spatial language) keeps this wider than the
  3:4 portrait preference. Final ratio is ~1.98:1, inside the 2.5:1 hard limit.
-->
<div class="frame">
  <p class="eyebrow">Ch.16 &middot; Service Troubleshooting</p>
  <h1>Where a Service Request Breaks</h1>
  <p class="subtitle">No ready endpoints is the Service working exactly as written &mdash; not a bug.</p>

  <svg viewBox="0 0 912 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16fig04-title ch16fig04-desc">
    <title id="ch16fig04-title">Service failure break points along the request path</title>
    <desc id="ch16fig04-desc">A request path runs from client to DNS name to Service to EndpointSlice to Pod to container port; callouts mark where breaks 1, 2, 3, and 4 occur, and a legend distinguishes upstream-of-readiness failures with no ready endpoints from a downstream failure with ready endpoints and a request that still fails, and from never reaching the Service at all.</desc>
    <defs>
      <marker id="arr-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      <marker id="arr-point" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"/></marker>
    </defs>

    <rect width="912" height="460" fill="#F5EFE4"/>

    <!-- ===== Connectors (drawn before boxes) ===== -->

    <!-- Primary request-path chain, left to right -->
    <line x1="120" y1="64" x2="152" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"/>
    <line x1="256" y1="64" x2="288" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"/>
    <line x1="392" y1="64" x2="424" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"/>
    <line x1="568" y1="64" x2="600" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"/>
    <line x1="680" y1="64" x2="712" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"/>

    <!-- Drops to break callouts -->
    <line x1="204" y1="88" x2="204" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"/>
    <line x1="496" y1="88" x2="496" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"/>
    <line x1="784" y1="88" x2="784" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"/>

    <!-- ===== Request-path chain nodes ===== -->

    <rect x="32" y="40" width="88" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="76" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">client</text>

    <rect x="152" y="40" width="104" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="204" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">DNS name</text>

    <rect x="288" y="40" width="104" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="340" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">Service</text>

    <rect x="424" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="496" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">EndpointSlice</text>

    <rect x="600" y="40" width="80" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="640" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">Pod</text>

    <rect x="712" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="784" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">container port</text>

    <!-- ===== Break callouts ===== -->

    <!-- BREAK 4 — beside the whole path -->
    <rect x="96" y="128" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="204" y="154" font-family="'Fira Sans'" font-size="18" font-weight="600" fill="#0B1E3B" letter-spacing="0.04em" text-anchor="middle">BREAK 4</text>
    <text x="204" y="180" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">name doesn't resolve</text>
    <text x="204" y="201" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">to this Service</text>

    <!-- BREAK 1+2 — focal: upstream of readiness, no ready endpoints -->
    <rect x="372" y="128" width="248" height="164" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.5"/>
    <text x="496" y="154" font-family="'Fira Sans'" font-size="18" font-weight="700" fill="#B58B3E" letter-spacing="0.04em" text-anchor="middle">BREAK 1+2</text>
    <text x="496" y="178" font-family="'Fira Sans'" font-size="14" font-weight="600" fill="#0B1E3B" letter-spacing="0.06em" text-anchor="middle">NO READY ENDPOINTS</text>
    <text x="496" y="204" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">1 selector mismatch</text>
    <text x="496" y="225" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">&#8594; slice empty</text>
    <text x="496" y="250" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">2 not Ready</text>
    <text x="496" y="271" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">&#8594; ready: false</text>

    <!-- BREAK 3 — downstream of readiness -->
    <rect x="676" y="128" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"/>
    <text x="784" y="154" font-family="'Fira Sans'" font-size="18" font-weight="600" fill="#0B1E3B" letter-spacing="0.04em" text-anchor="middle">BREAK 3</text>
    <text x="784" y="180" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">port &#8800; targetPort</text>
    <text x="784" y="201" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">(endpoints ARE ready)</text>

    <!-- ===== Legend ===== -->
    <line x1="32" y1="332" x2="880" y2="332" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
    <text x="32" y="348" font-family="'Fira Mono'" font-size="14" font-weight="500" fill="#8A8D90" letter-spacing="0.12em" text-anchor="start">LEGEND</text>

    <text x="32" y="372" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">UPSTREAM</tspan> of readiness &#8230; breaks 1 and 2 &#8594; NO READY ENDPOINTS</text>
    <text x="32" y="400" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">DOWNSTREAM</tspan> of readiness &#8230; break 3 &#8594; ENDPOINTS READY, request still fails</text>
    <text x="32" y="428" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">BESIDE</tspan> the whole path &#8230; break 4 &#8594; you never reached this Service at all</text>
  </svg>

  <footer>Fig. 16.4 &middot; Service break points along the request path</footer>
</div>
</body>
</html>
