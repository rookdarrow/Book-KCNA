<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Init:N/M status across an init container sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:        #F5EFE4;
      --color-ink:           #0B1E3B;
      --color-muted:         #1F4A4E;
      --color-soft:          #8A8D90;
      --color-accent:        #B58B3E;
      --color-accent-tint:   rgba(181,139,62,0.10);
      --font-sans:  'Fira Sans', system-ui, sans-serif;
      --font-serif: 'Roboto Slab', serif;
      --font-mono:  'Fira Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 560px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 1.6vw + 0.9rem, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Ch.16 Kubernetes Troubleshooting</p>
    <h1>Reading Init:N/M Status Across the Init Container Sequence</h1>

    <svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16-fig05-title ch16-fig05-desc">
      <title id="ch16-fig05-title">Reading Init:N/M status across an init container sequence</title>
      <desc id="ch16-fig05-desc">Flowchart showing three init containers and the app containers in sequence, each labeled with the Init:N/M or Running status it produces, plus the kubectl commands and three failure-signature-to-cause mappings used to debug a stuck pod.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- Section caption: init container sequence -->
      <text x="44" y="24" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">INIT CONTAINER STATUS</text>

      <!-- Arrows between stage boxes (drawn before boxes) -->
      <line x1="184" y1="84" x2="208" y2="84" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="84" x2="372" y2="84" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="512" y1="84" x2="536" y2="84" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stage 1: init-1 -->
      <rect x="44" y="40" width="140" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="114" y="70" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">init-1</text>
      <line x1="56" y1="84" x2="172" y2="84" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="114" y="112" fill="#B58B3E" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">Init:0/3</text>

      <!-- Stage 2: init-2 -->
      <rect x="208" y="40" width="140" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="278" y="70" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">init-2</text>
      <line x1="220" y1="84" x2="336" y2="84" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="278" y="112" fill="#B58B3E" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">Init:1/3</text>

      <!-- Stage 3: init-3 -->
      <rect x="372" y="40" width="140" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="442" y="70" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">init-3</text>
      <line x1="384" y1="84" x2="500" y2="84" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="442" y="112" fill="#B58B3E" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">Init:2/3</text>

      <!-- Stage 4: app containers -->
      <rect x="536" y="40" width="140" height="88" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="606" y="70" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">app containers</text>
      <line x1="548" y1="84" x2="664" y2="84" stroke="#8A8D90" stroke-width="0.8"/>
      <text x="606" y="112" fill="#B58B3E" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">Running</text>

      <!-- Command reference card -->
      <rect x="44" y="176" width="632" height="128" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="64" y="200" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">READ WITH</text>
      <text x="64" y="220" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">kubectl logs &lt;pod&gt; -c &lt;init-name&gt;</text>
      <text x="64" y="244" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">ALSO READ</text>
      <text x="64" y="264" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">kubectl describe pod &lt;pod&gt;</text>
      <text x="64" y="284" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">(exit codes, order, state)</text>

      <!-- Failure signature section caption -->
      <text x="44" y="336" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.12em">FAILURE SIGNATURES</text>

      <!-- Row 1: stuck, no error -->
      <rect x="44" y="352" width="632" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"/>
      <text x="68" y="388" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">STUCK, NO ERROR</text>
      <line x1="356" y1="384" x2="384" y2="384" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="404" y="380" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Ordering deadlock —</text>
      <text x="404" y="400" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">what is it waiting for?</text>

      <!-- Row 2: fails only on restart -->
      <rect x="44" y="436" width="632" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"/>
      <text x="68" y="472" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">FAILS ONLY ON RESTART</text>
      <line x1="356" y1="468" x2="384" y2="468" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="404" y="464" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Non-idempotent — it</text>
      <text x="404" y="484" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">assumed a clean slate</text>

      <!-- Row 3: exits non-zero -->
      <rect x="44" y="520" width="632" height="64" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"/>
      <text x="68" y="556" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace">EXITS NON-ZERO, LOUDLY</text>
      <line x1="356" y1="552" x2="384" y2="552" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="404" y="548" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Config error — read</text>
      <text x="404" y="568" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">the message, it's telling you</text>

      <!-- Legend -->
      <line x1="44" y1="624" x2="676" y2="624" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="44" y="640" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="44" y="652" width="24" height="12" rx="4" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="76" y="662" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Container / reference card</text>

      <rect x="372" y="652" width="24" height="12" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="404" y="662" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Pod status (focal)</text>

      <rect x="44" y="680" width="24" height="12" rx="4" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"/>
      <text x="76" y="690" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Failure signature</text>

      <line x1="372" y1="686" x2="400" y2="686" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="404" y="690" fill="#0B1E3B" font-size="14" font-family="'Fira Sans', sans-serif">Sequence / next step</text>
    </svg>
  </div>
</body>
</html>
