    diagram_type: data_flow
    source_ascii: "  THE SERVICE PATH (what your users travel)\n  client ──▶ DNS ──▶\
      \ Service (ClusterIP) ──▶ service proxy ──▶ Pod:targetPort\n               \
      \           │                        │\n                     selector, endpoints\
      \    kube-proxy or its equivalent\n                     [ §4 breaks 1-4 all\
      \ live on this path ]\n\n  THE PORT-FORWARD PATH (what you travel)\n  kubectl\
      \ ──▶ API server ──▶ Pod:port\n                    │\n            pods/portforward\
      \ subresource\n            [ shares NO step with the path above except the Pod\
      \ itself ]\n"
    vendor_terms:
    - kubectl
    - kube-apiserver
    - kubelet
    - kube-proxy
    - service
    - pod
    complexity_hint:
      node_count: 9
      edge_count: 7
      label_count: 14
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Explain why a working port-forward beside a failing Service
        call localizes the fault to the Service path rather than clearing the application
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the two terminal Pod nodes — the only step the
        two paths share
    accessibility:
      alt_text_seed: Two separate request paths. The Service path, traveled by users,
        runs from client to DNS to the Service's ClusterIP to the service proxy, kube-proxy
        or its equivalent, to the Pod's targetPort, annotated with selector and endpoints
        at the Service; all four of section four's break points live on this path.
        The port-forward path, traveled by the engineer, runs from kubectl to the
        API server via the pods/portforward subresource and on to the Pod's port.
        The two paths share no step except the Pod itself.
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Kubernetes component and subresource names only; no CNCF icons. Technical
        accuracy of the kubelet node is flagged for author review before render.
