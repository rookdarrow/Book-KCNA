    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: flowchart
  figure_spec:
    anchor_id: ch16-fig05-init-sequence-debug-points
    diagram_type: flowchart
    source_ascii: "  init-1 ──────▶ init-2 ──────▶ init-3 ──────▶ app containers\n\
      \    │              │              │                  │\n    ▼             \
      \ ▼              ▼                  ▼\n STATUS:        STATUS:        STATUS:\
      \            STATUS:\n Init:0/3       Init:1/3       Init:2/3           Running\n\
      \n READ WITH:  kubectl logs <pod> -c <init-name>\n ALSO READ:  kubectl describe\
      \ pod <pod>   (exit codes, order, state)\n\n STUCK, NO ERROR ......... ordering\
      \ deadlock — what is it waiting for?\n FAILS ONLY ON RESTART ... non-idempotent\
      \ — it assumed a clean slate\n EXITS NON-ZERO, LOUDLY .. config error — read\
      \ the message, it's telling you\n"
    vendor_terms:
    - kubectl
    - init-container
    - pod
    complexity_hint:
      node_count: 8
      edge_count: 7
      label_count: 13
    pedagogy:
      part_18_criteria_met:
      - temporal_structure
      - distinguishing_alternatives
      learning_outcome: Read an Init:N/M status string to identify which init container
        to inspect, and match an init failure's signature to its cause
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the row of Init:N/M status labels and their alignment
        beneath the containers they name
    accessibility:
      alt_text_seed: 'A left-to-right sequence of three init containers followed by
        the app containers. Beneath each, the Pod status it produces: Init:0/3 under
        the first init container, Init:1/3 under the second, Init:2/3 under the third,
        and Running under the app containers. Below, the commands for reading init
        container logs, and three failure signatures paired with their causes: stuck
        with no error means an ordering deadlock, failing only on restart means non-idempotency,
        and exiting non-zero means a configuration error.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Kubernetes API object names and kubectl command strings only; no CNCF
        logos, icons, or reproduced documentation figures.
- anchor_id: ch16-fig02-ephemeral-container-debug
  tool: diagram_design
  icon_pack: null
  sketch_mode: false
  source_path: figures/sources/ch16-fig02-ephemeral-container-debug.html
  output_paths:
    svg: figures/ch16-fig02-ephemeral-container-debug.svg
    png: figures/ch16-fig02-ephemeral-container-debug.png
    alt: figures/ch16-fig02-ephemeral-container-debug.alt.txt
  validation_rules:
    max_labels: 7
    grayscale_legibility: required
    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: component_diagram
  figure_spec:
    anchor_id: ch16-fig02-ephemeral-container-debug
    diagram_type: component_diagram
    source_ascii: "  (A) EPHEMERAL CONTAINER — into the running Pod\n      ┌───────────\
      \ Pod (unchanged) ───────────┐\n      │  [app: distroless]  + [debug: busybox]│\
      \  ← added, cannot be removed\n      └───────────────────────────────────────┘\n\
      \      ASKS: \"what does the running process see right now?\"\n\n  (B) --copy-to\
      \ — a NEW Pod, original untouched\n      ┌─── Pod (running, untouched) ───┐\
      \   ┌─── Pod-copy ────────┐\n      │  [app: crashing on startup]    │   │  [app:\
      \ entrypoint   │\n      │                                │   │        replaced]\
      \    │\n      └────────────────────────────────┘   └─────────────────────┘\n\
      \      ASKS: \"what would happen if I changed something?\"\n\n  (C) node/ —\
      \ the host, not the workload\n      ┌─── Node ───────────────────────────────┐\n\
      \      │  [debug Pod, host filesystem mounted]  │  ← PLATFORM SCOPE\n      └────────────────────────────────────────┘\n\
      \      ASKS: \"is the machine itself the problem?\"   (see Ch 13 §5)\n"
    vendor_terms:
    - kubectl
    - busybox
    - pod
    - node
    complexity_hint:
      node_count: 9
      edge_count: 2
      label_count: 12
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: Choose among kubectl debug's three shapes by the question
        each one answers, and recognize that --copy-to leaves the original Pod untouched
      fixed_point_emphasis: true
      fixed_point_emphasis_target: panel B's gap between the untouched original Pod
        and its copy
    accessibility:
      alt_text_seed: 'Three panels comparing kubectl debug''s shapes. Panel A: an
        ephemeral debug container added inside an unchanged Pod alongside a distroless
        app container, annotated as unable to be removed; it asks what the running
        process sees now. Panel B: two unconnected Pods side by side, the original
        still running and crashing on startup, and a separate copy with its entrypoint
        replaced; it asks what would happen if something changed. Panel C, shown as
        platform scope: a debug Pod on a Node with the host filesystem mounted; it
        asks whether the machine itself is the problem.'
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 1000
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Kubernetes object names and kubectl flags; busybox named as a generic
        debug image, no logo or icon reproduced.
- anchor_id: ch16-fig04-service-break-points
  tool: diagram_design
  icon_pack: null
  sketch_mode: false
  source_path: figures/sources/ch16-fig04-service-break-points.html
  output_paths:
    svg: figures/ch16-fig04-service-break-points.svg
    png: figures/ch16-fig04-service-break-points.png
    alt: figures/ch16-fig04-service-break-points.alt.txt
  validation_rules:
    max_labels: 7
    grayscale_legibility: required
    palette_conformance: lodestar_brand
    max_width_px: 1200
    min_font_pt: 14
  diagram_type: data_flow
  figure_spec:
    anchor_id: ch16-fig04-service-break-points
    diagram_type: data_flow
    source_ascii: "  client ──▶ DNS name ──▶ Service ──▶ EndpointSlice ──▶ Pod ──▶\
      \ container port\n               │                          │              \
      \          │\n               │                          │                  \
      \      │\n          ┌────┴────┐              ┌──────┴──────┐          ┌──────┴──────┐\n\
      \          │ BREAK 4 │              │  BREAK 1+2  │          │   BREAK 3   │\n\
      \          │ name    │              │  NO READY   │          │ port ≠      │\n\
      \          │ doesn't │              │  ENDPOINTS  │          │ targetPort  │\n\
      \          │ resolve │              │             │          │             │\n\
      \          │ to this │              │ 1 selector  │          │ (endpoints  │\n\
      \          │ Service │              │   mismatch  │          │  ARE ready) │\n\
      \          │         │              │   → slice   │          │             │\n\
      \          │         │              │     empty   │          │             │\n\
      \          │         │              │ 2 not Ready │          │             │\n\
      \          │         │              │   → ready:  │          │             │\n\
      \          │         │              │     false   │          │             │\n\
      \          └─────────┘              └─────────────┘          └─────────────┘\n\
      \n  UPSTREAM of readiness ...... breaks 1 and 2 → NO READY ENDPOINTS\n  DOWNSTREAM\
      \ of readiness .... break 3 → ENDPOINTS READY, request still fails\n  BESIDE\
      \ the whole path ...... break 4 → you never reached this Service at all\n"
    vendor_terms:
    - service
    - endpointslice
    - pod
    - dns
    complexity_hint:
      node_count: 9
      edge_count: 8
      label_count: 12
    pedagogy:
      part_18_criteria_met:
      - spatial_structure
      - distinguishing_alternatives
      - fixed_point
      learning_outcome: 'Locate a Service failure at its position on the request path,
        and distinguish a Service with no ready endpoints (a selector mismatch leaves
        the slice empty; Pods that are not Ready stay listed with ready: false) from
        ready endpoints with a failing request'
      fixed_point_emphasis: true
      fixed_point_emphasis_target: the BREAK 1+2 / NO READY ENDPOINTS callout at the
        EndpointSlice — a Service with no ready endpoints is working exactly as written
    accessibility:
      alt_text_seed: 'A request path runs left to right from client, to DNS name,
        to Service, to EndpointSlice, to Pod, to container port. Three callouts drop
        from it. From the DNS name: break four, the name does not resolve to this
        Service. From the EndpointSlice: breaks one and two, no ready endpoints —
        a selector mismatch leaves the slice empty, while Pods that are not Ready
        stay listed with ready false. From the container port: break three, port does
        not equal targetPort, and here the endpoints are ready. A legend notes that
        breaks one and two sit upstream of readiness and yield no ready endpoints,
        break three sits downstream with ready endpoints and a failing request, and
        break four means this Service was never reached.'
    rendering_hints:
      preferred_orientation: landscape
      grayscale_critical: true
      max_width_px: 1200
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Kubernetes API object names only; no CNCF icons or reproduced documentation
        figures.
