  alt_text: 'A four-row comparison table of autoscalers: HPA moves replica count on
    observed utilization and ships with Kubernetes; KEDA moves replica count on external
    events and schedules; VPA moves per-replica CPU and memory on observed usage and
    is flagged as an add-on that is not shipped; Cluster Autoscaler and Karpenter
    move the node pool in response to unschedulable Pods and underutilized nodes'
