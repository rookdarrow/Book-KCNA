<svg viewBox="0 0 600 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-fig07-title ch17-fig07-desc" width="520" height="638">
<title id="ch17-fig07-title">Scale-to-zero lifecycle of a Knative Service</title>
<desc id="ch17-fig07-desc">A closed cycle showing a Knative Service idle at zero replicas, a request triggering the Knative Pod Autoscaler to scale up a Pod with a running container, several Pods serving traffic, and traffic stopping so the autoscaler scales back down to zero replicas.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
</defs>

<rect width="100%" height="100%" fill="#F5EFE4"></rect>

<!-- ============ ARROWS (drawn before boxes) ============ -->
<line x1="204" y1="128" x2="204" y2="184" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
<line x1="204" y1="304" x2="204" y2="360" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
<line x1="204" y1="456" x2="204" y2="512" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
<path d="M140,632 V640 Q140,648 132,648 H40 Q32,648 32,640 V88 Q32,80 40,80 H64" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
<line x1="344" y1="244" x2="368" y2="244" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
<line x1="344" y1="408" x2="368" y2="408" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>

<!-- ============ NODES ============ -->
<rect x="64" y="32" width="280" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>

<rect x="64" y="184" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>
<rect x="368" y="184" width="176" height="120" rx="6" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"></rect>
<rect x="396" y="220" width="120" height="56" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>

<rect x="64" y="360" width="280" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>
<rect x="388" y="376" width="176" height="96" rx="6" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="1" stroke-dasharray="4,3"></rect>
<rect x="368" y="360" width="176" height="96" rx="6" fill="#FFFFFF" stroke="#1F4A4E" stroke-width="1"></rect>
<rect x="396" y="396" width="120" height="48" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>

<rect x="64" y="512" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>

<!-- ============ TEXT ============ -->
<text>
<tspan x="88" y="56" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">IDLE</tspan>
<tspan x="88" y="84" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Knative Service</tspan>
<tspan x="88" y="108" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">replicas: 0 — nothing running</tspan>
</text>

<text>
<tspan x="88" y="208" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#1F4A4E">REQUEST ARRIVES →</tspan>
<tspan x="88" y="236" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Knative Service</tspan>
<tspan x="88" y="260" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">replicas: 0 → N</tspan>
<tspan x="88" y="284" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">(KPA scales up)</tspan>
</text>

<text>
<tspan x="384" y="204" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">Pod</tspan>
<tspan x="456" y="252" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#0B1E3B">container</tspan>
</text>

<text>
<tspan x="88" y="384" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#8A8D90">SERVING</tspan>
<tspan x="88" y="412" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Knative Service</tspan>
<tspan x="88" y="436" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">replicas: N</tspan>
</text>

<text>
<tspan x="384" y="380" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">Pod</tspan>
<tspan x="456" y="424" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#0B1E3B">container</tspan>
<tspan x="468" y="488" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" letter-spacing="0.08em" fill="#8A8D90">+ MORE PODS</tspan>
</text>

<text>
<tspan x="88" y="536" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#1F4A4E">TRAFFIC STOPS →</tspan>
<tspan x="88" y="564" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Knative Service</tspan>
<tspan x="88" y="588" font-family="'Fira Mono', monospace" font-size="14" fill="#0B1E3B">replicas: N → 0</tspan>
<tspan x="88" y="612" font-family="'Fira Mono', monospace" font-size="14" fill="#8A8D90">(KPA scales down)</tspan>
</text>

<text x="300" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" fill="#0B1E3B">
<tspan x="300" y="668">The containers and Pods are real at every populated step —</tspan>
<tspan x="300" y="692">"serverless" describes the LIFECYCLE, not their absence.</tspan>
</text>
</svg>