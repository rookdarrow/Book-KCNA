<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Decision, Made Four Times</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5EFE4;
      --color-ink:    #0B1E3B;
      --color-muted:  #1F4A4E;
      --color-soft:   #8A8D90;
      --color-accent: #B58B3E;
      --font-serif:   'Roboto Slab', serif;
      --font-sans:    'Fira Sans', system-ui, sans-serif;
      --font-mono:    'Fira Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 520px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2vw + 0.9rem, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ch 17 &middot; Kubernetes Pluggability</p>
    <h1>One Decision, Made Four Times</h1>

    <svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-zenith-one-pluggability-story-title ch17-zenith-one-pluggability-story-desc">
      <title id="ch17-zenith-one-pluggability-story-title">Kubernetes pluggability: one socket, four instances</title>
      <desc id="ch17-zenith-one-pluggability-story-desc">Two stacked boxes show Kubernetes defines what must be true connected by an arrow labeled the socket to somebody else supplies the thing, paired with a list showing CRI, CNI, CSI, and CRDs as four instances of that one socket relation, not four separate decisions.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ===== THE SHAPE ===== -->
      <text x="300" y="48" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">THE SHAPE</text>
      <line x1="260" y1="56" x2="340" y2="56" stroke="#8A8D90" stroke-width="0.8"/>

      <!-- focal relation: the socket -->
      <line x1="300" y1="156" x2="300" y2="184" stroke="#B58B3E" stroke-width="1.2"/>
      <rect x="236" y="192" width="128" height="24" rx="4" fill="#F5EFE4"/>
      <text x="300" y="208" text-anchor="middle" fill="#B58B3E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.04em">(the socket)</text>
      <line x1="300" y1="224" x2="300" y2="252" stroke="#B58B3E" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- box 1 -->
      <rect x="100" y="76" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
      <text x="300" y="108" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Kubernetes defines</text>
      <text x="300" y="132" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.02em">WHAT MUST BE TRUE</text>

      <!-- box 2 -->
      <rect x="100" y="252" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"/>
      <text x="300" y="284" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Somebody else</text>
      <text x="300" y="308" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.02em">SUPPLIES THE THING</text>

      <!-- annotation: relation to ch17-fig02 -->
      <text x="300" y="356" text-anchor="middle" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">^</text>
      <text x="300" y="380" text-anchor="middle" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">the four sockets of ch17-fig02, collapsed into</text>
      <text x="300" y="404" text-anchor="middle" fill="#8A8D90" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">the single relation they were always instances of</text>

      <line x1="60" y1="440" x2="540" y2="440" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>

      <!-- ===== THE EVIDENCE ===== -->
      <text x="300" y="468" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">THE EVIDENCE</text>
      <line x1="260" y1="476" x2="340" y2="476" stroke="#8A8D90" stroke-width="0.8"/>

      <text x="180" y="512" text-anchor="start" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500">CRI</text>
      <text x="420" y="512" text-anchor="end" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(Ch 2 &#167;4)</text>

      <text x="180" y="544" text-anchor="start" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500">CNI</text>
      <text x="420" y="544" text-anchor="end" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(Ch 9 &#167;1)</text>

      <text x="180" y="576" text-anchor="start" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500">CSI</text>
      <text x="420" y="576" text-anchor="end" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(Ch 11 &#167;5)</text>

      <text x="180" y="608" text-anchor="start" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500">CRDs</text>
      <text x="420" y="608" text-anchor="end" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(Ch 6 &#167;8)</text>

      <text x="300" y="652" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600">Four instances. Not four decisions.</text>

      <text x="300" y="684" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">One decision, made four times</text>
      <text x="300" y="708" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">because it was right four times.</text>
    </svg>
  </div>
</body>
</html>
