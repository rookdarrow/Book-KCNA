    anchor_id: ch17-fig03-mesh-data-vs-control-plane
    diagram_type: k8s_architecture
    source_ascii: "   ############################################################\n\
      \   #  THE CLUSTER'S CONTROL PLANE            ( Ch 3 §2 )      #\n   #  kube-apiserver\
      \ . etcd . scheduler . controller-manager  #\n   #  Manages: Kubernetes OBJECTS\
      \                             #\n   ############################################################\n\
      \                    (a different thing entirely)\n\n\n   +----------------------------------------------------------+\n\
      \   |  THE MESH'S CONTROL PLANE                                |\n   |  Distributes\
      \ policy + certificates to the proxies        |\n   |  Manages: PROXIES    \
      \                                    |\n   +----------------------------------------------------------+\n\
      \              |                 |                 |\n              v      \
      \           v                 v\n   ------------------------------------------------------------\n\
      \     THE MESH'S DATA PLANE  -- the proxies themselves\n     Every byte between\
      \ services passes through here\n\n     SIDECAR MODE                 |  AMBIENT\
      \ MODE\n                                  |\n     +--------------+         \
      \    |  +--------------+\n     | Pod          |             |  | Pod       \
      \   |\n     |  app <-> [E] |             |  |  app         |\n     +--------------+\
      \             |  +--------------+\n     +--------------+             |  +--------------+\n\
      \     | Pod          |             |  | Pod          |\n     |  app <-> [E]\
      \ |             |  |  app         |\n     +--------------+             |  +--------------+\n\
      \                                  |         |\n     one Envoy per Pod     \
      \       |    [ztunnel]  per-NODE L4\n                                  |   \
      \ [waypoint] per-NS  L7 (Envoy)\n   ------------------------------------------------------------\n\
      \n     [E] = Envoy.  Both columns are the SAME data plane,\n           arranged\
      \ two ways -- not two products.\n"
    vendor_terms:
    - istio
    - envoy
    - ztunnel
    - waypoint
    - kubernetes
    - etcd
    - kube-apiserver
    complexity_hint:
      node_count: 10
      edge_count: 7
      label_count: 16
    pedagogy:
      part_18_criteria_met:
      - distinguishing_alternatives
      - spatial_structure
      - fixed_point
      learning_outcome: Distinguish a service mesh's data plane from its control plane,
        and both from the cluster's control plane; recognise sidecar and ambient as
        two arrangements of one data plane
      fixed_point_emphasis: true
      fixed_point_emphasis_target: every Envoy instance — the [E] sidecars and the
        ambient waypoint — accented identically to show one engine in both modes
    accessibility:
      alt_text_seed: 'Three separate layers: the cluster''s control plane drawn apart
        at the top with no connection to anything, the mesh''s control plane below
        it sending arrows down to the mesh''s data plane, and the data plane split
