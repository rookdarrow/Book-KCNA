        an optional per-namespace Envoy waypoint'
    rendering_hints:
      preferred_orientation: portrait
      grayscale_critical: true
      max_width_px: 1000
    copyright_clearance:
      rights_holders:
      - cncf
      clearance: own_interpretation
      notes: Istio and Envoy are CNCF projects; architecture redrawn from published
        descriptions in Lodestar style, no upstream figure traced and no project logos
        used.
