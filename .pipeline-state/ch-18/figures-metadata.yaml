  alt_text: A trace waterfall on a four-second time axis. A root span for the API
    gateway spans the full width; nested beneath it are auth-svc at 120 milliseconds
    with user-store at 85 milliseconds inside it, and catalog-svc at 3700 milliseconds
    containing a cache call of 8 milliseconds and a pricing service database call
    of 3650 milliseconds, which accounts for almost all of the elapsed time.
