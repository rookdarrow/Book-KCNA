<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How three instruments answer one question</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F5EFE4;
      --color-ink:     #0B1E3B;
      --color-muted:   #1F4A4E;
      --color-soft:    #8A8D90;
      --color-accent:  #B58B3E;
      --font-slab: 'Roboto Slab', serif;
      --font-sans: 'Fira Sans', sans-serif;
      --font-mono: 'Fira Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 640px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-slab);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; display: block; }

    .caption {
      font-family: var(--font-sans);
      font-style: italic;
      font-size: 16px;
      color: var(--color-muted);
      text-align: center;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Concept Map &middot; Ch. 18</p>
    <h1>How three instruments answer one question</h1>

    <svg viewBox="0 0 560 696" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="zenith-instruments-title zenith-instruments-desc">
      <title id="zenith-instruments-title">How three instruments answer one question</title>
      <desc id="zenith-instruments-desc">One question at the top asks whether the service is doing what users expect. Three boxes below point up into it: a metric answering whether, a trace answering where, and a log answering what. A baggage box beneath connects to all three, making them about the same request rather than three separate stories.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"/>

      <!-- ================= CONNECTORS (drawn before nodes) ================= -->

      <!-- "answers" arrows: instrument top -> question bottom, muted teal, arrowhead -->
      <line x1="112" y1="224" x2="112" y2="160" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="224" x2="280" y2="160" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="224" x2="448" y2="160" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- "grounds" ties: instrument bottom -> baggage top, fog, no arrowhead -->
      <line x1="112" y1="384" x2="112" y2="448" stroke="#8A8D90" stroke-width="1"/>
      <line x1="280" y1="384" x2="280" y2="448" stroke="#8A8D90" stroke-width="1"/>
      <line x1="448" y1="384" x2="448" y2="448" stroke="#8A8D90" stroke-width="1"/>

      <!-- ================= QUESTION (top) ================= -->
      <rect x="40" y="48" width="480" height="112" rx="8" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="280" y="80" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">&ldquo;Is the service doing</text>
      <text x="280" y="104" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">what users expect</text>
      <text x="280" y="128" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">it to be doing?&rdquo;</text>

      <!-- ================= INSTRUMENTS ================= -->

      <!-- METRIC -->
      <rect x="40" y="224" width="144" height="160" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="112" y="260" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WHETHER</text>
      <text x="112" y="284" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">METRIC</text>
      <line x1="56" y1="296" x2="168" y2="296" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="112" y="320" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">error rate</text>
      <text x="112" y="340" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">crossed 2%</text>
      <text x="112" y="360" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">at 02:07</text>

      <!-- TRACE -->
      <rect x="208" y="224" width="144" height="160" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="280" y="260" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WHERE</text>
      <text x="280" y="284" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">TRACE</text>
      <line x1="224" y1="296" x2="336" y2="296" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="280" y="320" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">3.65s of 4s</text>
      <text x="280" y="340" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">in pricing-svc&rsquo;s</text>
      <text x="280" y="360" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">query</text>

      <!-- LOG -->
      <rect x="376" y="224" width="144" height="160" rx="6" fill="rgba(11,30,59,0.05)" stroke="#0B1E3B" stroke-width="1"/>
      <text x="448" y="260" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WHAT</text>
      <text x="448" y="284" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">LOG</text>
      <line x1="392" y1="296" x2="504" y2="296" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"/>
      <text x="448" y="320" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">the line the</text>
      <text x="448" y="340" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">code actually</text>
      <text x="448" y="360" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">emitted</text>

      <!-- ================= BAGGAGE (focal) ================= -->
      <rect x="40" y="448" width="480" height="112" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"/>
      <text x="280" y="480" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle" letter-spacing="0.06em">BAGGAGE</text>
      <text x="280" y="504" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">what makes all three about the same request</text>
      <text x="280" y="528" fill="#0B1E3B" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">rather than three separate stories</text>

    </svg>

    <p class="caption">Not four topics. One question, four resolutions.</p>
  </div>
</body>
</html>
