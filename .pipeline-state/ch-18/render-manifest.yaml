      \  start→finish\n  │\n  ├─┌──────────────┐\n  │ │ auth-svc      120ms      \
      \                            │\n  │ └─┬────────────┘\n  │   └─┌────────────┐\n\
      \  │     │ user-store   85ms                                │\n  │     └────────────┘\n\
      \  │\n  └─────┌──────────────────────────────────────────────┐\n        │ catalog-svc\
      \                        3700ms    │\n        └─┬────────────────────────────────────────────┘\n\
      \          │\n          ├─┌───────┐\n          │ │ cache   8ms             \
      \                     │\n          │ └───────┘\n          │\n          └─┌──────────────────────────────────────────┐\n\
      \            │ pricing-svc → database         3650ms    │ ◄── here\n       \
      \     └──────────────────────────────────────────┘\n\nSeven services. Seven\
      \ sets of logs, each internally complete.\nOnly the trace ID makes them one\
      \ story — and only then does\n\"where did the 4 seconds go?\" have an answer.\n"
