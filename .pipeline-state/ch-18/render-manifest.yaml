      │      ┌───────────────┐       │\n│      │ AGENT (Daemon │───────┼──────┐\n\
      │      │ Set: 1/node)  │       │      │\n│      └───────────────┘       │  \
      \    │\n└──────────────────────────────┘      │\n                          \
      \             │\n┌─ 2. SIDECAR IN THE POD ──────┐      │\n│  NODE          \
      \              │      │\n│  ┌────────────────────────┐  │      ▼\n│  │ Pod \
      \                   │  │  ┌────────┐\n│  │ ┌─────┐  ┌───────────┐ │  │  │ LOGGING│\n\
      │  │ │ app │─►│ sidecar   │─┼──┼─►│ BACKEND│\n│  │ └─────┘  │ collector │ │\
      \  │  │        │\n│  │          └───────────┘ │  │  │(outside│\n│  └────────────────────────┘\
      \  │  │  k8s)  │\n│   one collector PER POD      │  │        │\n└──────────────────────────────┘\
      \  │        │\n                                   │        │\n┌─ 3. APP PUSHES\
      \ DIRECTLY ─────┐  │        │\n│  NODE                        │  │        │\n\
      │  ┌────────────────────────┐  │  │        │\n│  │ Pod                    │\
      \  │  │        │\n│  │ ┌─────────────────┐    │  │  │        │\n│  │ │ app w/\
      \ logging  │────┼──┼──┼───────►│\n│  │ │ library         │    │  │  └────────┘\n\
      │  │ └─────────────────┘    │  │\n│  └────────────────────────┘  │   app must\
