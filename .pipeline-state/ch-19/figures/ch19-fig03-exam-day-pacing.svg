<svg viewBox="0 0 760 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch19-fig03-exam-day-pacing-title ch19-fig03-exam-day-pacing-desc" width="640" height="843">
      <title id="ch19-fig03-exam-day-pacing-title">Exam-day pacing: the two-pass split</title>
      <desc id="ch19-fig03-exam-day-pacing-desc">Ninety-minute exam timeline split at fifty-four minutes; the longer first-pass segment answers and flags every question, and the shorter reserved second-pass segment revisits only flagged ones.</desc>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Exam-clock container -->
      <rect x="180" y="120" width="560" height="720" rx="8" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>

      <!-- Hairlines separating pass rules from exam-day guidance -->
      <line x1="204" y1="360" x2="716" y2="360" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
      <line x1="204" y1="744" x2="716" y2="744" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>

      <!-- Time axis -->
      <line x1="140" y1="120" x2="140" y2="840" stroke="#8A8D90" stroke-width="1"></line>
      <line x1="140" y1="120" x2="180" y2="120" stroke="#8A8D90" stroke-width="1"></line>
      <line x1="140" y1="840" x2="180" y2="840" stroke="#8A8D90" stroke-width="1"></line>
      <circle cx="140" cy="120" r="4" fill="#0B1E3B"></circle>
      <circle cx="140" cy="840" r="4" fill="#0B1E3B"></circle>

      <!-- Focal: the 54-minute division rule -->
      <line x1="140" y1="552" x2="748" y2="552" stroke="#B58B3E" stroke-width="2.5"></line>
      <circle cx="140" cy="552" r="6" fill="#B58B3E"></circle>
      <rect x="388" y="540" width="144" height="24" rx="4" fill="#FFFFFF" stroke="#B58B3E" stroke-width="1.2"></rect>

      <!-- Axis time labels -->
      <text x="124" y="124" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E" text-anchor="end" letter-spacing="0.04em">0 MIN<tspan x="124" y="556" font-weight="700" fill="#B58B3E">54 MIN</tspan><tspan x="124" y="844" font-weight="400" fill="#1F4A4E">90 MIN</tspan></text>

      <!-- Badge on the divider (focal) -->
      <text x="460" y="556" font-family="'Fira Mono', monospace" font-size="14" font-weight="700" fill="#B58B3E" text-anchor="middle" letter-spacing="0.08em">54-MIN SPLIT</text>

      <!-- FIRST PASS: name, rules, rate formula, exam-day guidance -->
      <text x="204" y="244" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#1F4A4E" letter-spacing="0.12em">0–54 MIN<tspan x="204" y="276" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B" letter-spacing="0">FIRST PASS</tspan><tspan x="204" y="308" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B" letter-spacing="0">Every question, once — answer everything, flag freely.</tspan><tspan x="204" y="332" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E" letter-spacing="0">rate = 0.6 × clock ÷ count</tspan><tspan x="204" y="388" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" font-weight="400" fill="#8A8D90" letter-spacing="0">Read the count off the screen and divide —</tspan><tspan x="204" y="408" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" font-weight="400" fill="#8A8D90" letter-spacing="0">do not memorize a seconds-per-question number.</tspan></text>

      <!-- SECOND PASS: name, rules, reserve formula, submit guidance -->
      <text x="204" y="604" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#1F4A4E" letter-spacing="0.12em">54–90 MIN<tspan x="204" y="636" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B" letter-spacing="0">SECOND PASS</tspan><tspan x="204" y="668" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B" letter-spacing="0">Flagged questions only — full discriminator work,</tspan><tspan x="204" y="692" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B" letter-spacing="0">change only with a reason.</tspan><tspan x="204" y="716" font-family="'Fira Mono', monospace" font-size="14" font-weight="400" fill="#1F4A4E" letter-spacing="0">reserve = 0.4 × clock</tspan><tspan x="204" y="772" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="16" font-weight="400" fill="#8A8D90" letter-spacing="0">Submit with time on the clock.</tspan></text>

      <!-- Legend -->
      <line x1="40" y1="884" x2="720" y2="884" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>
      <circle cx="52" cy="932" r="4" fill="#0B1E3B"></circle>
      <circle cx="280" cy="932" r="6" fill="#B58B3E"></circle>
      <text x="40" y="908" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#1F4A4E" letter-spacing="0.12em">LEGEND<tspan x="68" y="936" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#1F4A4E" letter-spacing="0">Time mark</tspan><tspan x="300" y="936" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#B58B3E" letter-spacing="0">Focal — 54-min split</tspan><tspan x="40" y="964" font-family="'Fira Sans', sans-serif" font-style="italic" font-size="14" font-weight="400" fill="#8A8D90" letter-spacing="0">Segment length is proportional to elapsed time.</tspan></text>
    </svg>