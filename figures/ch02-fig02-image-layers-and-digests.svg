<svg viewBox="0 0 720 772" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch02-fig02-image-layers-and-digests-title ch02-fig02-image-layers-and-digests-desc" width="640" height="687">
      <title id="ch02-fig02-image-layers-and-digests-title">Image Layers and Content Digests</title>
      <desc id="ch02-fig02-image-layers-and-digests-desc">Two container images share a single stored base layer on the left; on the right a movable :v2 tag resolves today to an immutable content digest, while a dashed arrow shows the same tag label can resolve to different content next week.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ================= ZONE A: LAYERS ================= -->
      <rect x="40" y="44" width="640" height="236" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <rect x="64" y="48" width="88" height="20" rx="4" fill="#F5EFE4"></rect>
      <text x="68" y="64" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">LAYERS</text>

      <!-- stack connector: shared base layer, joined -->
      <line x1="340" y1="180" x2="380" y2="180" stroke="#1F4A4E" stroke-width="1"></line>
      <line x1="340" y1="188" x2="380" y2="188" stroke="#1F4A4E" stroke-width="1"></line>

      <!-- stack A -->
      <text x="220" y="96" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">IMAGE A</text>
      <rect x="100" y="112" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <line x1="100" y1="160" x2="340" y2="160" stroke="#0B1E3B" stroke-opacity="0.2" stroke-width="0.8"></line>
      <text x="220" y="140" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">app</text>
      <text x="220" y="188" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">shared base</text>

      <!-- stack B -->
      <text x="500" y="96" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">IMAGE B</text>
      <rect x="380" y="112" width="240" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <line x1="380" y1="160" x2="620" y2="160" stroke="#0B1E3B" stroke-opacity="0.2" stroke-width="0.8"></line>
      <text x="500" y="140" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">app</text>
      <text x="500" y="188" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">shared base</text>

      <text x="360" y="240" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">both manifests name the same base layer → stored once</text>

      <!-- ================= ZONE B: IDENTITY ================= -->
      <rect x="40" y="304" width="640" height="368" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <rect x="64" y="308" width="104" height="20" rx="4" fill="#F5EFE4"></rect>
      <text x="68" y="324" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">IDENTITY</text>

      <!-- arrows: drawn before their destination/source nodes -->
      <line x1="268" y1="520" x2="268" y2="448" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="572" y1="520" x2="572" y2="448" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-accent)"></line>

      <!-- digest card -->
      <rect x="80" y="344" width="376" height="104" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1.2"></rect>
      <rect x="88" y="352" width="72" height="20" rx="4" fill="none" stroke="#1F4A4E" stroke-width="0.8"></rect>
      <text x="124" y="364" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">DIGEST</text>
      <rect x="344" y="352" width="104" height="20" rx="4" fill="none" stroke="#0B1E3B" stroke-width="0.8"></rect>
      <text x="396" y="364" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">IMMUTABLE</text>
      <text x="268" y="400" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">sha256:9f2c…be41</text>
      <text x="268" y="424" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">digest = content hash</text>

      <!-- ghost node: focal — next week's tag can resolve here instead -->
      <rect x="500" y="344" width="144" height="104" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="4,4"></rect>
      <text x="572" y="396" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">a different</text>
      <text x="572" y="420" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">image</text>

      <!-- tag: today -->
      <rect x="208" y="520" width="120" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="268" y="548" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">:v2</text>
      <text x="268" y="592" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">today</text>

      <!-- tag: next week (focal, via its dashed resolution arrow) -->
      <rect x="512" y="520" width="120" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="572" y="548" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Mono', monospace" font-size="16" font-weight="500">:v2</text>
      <text x="572" y="592" text-anchor="middle" fill="#1F4A4E" font-family="'Fira Sans', sans-serif" font-size="16">next week</text>

      <text x="360" y="624" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">a tag is a LABEL — it can be</text>
      <text x="360" y="648" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">moved to point at a different image</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="696" x2="680" y2="696" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="40" y="712" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.14em">LEGEND</text>

      <line x1="40" y1="736" x2="64" y2="736" stroke="#1F4A4E" stroke-width="1.2"></line>
      <text x="72" y="740" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">RESOLVES NOW</text>

      <line x1="300" y1="736" x2="324" y2="736" stroke="#B58B3E" stroke-width="1.2" stroke-dasharray="4,4"></line>
      <text x="332" y="740" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">TAG CAN MOVE</text>
    </svg>