<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ns-vs-cluster-scoped-title ns-vs-cluster-scoped-desc" width="480" height="560">
    <title id="ns-vs-cluster-scoped-title">Namespaced vs. cluster-scoped Kubernetes resources</title>
    <desc id="ns-vs-cluster-scoped-desc">Node, PersistentVolume, StorageClass, and Namespace sit in cluster scope outside two namespace boxes, team-a and team-b, each holding its own identically named Deployment, Service, ConfigMap, and Secret.</desc>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- Outer cluster-scope boundary -->
    <rect x="24" y="32" width="552" height="580" rx="8" fill="rgba(11,30,59,0.015)" stroke="rgba(11,30,59,0.45)" stroke-width="1.2" stroke-dasharray="6,4"></rect>
    <rect x="40" y="24" width="148" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="114" y="36" text-anchor="middle" fill="rgba(11,30,59,0.55)" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">CLUSTER SCOPE</text>

    <!-- Focal group: the four cluster-scoped resources -->
    <rect x="56" y="64" width="488" height="172" rx="8" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <rect x="72" y="56" width="256" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="200" y="68" text-anchor="middle" fill="#B58B3E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">CLUSTER-SCOPED RESOURCES</text>

    <!-- Chip: Node -->
    <rect x="72" y="96" width="220" height="48" rx="6" fill="rgba(11,30,59,0.04)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"></rect>
    <text x="182" y="126" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Node</text>

    <!-- Chip: PersistentVolume -->
    <rect x="308" y="96" width="220" height="48" rx="6" fill="rgba(11,30,59,0.04)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"></rect>
    <text x="418" y="126" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">PersistentVolume</text>

    <!-- Chip: StorageClass -->
    <rect x="72" y="160" width="220" height="60" rx="6" fill="rgba(11,30,59,0.04)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"></rect>
    <text x="182" y="196" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">StorageClass</text>

    <!-- Chip: Namespace (with clarifying sublabel) -->
    <rect x="308" y="160" width="220" height="60" rx="6" fill="rgba(11,30,59,0.04)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"></rect>
    <text x="418" y="182" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Namespace</text>
    <text x="418" y="206" text-anchor="middle" fill="#8A8D90" font-family="'Fira Mono', monospace" font-size="14">(itself cluster-scoped)</text>

    <!-- Namespace zone: team-a -->
    <rect x="56" y="264" width="232" height="256" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.14)" stroke-width="0.8"></rect>
    <rect x="72" y="256" width="188" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="166" y="268" text-anchor="middle" fill="rgba(11,30,59,0.55)" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em">NAMESPACE: TEAM-A</text>

    <text x="72" y="320" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Deployment</text>
    <text x="272" y="320" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">database</text>

    <text x="72" y="376" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Service</text>
    <text x="272" y="376" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">database</text>

    <text x="72" y="432" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">ConfigMap</text>
    <text x="272" y="432" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">settings</text>

    <text x="72" y="488" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Secret</text>
    <text x="272" y="488" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">creds</text>

    <!-- Namespace zone: team-b -->
    <rect x="312" y="264" width="232" height="256" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.14)" stroke-width="0.8"></rect>
    <rect x="328" y="256" width="188" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="422" y="268" text-anchor="middle" fill="rgba(11,30,59,0.55)" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em">NAMESPACE: TEAM-B</text>

    <text x="328" y="320" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Deployment</text>
    <text x="528" y="320" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">database</text>

    <text x="328" y="376" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Service</text>
    <text x="528" y="376" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">database</text>

    <text x="328" y="432" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">ConfigMap</text>
    <text x="528" y="432" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">settings</text>

    <text x="328" y="488" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500">Secret</text>
    <text x="528" y="488" text-anchor="end" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">creds</text>

    <!-- Editorial callout: why identical names don't collide -->
    <path d="M 200,540 Q 186,530 172,520" fill="none" stroke="rgba(11,30,59,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="172" cy="520" r="2.5" fill="#0B1E3B"></circle>
    <path d="M 400,540 Q 414,530 428,520" fill="none" stroke="rgba(11,30,59,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="428" cy="520" r="2.5" fill="#0B1E3B"></circle>
    <text x="300" y="552" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">Same names in both namespaces —</text>
    <text x="300" y="572" text-anchor="middle" fill="#0B1E3B" font-family="'Fira Sans', sans-serif" font-size="16" font-style="italic">the namespace boundary keeps them from colliding.</text>

    <!-- Legend -->
    <line x1="24" y1="660" x2="576" y2="660" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="24" y="676" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em">LEGEND</text>

    <line x1="104" y1="672" x2="128" y2="672" stroke="rgba(11,30,59,0.45)" stroke-width="1.2" stroke-dasharray="6,4"></line>
    <text x="136" y="676" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">CLUSTER SCOPE</text>

    <rect x="288" y="664" width="20" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="316" y="676" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">FOCAL</text>

    <rect x="384" y="664" width="20" height="16" rx="2" fill="rgba(11,30,59,0.04)" stroke="rgba(11,30,59,0.30)" stroke-width="0.8"></rect>
    <text x="412" y="676" fill="#1F4A4E" font-family="'Fira Mono', monospace" font-size="14">NAMESPACED</text>
  </svg>