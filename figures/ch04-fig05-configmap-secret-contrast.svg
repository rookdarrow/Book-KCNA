<svg viewBox="0 0 680 728" width="680" height="728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmsecret-title cmsecret-desc">
        <title id="cmsecret-title">ConfigMap vs. Secret: what differs, what does not</title>
        <desc id="cmsecret-desc">A four-row comparison of ConfigMap and Secret covering intended contents, how a Pod consumes them, how they are stored, and what each adds. The storage row reads unencrypted in etcd for both, with by default noted on the Secret side.</desc>

        <rect width="680" height="728" fill="#F5EFE4"></rect>

        <!-- Header banner row -->
        <rect x="24" y="24" width="140" height="56" rx="6" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="180" y="24" width="230" height="56" rx="6" fill="#0B1E3B"></rect>
        <rect x="426" y="24" width="230" height="56" rx="6" fill="#0B1E3B"></rect>
        <text x="94" y="57" text-anchor="middle" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.10em" fill="#1F4A4E">ATTRIBUTE</text>
        <text x="295" y="57" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">ConfigMap</text>
        <text x="541" y="57" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">Secret</text>

        <!-- Row 1: Intended contents -->
        <rect x="24" y="96" width="140" height="84" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="180" y="96" width="230" height="84" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="426" y="96" width="230" height="84" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>

        <text x="94" y="126" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Intended</text>
        <text x="94" y="146" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">contents</text>

        <text x="196" y="126" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B">non-confidential</text>
        <text x="196" y="146" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B">key-value data</text>

        <text x="442" y="126" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B">small amounts of</text>
        <text x="442" y="146" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B">sensitive data</text>
        <text x="442" y="166" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="400" fill="#0B1E3B">(password, token, key)</text>

        <!-- Row 2: Consumed by a Pod as -->
        <rect x="24" y="192" width="140" height="184" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="180" y="192" width="230" height="184" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="426" y="192" width="230" height="184" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>

        <text x="94" y="278" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">Consumed by</text>
        <text x="94" y="298" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">a Pod as</text>

        <!-- ConfigMap bullets -->
        <circle cx="198" cy="217" r="2.5" fill="#0B1E3B"></circle>
        <text x="212" y="222" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">command and args</text>
        <circle cx="198" cy="257" r="2.5" fill="#0B1E3B"></circle>
        <text x="212" y="262" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">environment variables</text>
        <circle cx="198" cy="297" r="2.5" fill="#0B1E3B"></circle>
        <text x="212" y="302" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">file in a read-only</text>
        <text x="212" y="322" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">volume</text>
        <circle cx="198" cy="337" r="2.5" fill="#0B1E3B"></circle>
        <text x="212" y="342" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">read via the</text>
        <text x="212" y="362" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">Kubernetes API</text>

        <!-- Secret bullets -->
        <circle cx="444" cy="217" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="222" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">command and args</text>
        <circle cx="444" cy="257" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="262" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">environment variables</text>
        <circle cx="444" cy="297" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="302" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">file in a volume</text>
        <circle cx="444" cy="337" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="342" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">read via the</text>
        <text x="458" y="362" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">Kubernetes API</text>

        <!-- Row 3: Stored (focal) -->
        <rect x="24" y="388" width="140" height="84" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="26" y="392" width="4" height="76" fill="#B58B3E"></rect>
        <rect x="180" y="388" width="230" height="84" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
        <rect x="426" y="388" width="230" height="84" rx="4" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>

        <text x="94" y="436" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">Stored</text>

        <text x="196" y="418" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#B58B3E">unencrypted, in <tspan font-family="'Fira Mono', monospace" font-weight="700">etcd</tspan></text>

        <text x="442" y="418" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#B58B3E">unencrypted, in <tspan font-family="'Fira Mono', monospace" font-weight="700">etcd</tspan></text>
        <text x="442" y="442" font-family="'Fira Sans', sans-serif" font-size="14" font-weight="600" fill="#B58B3E">(by default)</text>

        <!-- Row 4: What it adds -->
        <rect x="24" y="484" width="140" height="148" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="180" y="484" width="230" height="148" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>
        <rect x="426" y="484" width="230" height="148" rx="4" fill="#FFFFFF" stroke="rgba(11,30,59,0.12)" stroke-width="1"></rect>

        <text x="94" y="552" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">What it</text>
        <text x="94" y="572" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">adds</text>

        <text x="196" y="542" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">nothing — the docs state</text>
        <text x="196" y="562" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">plainly that it provides</text>
        <text x="196" y="582" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">no secrecy or encryption</text>

        <circle cx="444" cy="509" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="514" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">a distinct object type</text>
        <circle cx="444" cy="551" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="556" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">a distinct</text>
        <text x="458" y="576" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">access-control surface</text>
        <circle cx="444" cy="593" r="2.5" fill="#0B1E3B"></circle>
        <text x="458" y="598" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">a defined place to attach</text>
        <text x="458" y="618" font-family="'Fira Sans', sans-serif" font-size="14" fill="#0B1E3B">encryption at rest</text>

        <!-- Legend -->
        <line x1="24" y1="656" x2="656" y2="656" stroke="#8A8D90" stroke-width="0.8"></line>
        <text x="24" y="676" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.14em" fill="#1F4A4E">LEGEND</text>
        <rect x="24" y="686" width="14" height="12" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1"></rect>
        <text x="46" y="696" font-family="'Fira Mono', monospace" font-size="14" fill="#1F4A4E">FOCAL — SAME VALUE IN BOTH COLUMNS</text>
      </svg>