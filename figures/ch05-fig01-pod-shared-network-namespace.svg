<svg viewBox="0 0 480 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pod-shared-netns-title pod-shared-netns-desc" width="560" height="672">
    <title id="pod-shared-netns-title">Pod network namespace: one IP, shared localhost</title>
    <desc id="pod-shared-netns-desc">A Node contains one Pod; the Pod carries a single IP address on its own boundary and holds two containers, app and helper, which communicate over localhost and both read and write a shared volume inside the Pod.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- Node boundary -->
    <rect x="24" y="48" width="432" height="408" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.20)" stroke-width="0.8" stroke-dasharray="6,4"></rect>
    <rect x="40" y="52" width="60" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="70" y="66" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NODE</text>

    <!-- Pod boundary (network namespace) -->
    <rect x="40" y="104" width="400" height="320" rx="8" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.35)" stroke-width="0.8" stroke-dasharray="4,3"></rect>
    <rect x="56" y="108" width="52" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="82" y="122" fill="#1F4A4E" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">POD</text>

    <!-- connectors, drawn before nodes -->
    <line x1="184" y1="200" x2="296" y2="200" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"></line>
    <path d="M124,248 V280 Q124,288 132,288 H200 Q208,288 208,296 V328" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"></path>
    <path d="M356,248 V280 Q356,288 348,288 H280 Q272,288 272,296 V328" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"></path>

    <!-- container: app -->
    <rect x="64" y="152" width="120" height="96" rx="6" fill="#F5EFE4"></rect>
    <rect x="64" y="152" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="124" y="205" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">app</text>

    <!-- container: helper -->
    <rect x="296" y="152" width="120" height="96" rx="6" fill="#F5EFE4"></rect>
    <rect x="296" y="152" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="356" y="205" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">helper</text>

    <!-- shared volume -->
    <rect x="140" y="328" width="200" height="64" rx="6" fill="#F5EFE4"></rect>
    <rect x="140" y="328" width="200" height="64" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
    <text x="240" y="365" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">shared volume</text>

    <!-- focal: cluster IP, bound to the Pod boundary -->
    <rect x="160" y="88" width="160" height="32" rx="6" fill="#F5EFE4"></rect>
    <rect x="160" y="88" width="160" height="32" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
    <text x="240" y="109" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle">IP: 10.42.1.7</text>

    <!-- arrow label -->
    <rect x="192" y="172" width="96" height="20" rx="2" fill="#F5EFE4"></rect>
    <text x="240" y="186" fill="#1F4A4E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOCALHOST</text>
  </svg>