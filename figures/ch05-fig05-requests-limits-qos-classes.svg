<svg viewBox="0 0 800 1000" role="img" aria-labelledby="ch05-fig05-requests-limits-qos-classes-title ch05-fig05-requests-limits-qos-classes-desc" xmlns="http://www.w3.org/2000/svg" width="720" height="900">
    <title id="ch05-fig05-requests-limits-qos-classes-title">A container's resource band: request and limit thresholds</title>
    <desc id="ch05-fig05-requests-limits-qos-classes-desc">Vertical band for one container's use of one resource, marked at zero, at the request, and at the limit. The zone up to the request is reserved and is read by the kube-scheduler when it chooses a node. The zone between the request and the limit is allowed only if the node has spare capacity. The zone past the limit is not allowed and is enforced by the kubelet together with the kernel. A note below states that CPU is throttled at the limit while memory is OOM-killed reactively under node memory pressure.</desc>
    <defs>
      <marker id="arrow-soft" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#8A8D90"></polygon>
      </marker>
    </defs>

    <rect width="800" height="1000" fill="#F5EFE4"></rect>

    <!-- Zone fills, bottom to top: reserved / allowed-if-spare / not-allowed -->
    <rect x="300" y="240" width="200" height="160" fill="rgba(138,141,144,0.14)"></rect>
    <rect x="300" y="400" width="200" height="160" fill="rgba(11,30,59,0.06)"></rect>
    <rect x="300" y="560" width="200" height="160" fill="rgba(11,30,59,0.03)"></rect>

    <!-- Band left/right edges -->
    <line x1="300" y1="240" x2="300" y2="720" stroke="#8A8D90" stroke-width="1"></line>
    <line x1="500" y1="240" x2="500" y2="720" stroke="#8A8D90" stroke-width="1"></line>

    <!-- Unbounded continuation above the not-allowed zone -->
    <line x1="400" y1="240" x2="400" y2="132" stroke="#8A8D90" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#arrow-soft)"></line>

    <!-- Boundary rules: zero (ink), request (muted/teal), limit (accent/brass, focal) -->
    <line x1="300" y1="720" x2="500" y2="720" stroke="#0B1E3B" stroke-width="1.5"></line>
    <line x1="300" y1="560" x2="540" y2="560" stroke="#1F4A4E" stroke-width="2"></line>
    <line x1="300" y1="400" x2="540" y2="400" stroke="#B58B3E" stroke-width="2.5"></line>

    <!-- Left axis ticks -->
    <line x1="284" y1="720" x2="300" y2="720" stroke="#0B1E3B" stroke-width="1.5"></line>
    <line x1="284" y1="560" x2="300" y2="560" stroke="#1F4A4E" stroke-width="2"></line>
    <line x1="284" y1="400" x2="300" y2="400" stroke="#B58B3E" stroke-width="2.5"></line>

    <!-- Axis labels (generous left margin so nothing clips) -->
    <text x="256" y="725" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.06em" fill="#8A8D90">0</text>
    <text x="256" y="565" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#1F4A4E">REQUEST</text>
    <text x="256" y="405" text-anchor="end" font-family="'Fira Mono', monospace" font-size="14" font-weight="700" letter-spacing="0.12em" fill="#B58B3E">LIMIT</text>

    <!-- Zone descriptions, centered inside the band -->
    <text text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">
      <tspan x="400" y="632">Reserved for</tspan>
      <tspan x="400" y="654">this container</tspan>
    </text>
    <text text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="500" fill="#0B1E3B">
      <tspan x="400" y="472">Allowed if node</tspan>
      <tspan x="400" y="494">has spare capacity</tspan>
    </text>
    <text x="400" y="326" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em" fill="#0B1E3B">NOT ALLOWED</text>

    <!-- Attribution: who reads / enforces each boundary -->
    <text font-family="'Fira Sans', sans-serif" font-size="16">
      <tspan x="520" y="586" font-weight="600" fill="#1F4A4E">kube-scheduler</tspan>
      <tspan x="520" y="608" font-weight="400" fill="#8A8D90">reads it to choose the node</tspan>
    </text>
    <text font-family="'Fira Sans', sans-serif" font-size="16">
      <tspan x="520" y="426" font-weight="700" fill="#B58B3E">kubelet + kernel</tspan>
      <tspan x="520" y="448" font-weight="400" fill="#8A8D90">enforce it past this line</tspan>
    </text>

    <!-- Enforcement differs by resource -->
    <text x="60" y="804" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#0B1E3B">ENFORCEMENT DIFFERS BY RESOURCE</text>
    <line x1="60" y1="816" x2="740" y2="816" stroke="rgba(11,30,59,0.12)" stroke-width="1"></line>

    <text x="60" y="852" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#0B1E3B">cpu<tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" fill="#0B1E3B"> → </tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">throttled at the limit</tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" fill="#8A8D90"> — hard and immediate: you get slow</tspan></text>

    <text x="60" y="888" font-family="'Fira Mono', monospace" font-size="14" font-weight="500" fill="#0B1E3B">memory<tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" fill="#0B1E3B"> → </tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="600" fill="#0B1E3B">OOM-killed past it</tspan><tspan font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" fill="#8A8D90"> — reactive:</tspan><tspan x="156" dy="28" font-family="'Fira Sans', sans-serif" font-size="16" font-weight="400" fill="#8A8D90">under node memory pressure — you get slow, then dead</tspan></text>
  </svg>