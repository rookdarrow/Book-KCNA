<svg viewBox="0 0 672 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch09-fig01-network-model-four-rules-title ch09-fig01-network-model-four-rules-desc" width="760" height="846">
    <title id="ch09-fig01-network-model-four-rules-title">Flat Pod Network: Direct Connectivity Across Two Nodes</title>
    <desc id="ch09-fig01-network-model-four-rules-desc">Two worker nodes each host Pods with unique 10.244.x.x addresses linked by direct lines for a same-node Pod pair, a cross-node Pod pair, a Pod's two containers over localhost, and a Pod's kubelet, with no intermediary device on any connection.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#F5EFE4"></rect>

    <!-- ================= ZONES ================= -->
    <rect x="24" y="56" width="296" height="496" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
    <rect x="40" y="60" width="152" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="48" y="72" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.10em">NODE: WORKER-3</text>

    <rect x="352" y="56" width="296" height="496" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
    <rect x="368" y="60" width="184" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="376" y="72" fill="#0B1E3B" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.10em">NODE: WORKER-11</text>

    <!-- ================= CONNECTORS (drawn before nodes) ================= -->

    <!-- Same-node Pod-to-Pod: 10.244.1.7 -> 10.244.1.8 -->
    <line x1="172" y1="244" x2="172" y2="328" stroke="#0B1E3B" stroke-width="1.2"></line>

    <!-- Cross-node Pod-to-Pod (FOCAL): 10.244.1.7 -> 10.244.4.2 -->
    <!-- Thick brass casing -->
    <path d="M212,244 V276 Q212,284 220,284 H492 Q500,284 500,276 V160" fill="none" stroke="#B58B3E" stroke-width="6" stroke-linecap="round"></path>
    <!-- Cream tie overlay: redundant, non-color coding (double-line / rail texture) -->
    <path d="M212,244 V276 Q212,284 220,284 H492 Q500,284 500,276 V160" fill="none" stroke="#F5EFE4" stroke-width="2" stroke-dasharray="3,7" stroke-linecap="butt"></path>
    <rect x="276" y="260" width="160" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="356" y="272" fill="#0B1E3B" font-size="14" font-weight="500" text-anchor="middle" font-family="'Fira Mono', monospace" letter-spacing="0.06em">NO NAT · NO PROXY</text>

    <!-- kubelet watches Pod 10.244.1.8 -->
    <line x1="172" y1="448" x2="172" y2="400" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <rect x="182" y="416" width="76" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="220" y="428" fill="#1F4A4E" text-anchor="middle" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.06em">WATCHES</text>

    <!-- ================= NODES ================= -->

    <!-- Pod 10.244.1.7 (worker-3) — parent frame drawn first so its internal (lo) connector paints on top, not underneath -->
    <rect x="40" y="88" width="264" height="156" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="172" y="120" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">Pod</text>
    <text x="172" y="140" fill="#1F4A4E" font-size="14" text-anchor="middle" font-family="'Fira Mono', monospace">10.244.1.7</text>

    <!-- container-to-container over localhost (drawn after the Pod frame, before its two containers) -->
    <line x1="152" y1="196" x2="192" y2="196" stroke="#8A8D90" stroke-width="1"></line>
    <rect x="160" y="172" width="24" height="16" rx="2" fill="#F5EFE4"></rect>
    <text x="172" y="184" fill="#8A8D90" text-anchor="middle" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.04em">lo</text>

    <rect x="56" y="164" width="96" height="64" rx="4" fill="rgba(11,30,59,0.04)" stroke="#1F4A4E" stroke-width="0.8"></rect>
    <text x="104" y="200" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">ctr a</text>

    <rect x="192" y="164" width="96" height="64" rx="4" fill="rgba(11,30,59,0.04)" stroke="#1F4A4E" stroke-width="0.8"></rect>
    <text x="240" y="200" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">ctr b</text>

    <!-- Pod 10.244.1.8 (worker-3) -->
    <rect x="40" y="328" width="264" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="172" y="360" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">Pod</text>
    <text x="172" y="380" fill="#1F4A4E" font-size="14" text-anchor="middle" font-family="'Fira Mono', monospace">10.244.1.8</text>

    <!-- kubelet (worker-3) -->
    <rect x="100" y="448" width="144" height="56" rx="6" fill="rgba(11,30,59,0.05)" stroke="#1F4A4E" stroke-width="1"></rect>
    <text x="172" y="480" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">kubelet</text>

    <!-- Pod 10.244.4.2 (worker-11) -->
    <rect x="368" y="88" width="264" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="500" y="120" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">Pod</text>
    <text x="500" y="140" fill="#1F4A4E" font-size="14" text-anchor="middle" font-family="'Fira Mono', monospace">10.244.4.2</text>

    <!-- Pod 10.244.4.3 (worker-11) -->
    <rect x="368" y="328" width="264" height="72" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="500" y="360" fill="#0B1E3B" font-size="16" font-weight="500" text-anchor="middle" font-family="'Fira Sans', sans-serif">Pod</text>
    <text x="500" y="380" fill="#1F4A4E" font-size="14" text-anchor="middle" font-family="'Fira Mono', monospace">10.244.4.3</text>

    <!-- ================= EDITORIAL CALLOUT ================= -->
    <text x="336" y="600" fill="#0B1E3B" text-anchor="middle" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif">Every connection drawn is direct — nothing sits between the Pods.</text>

    <!-- ================= LEGEND ================= -->
    <line x1="24" y1="628" x2="648" y2="628" stroke="#8A8D90" stroke-width="0.8"></line>
    <text x="24" y="652" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="24" y1="680" x2="56" y2="680" stroke="#0B1E3B" stroke-width="1.2"></line>
    <text x="68" y="684" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">POD ↔ POD · SAME NODE</text>

    <line x1="336" y1="680" x2="368" y2="680" stroke="#B58B3E" stroke-width="6" stroke-linecap="round"></line>
    <line x1="336" y1="680" x2="368" y2="680" stroke="#F5EFE4" stroke-width="2" stroke-dasharray="3,7"></line>
    <text x="380" y="684" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">POD ↔ POD · CROSS NODE</text>

    <line x1="24" y1="712" x2="56" y2="712" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <text x="68" y="716" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">KUBELET WATCHES POD</text>

    <line x1="336" y1="712" x2="368" y2="712" stroke="#8A8D90" stroke-width="1"></line>
    <text x="380" y="716" fill="#0B1E3B" font-size="14" font-family="'Fira Mono', monospace">CONTAINER ↔ CONTAINER (LO)</text>
  </svg>