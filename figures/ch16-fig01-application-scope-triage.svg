<svg viewBox="0 0 580 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16-fig01-application-scope-triage-title ch16-fig01-application-scope-triage-desc" width="640" height="768">
      <title id="ch16-fig01-application-scope-triage-title">Application-scope triage: four starting questions</title>
      <desc id="ch16-fig01-application-scope-triage-desc">Tree diagram: platform scope hands off from Chapter 13 into application scope, which branches into four triage questions read top to bottom — is it running, is it healthy and configured, is it reachable, and is it per-replica.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- Handoff caption -->
      <text x="152" y="44" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FROM CH 13</text>
      <text x="152" y="60" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLATFORM SCOPE DISCHARGED</text>

      <!-- Connectors first, behind nodes -->
      <!-- Incoming handoff arrow -->
      <path d="M 152 76 L 152 140" fill="none" stroke="#1F4A4E" stroke-width="1" marker-end="url(#arrow)"></path>

      <!-- Root -> bus -->
      <path d="M 272 196 L 288 196" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <!-- Vertical bus spanning all four branch rows -->
      <path d="M 288 180 L 288 516" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <!-- Bus -> each branch -->
      <path d="M 288 180 L 300 180" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 288 292 L 300 292" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 288 404 L 300 404" fill="none" stroke="#1F4A4E" stroke-width="1"></path>
      <path d="M 288 516 L 300 516" fill="none" stroke="#1F4A4E" stroke-width="1"></path>

      <!-- Root node: Application scope (focal) -->
      <rect x="32" y="140" width="240" height="112" rx="6" fill="#F5EFE4"></rect>
      <rect x="32" y="140" width="240" height="112" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="152" y="184" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Application scope</text>
      <text x="152" y="204" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">this book, this chapter,</text>
      <text x="152" y="224" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">your problem</text>

      <!-- Branch 1: Running? (§2) -->
      <rect x="300" y="140" width="240" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="300" y="140" width="240" height="80" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="420" y="176" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Running?</text>
      <text x="420" y="200" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(§2)</text>

      <!-- Branch 2: Healthy? Configured? (§3) -->
      <rect x="300" y="252" width="240" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="300" y="252" width="240" height="80" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="420" y="288" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Healthy? Configured?</text>
      <text x="420" y="312" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(§3)</text>

      <!-- Branch 3: Reachable? (§4 → §5) -->
      <rect x="300" y="364" width="240" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="300" y="364" width="240" height="80" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="420" y="400" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Reachable?</text>
      <text x="420" y="424" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(§4 → §5)</text>

      <!-- Branch 4: Per-replica? (§6) -->
      <rect x="300" y="476" width="240" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="300" y="476" width="240" height="80" rx="6" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="420" y="512" fill="#0B1E3B" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Per-replica?</text>
      <text x="420" y="536" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle">(§6)</text>

      <!-- Legend -->
      <line x1="32" y1="596" x2="548" y2="596" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
      <text x="32" y="612" fill="#1F4A4E" font-size="14" font-family="'Fira Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="624" width="20" height="16" rx="2" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.2"></rect>
      <text x="60" y="636" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Root — application scope</text>

      <rect x="280" y="624" width="20" height="16" rx="2" fill="rgba(11,30,59,0.04)" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="308" y="636" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif">Triage question</text>

      <text x="32" y="664" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" font-style="italic">Top to bottom — each question eliminates ground before the next.</text>
    </svg>