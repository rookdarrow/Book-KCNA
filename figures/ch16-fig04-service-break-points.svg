<svg viewBox="0 0 912 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16fig04-title ch16fig04-desc" width="1000" height="505">
    <title id="ch16fig04-title">Service failure break points along the request path</title>
    <desc id="ch16fig04-desc">A request path runs from client to DNS name to Service to EndpointSlice to Pod to container port; callouts mark where breaks 1, 2, 3, and 4 occur, and a legend distinguishes upstream-of-readiness failures with no ready endpoints from a downstream failure with ready endpoints and a request that still fails, and from never reaching the Service at all.</desc>
    <defs>
      <marker id="arr-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon></marker>
      <marker id="arr-point" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B1E3B"></polygon></marker>
    </defs>

    <rect width="912" height="460" fill="#F5EFE4"></rect>

    <!-- ===== Connectors (drawn before boxes) ===== -->

    <!-- Primary request-path chain, left to right -->
    <line x1="120" y1="64" x2="152" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"></line>
    <line x1="256" y1="64" x2="288" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"></line>
    <line x1="392" y1="64" x2="424" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"></line>
    <line x1="568" y1="64" x2="600" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"></line>
    <line x1="680" y1="64" x2="712" y2="64" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arr-flow)"></line>

    <!-- Drops to break callouts -->
    <line x1="204" y1="88" x2="204" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"></line>
    <line x1="496" y1="88" x2="496" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"></line>
    <line x1="784" y1="88" x2="784" y2="128" stroke="#0B1E3B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-point)"></line>

    <!-- ===== Request-path chain nodes ===== -->

    <rect x="32" y="40" width="88" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="76" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">client</text>

    <rect x="152" y="40" width="104" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="204" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">DNS name</text>

    <rect x="288" y="40" width="104" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="340" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">Service</text>

    <rect x="424" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="496" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">EndpointSlice</text>

    <rect x="600" y="40" width="80" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="640" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">Pod</text>

    <rect x="712" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="784" y="69" font-family="'Fira Sans'" font-size="16" font-weight="500" fill="#0B1E3B" text-anchor="middle">container port</text>

    <!-- ===== Break callouts ===== -->

    <!-- BREAK 4 — beside the whole path -->
    <rect x="96" y="128" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="204" y="154" font-family="'Fira Sans'" font-size="18" font-weight="600" fill="#0B1E3B" letter-spacing="0.04em" text-anchor="middle">BREAK 4</text>
    <text x="204" y="180" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">name doesn't resolve</text>
    <text x="204" y="201" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">to this Service</text>

    <!-- BREAK 1+2 — focal: upstream of readiness, no ready endpoints -->
    <rect x="372" y="128" width="248" height="164" rx="6" fill="rgba(181,139,62,0.10)" stroke="#B58B3E" stroke-width="1.5"></rect>
    <text x="496" y="154" font-family="'Fira Sans'" font-size="18" font-weight="700" fill="#B58B3E" letter-spacing="0.04em" text-anchor="middle">BREAK 1+2</text>
    <text x="496" y="178" font-family="'Fira Sans'" font-size="14" font-weight="600" fill="#0B1E3B" letter-spacing="0.06em" text-anchor="middle">NO READY ENDPOINTS</text>
    <text x="496" y="204" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">1 selector mismatch</text>
    <text x="496" y="225" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">→ slice empty</text>
    <text x="496" y="250" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">2 not Ready</text>
    <text x="496" y="271" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">→ ready: false</text>

    <!-- BREAK 3 — downstream of readiness -->
    <rect x="676" y="128" width="216" height="96" rx="6" fill="#ffffff" stroke="#0B1E3B" stroke-width="1"></rect>
    <text x="784" y="154" font-family="'Fira Sans'" font-size="18" font-weight="600" fill="#0B1E3B" letter-spacing="0.04em" text-anchor="middle">BREAK 3</text>
    <text x="784" y="180" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">port ≠ targetPort</text>
    <text x="784" y="201" font-family="'Fira Sans'" font-size="14" font-weight="400" fill="#0B1E3B" text-anchor="middle">(endpoints ARE ready)</text>

    <!-- ===== Legend ===== -->
    <line x1="32" y1="332" x2="880" y2="332" stroke="rgba(11,30,59,0.12)" stroke-width="0.8"></line>
    <text x="32" y="348" font-family="'Fira Mono'" font-size="14" font-weight="500" fill="#8A8D90" letter-spacing="0.12em" text-anchor="start">LEGEND</text>

    <text x="32" y="372" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">UPSTREAM</tspan> of readiness … breaks 1 and 2 → NO READY ENDPOINTS</text>
    <text x="32" y="400" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">DOWNSTREAM</tspan> of readiness … break 3 → ENDPOINTS READY, request still fails</text>
    <text x="32" y="428" font-family="'Fira Sans'" font-size="16" fill="#0B1E3B" text-anchor="start"><tspan font-weight="700">BESIDE</tspan> the whole path … break 4 → you never reached this Service at all</text>
  </svg>