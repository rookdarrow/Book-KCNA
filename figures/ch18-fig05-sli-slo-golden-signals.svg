<svg viewBox="0 0 720 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-fig05-sli-slo-golden-signals-title ch18-fig05-sli-slo-golden-signals-desc" width="640" height="854">
      <title id="ch18-fig05-sli-slo-golden-signals-title">SLI to SLO to SLA, and the four golden signals</title>
      <desc id="ch18-fig05-sli-slo-golden-signals-desc">On the left, an internal frame holds an SLI measured from the user's perspective feeding an SLO commitment target, separated by a boundary from an external frame holding an SLA contract with consequences; on the right, a two-by-two grid of latency, traffic, errors, and saturation shows latency increases as a leading indicator of saturation.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#B58B3E"></polygon>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1F4A4E"></polygon>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5EFE4"></rect>

      <!-- ===== Section A eyebrow ===== -->
      <text x="360" y="44" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MEASUREMENT → COMMITMENT → CONTRACT</text>

      <!-- ===== Zones (drawn before arrows/nodes) ===== -->
      <rect x="220" y="64" width="280" height="268" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <rect x="228" y="68" width="76" height="12" rx="2" fill="#F5EFE4"></rect>
      <text x="266" y="77" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">INTERNAL</text>

      <rect x="220" y="396" width="280" height="132" rx="8" fill="rgba(11,30,59,0.02)" stroke="rgba(11,30,59,0.10)" stroke-width="0.8"></rect>
      <rect x="228" y="400" width="84" height="12" rx="2" fill="#F5EFE4"></rect>
      <text x="270" y="409" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EXTERNAL</text>

      <!-- Boundary divider -->
      <line x1="220" y1="364" x2="500" y2="364" stroke="#8A8D90" stroke-width="1" stroke-dasharray="6,4"></line>
      <rect x="248" y="356" width="90" height="16" fill="#F5EFE4"></rect>
      <text x="293" y="368" fill="#8A8D90" font-size="14" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BOUNDARY</text>

      <!-- ===== Arrows (before nodes) ===== -->
      <!-- SLI -> SLO : focal "measures" relationship, thickened brass stroke -->
      <line x1="360" y1="192" x2="360" y2="232" stroke="#B58B3E" stroke-width="3" marker-end="url(#arrow-accent)"></line>
      <rect x="366" y="204" width="84" height="16" fill="#F5EFE4"></rect>
      <text x="374" y="216" fill="#B58B3E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" letter-spacing="0.04em">MEASURES</text>

      <!-- SLO -> SLA : crosses the boundary into the external contract -->
      <line x1="360" y1="312" x2="360" y2="428" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></line>

      <!-- LATENCY -> SATURATION : leading-indicator relationship -->
      <path d="M 344 632 H 352 Q 360 632 360 640 V 768 Q 360 776 368 776 H 376" fill="none" stroke="#1F4A4E" stroke-width="1.2" marker-end="url(#arrow)"></path>
      <rect x="366" y="696" width="140" height="16" fill="#F5EFE4"></rect>
      <text x="374" y="708" fill="#1F4A4E" font-size="14" font-weight="400" font-family="'Fira Mono', monospace" letter-spacing="0.04em">LEADING SIGNAL</text>

      <!-- ===== Nodes ===== -->
      <!-- SLI -->
      <rect x="236" y="96" width="248" height="96" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="360" y="136" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">SLI</text>
      <text x="360" y="154" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the measurement from the</text>
      <text x="360" y="172" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">user's perspective</text>

      <!-- SLO -->
      <rect x="236" y="232" width="248" height="80" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="360" y="274" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">SLO</text>
      <text x="360" y="290" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">the target you commit to</text>

      <!-- SLA (external treatment: sits in the external zone) -->
      <rect x="236" y="428" width="248" height="80" rx="6" fill="#F5EFE4"></rect>
      <rect x="236" y="428" width="248" height="80" rx="6" fill="rgba(11,30,59,0.03)" stroke="rgba(11,30,59,0.30)" stroke-width="1"></rect>
      <text x="360" y="470" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">SLA</text>
      <text x="360" y="486" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">contract with consequences</text>

      <!-- Callout: SLO vs SLA differentiator -->
      <text x="680" y="420" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="end">An SLO without</text>
      <text x="680" y="440" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="end">consequences is</text>
      <text x="680" y="460" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="end">just an SLO —</text>
      <text x="680" y="480" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="end">not an SLA.</text>
      <path d="M 560 448 Q 522 460 484 468" fill="none" stroke="rgba(31,74,78,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
      <circle cx="484" cy="468" r="2" fill="#1F4A4E"></circle>

      <!-- ===== Section B eyebrow ===== -->
      <text x="360" y="552" fill="#8A8D90" font-size="14" font-weight="500" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.12em">THE FOUR GOLDEN SIGNALS</text>

      <!-- Golden signal grid -->
      <rect x="40" y="576" width="304" height="112" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="192" y="622" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">LATENCY</text>
      <text x="192" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">time to serve a request</text>
      <text x="192" y="658" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">track OK and FAIL separately</text>

      <rect x="376" y="576" width="304" height="112" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="528" y="622" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">TRAFFIC</text>
      <text x="528" y="640" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">demand on the system</text>
      <text x="528" y="658" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">req/sec, sessions</text>

      <rect x="40" y="720" width="304" height="112" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="192" y="766" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">ERRORS</text>
      <text x="192" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">rate of failed requests</text>
      <text x="192" y="802" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">explicit, implicit, or by policy</text>

      <rect x="376" y="720" width="304" height="112" rx="6" fill="#F5EFE4" stroke="#0B1E3B" stroke-width="1"></rect>
      <text x="528" y="766" fill="#0B1E3B" font-size="16" font-weight="500" font-family="'Fira Sans', sans-serif" text-anchor="middle">SATURATION</text>
      <text x="528" y="784" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">how full the service is</text>
      <text x="528" y="802" fill="#1F4A4E" font-size="14" font-family="'Fira Sans', sans-serif" text-anchor="middle">degrades before 100%</text>

      <!-- Callout: latency as a leading indicator -->
      <text x="460" y="854" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">Latency increases are often a</text>
      <text x="460" y="874" fill="#1F4A4E" font-size="16" font-style="italic" font-family="'Fira Sans', sans-serif" text-anchor="middle">leading indicator of saturation.</text>
      <path d="M 468 844 Q 500 836 528 832" fill="none" stroke="rgba(31,74,78,0.35)" stroke-width="1" stroke-dasharray="4,3"></path>
      <circle cx="528" cy="832" r="2" fill="#1F4A4E"></circle>
    </svg>